name: Publish Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build (e.g., v5.0.0-rc.1)"
        required: false
        type: string
      ref:
        description: "Git ref (branch, tag, or commit) to build; defaults to the tag"
        required: false
        type: string
      targets:
        description: "Comma-separated list of release targets, or 'all'"
        required: false
        type: string
        default: "all"
      dry_run:
        description: "Prepare artifacts without publishing"
        required: false
        type: boolean
        default: false
      republish:
        description: "Delete and re-create the tag on current HEAD before publishing"
        required: false
        type: boolean
        default: false
      force_republish:
        description: "Force republish targets whose registry version already exists"
        required: false
        type: boolean
        default: false
  release:
    types: [published]
  repository_dispatch:
    types: [publish-release]

env:
  GLIBC_FLOOR: "2.28"
  # jsDelivr (which serves the published @xberg-io/xberg-wasm package to the
  # live browser demo) hard-caps a single file at 50 MB and rejects the whole
  # package past 150 MB total -- either cap breached serves a 403 to every
  # consumer, which has already happened once (commit 8ad6b2f4ccf dropped
  # tree-sitter from wasm-target purely to get back under the per-file cap).
  # jsDelivr's caps are BINARY, not decimal -- measured against the live CDN on
  # 2026-08-13, not read off the docs (which never state a byte count): a
  # 52,190,688-byte npm file is served 200 and 52,537,424 is refused 403, so the
  # per-file cap is 50 MiB = 52,428,800. Decimal 50,000,000 is ruled out by that
  # served file. Package cap likewise 150 MiB = 157,286,400, measured on UNPACKED
  # size, not the tarball. Note the npm per-file cap is UNDOCUMENTED (jsDelivr's
  # README states only the 20 MiB GitHub figure), so it can move without notice.
  #
  # The per-file budget was 40 MiB (80% of the cap). The bundle is now 50,394,309
  # bytes -- 120% of that budget but still only 96.1% of the real cap, so the gate
  # was failing while jsDelivr was not. Raised to 49 MiB, which still fails CI
  # BEFORE jsDelivr 403s every consumer, but stops blocking a package that is
  # genuinely servable. This is deliberately tight: it leaves ~1 MB, and the
  # bundle grew +2.46 MB in the 2.5 weeks to 2026-08-12 (~1 MB/week), so this
  # buys roughly a week and then demands the real cut rather than another bump.
  # The cut is tracked and is NOT a config flip: dropping `ner-candle-wasm` fails
  # to compile because crates/xberg-wasm/src/bridge/ner_model.rs (hand-written)
  # imports CandleBackend unconditionally and bridge/mod.rs declares it ungated,
  # and xberg-wasm/Cargo.toml is alef-generated with no ner feature to gate on --
  # so it needs an alef.toml feature + regen + source gating. ~keep
  WASM_MAX_FILE_BYTES: "51380224" # 49 MiB; jsDelivr per-file hard cap is 50 MiB (52,428,800)
  WASM_MAX_PACKAGE_BYTES: "125829120" # 120 MiB; jsDelivr per-package hard cap is 150 MiB (157,286,400)

permissions:
  contents: read
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ (github.event_name == 'workflow_dispatch' && (github.event.inputs.ref || github.event.inputs.tag)) || github.ref || github.run_id }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare metadata
    if: >-
      ${{ github.event_name != 'release'
      || (startsWith(github.event.release.tag_name, 'v')
      && github.actor != 'xberg-dev-publisher[bot]') }}
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      ref: ${{ steps.meta.outputs.ref }}
      checkout_ref: ${{ steps.meta.outputs.checkout_ref }}
      target_sha: ${{ steps.meta.outputs.target_sha }}
      matrix_ref: ${{ steps.meta.outputs.matrix_ref }}
      is_tag: ${{ steps.meta.outputs.is_tag }}
      is_prerelease: ${{ steps.meta.outputs.is_prerelease }}
      npm_tag: ${{ steps.meta.outputs.npm_tag }}
      dry_run: ${{ steps.meta.outputs.dry_run }}
      force_republish: ${{ steps.meta.outputs.force_republish }}
      release_targets: ${{ steps.meta.outputs.release_targets }}
      release_any: ${{ steps.meta.outputs.release_any }}
      release_python: ${{ steps.meta.outputs.release_python }}
      release_node: ${{ steps.meta.outputs.release_node }}
      release_ruby: ${{ steps.meta.outputs.release_ruby }}
      release_cli: ${{ steps.meta.outputs.release_cli }}
      release_crates: ${{ steps.meta.outputs.release_crates }}
      release_homebrew: ${{ steps.meta.outputs.release_homebrew }}
      release_scoop: ${{ steps.meta.outputs.release_scoop }}
      release_java: ${{ steps.meta.outputs.release_java }}
      release_csharp: ${{ steps.meta.outputs.release_csharp }}
      release_go: ${{ steps.meta.outputs.release_go }}
      release_wasm: ${{ steps.meta.outputs.release_wasm }}
      release_php: ${{ steps.meta.outputs.release_php }}
      release_elixir: ${{ steps.meta.outputs.release_elixir }}
      release_c_ffi: ${{ steps.meta.outputs.release_c_ffi }}
      release_dart: ${{ steps.meta.outputs.release_dart }}
      release_swift: ${{ steps.meta.outputs.release_swift }}
      release_zig: ${{ steps.meta.outputs.release_zig }}
      release_kotlin: ${{ steps.meta.outputs.release_kotlin }}
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          owner: xberg-io

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ (inputs.republish == true && (inputs.ref || github.event.repository.default_branch)) || inputs.ref || inputs.tag || github.ref }}
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: true

      - name: Configure git identity
        run: |
          git config user.name "xberg-dev-publisher[bot]"
          git config user.email "291994444+xberg-dev-publisher[bot]@users.noreply.github.com"

      - name: Retag for republish
        if: ${{ inputs.republish == true || github.event.client_payload.republish == true }}
        uses: xberg-io/actions/retag-for-republish@v1
        with:
          tag: ${{ inputs.tag || github.event.client_payload.tag }}
          token: ${{ steps.app-token.outputs.token }}

      - name: Resolve release metadata
        id: meta
        uses: xberg-io/actions/prepare-release-metadata@v1

      # Created NON-draft (published) so the `release: [created]` event fires
      # immediately and publish-docker.yaml runs as an independent parallel
      # workflow (App-token-created events do trigger workflows). Assets upload
      # into the live release over the run; finalize-release is idempotent and
      # just confirms the prerelease flag at the end. ~keep
      - name: Ensure GitHub Release exists for tag
        if: ${{ steps.meta.outputs.is_tag == 'true' && steps.meta.outputs.dry_run != 'true' }}
        uses: xberg-io/actions/publish-github-release@v1
        with:
          tag: ${{ steps.meta.outputs.tag }}
          target: ${{ steps.meta.outputs.target_sha }}
          notes: "Release ${{ steps.meta.outputs.tag }}"
          draft: "false"
          prerelease: ${{ steps.meta.outputs.is_prerelease }}
          token: ${{ steps.app-token.outputs.token }}

  validate-versions:
    name: Validate language manifest versions
    needs: prepare
    # Runs on dry runs too. Checkout + a version comparison, no secret, no mutation, so there
    # is nothing to guard against -- and catching a language manifest that disagrees with the
    # release version is precisely what a dry run is for. It can legitimately go red when the
    # version has not been bumped yet; that is the intended signal, not a flake. ~keep
    if: ${{ needs.prepare.outputs.is_tag == 'true' || needs.prepare.outputs.dry_run == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}
          fetch-depth: 0

      - name: Validate versions
        uses: xberg-io/actions/validate-versions@v1
        with:
          version: ${{ needs.prepare.outputs.version }}

  check-pypi:
    name: Check PyPI for existing version
    needs: prepare
    if: ${{ needs.prepare.outputs.is_tag == 'true' && needs.prepare.outputs.release_python == 'true' }}
    runs-on: ubuntu-latest
    outputs:
      exists: ${{ steps.check.outputs.exists }}
    steps:
      - id: check
        uses: xberg-io/actions/check-registry@v1
        with:
          registry: pypi
          package: xberg
          version: ${{ needs.prepare.outputs.version }}

  check-npm:
    name: Check npm for existing versions
    needs: prepare
    if: ${{ needs.prepare.outputs.is_tag == 'true' && (needs.prepare.outputs.release_node == 'true' || needs.prepare.outputs.release_wasm == 'true') }}
    runs-on: ubuntu-latest
    outputs:
      node_exists: ${{ steps.check.outputs.exists }}
      wasm_exists: ${{ steps.check.outputs.wasm_exists }}
    steps:
      - id: check
        uses: xberg-io/actions/check-registry@v1
        with:
          registry: npm
          package: "@xberg-io/xberg"
          version: ${{ needs.prepare.outputs.version }}
          extra-packages: |
            wasm_exists=@xberg-io/xberg-wasm

  check-rubygems:
    name: Check RubyGems for existing version
    needs: prepare
    if: ${{ needs.prepare.outputs.is_tag == 'true' && needs.prepare.outputs.release_ruby == 'true' }}
    runs-on: ubuntu-latest
    outputs:
      exists: ${{ steps.check.outputs.exists }}
    steps:
      - id: check
        uses: xberg-io/actions/check-registry@v1
        with:
          registry: rubygems
          package: xberg
          version: ${{ needs.prepare.outputs.version }}

  check-maven:
    name: Check Maven Central for existing version
    needs: prepare
    if: ${{ needs.prepare.outputs.is_tag == 'true' && (needs.prepare.outputs.release_java == 'true' || needs.prepare.outputs.release_kotlin == 'true') }}
    runs-on: ubuntu-latest
    outputs:
      java_exists: ${{ steps.check.outputs.exists }}
      kotlin_exists: ${{ steps.check.outputs.kotlin_exists }}
    steps:
      - id: check
        uses: xberg-io/actions/check-registry@v1
        with:
          registry: maven
          package: "io.xberg:xberg"
          version: ${{ needs.prepare.outputs.version }}
          extra-packages: |
            kotlin_exists=io.xberg:xberg-android

  check-nuget:
    name: Check NuGet for existing version
    needs: prepare
    if: ${{ needs.prepare.outputs.is_tag == 'true' && needs.prepare.outputs.release_csharp == 'true' }}
    runs-on: ubuntu-latest
    outputs:
      exists: ${{ steps.check.outputs.exists }}
    steps:
      - id: check
        uses: xberg-io/actions/check-registry@v1
        with:
          registry: nuget
          package: Xberg
          version: ${{ needs.prepare.outputs.version }}

  check-packagist:
    name: Check Packagist for existing version
    needs: prepare
    if: ${{ needs.prepare.outputs.is_tag == 'true' && needs.prepare.outputs.release_php == 'true' }}
    runs-on: ubuntu-latest
    outputs:
      exists: ${{ steps.check.outputs.exists }}
    steps:
      - id: check
        uses: xberg-io/actions/check-registry@v1
        with:
          registry: packagist
          package: xberg/xberg
          version: ${{ needs.prepare.outputs.version }}

  check-cratesio:
    name: Check crates.io for existing versions
    needs: prepare
    if: ${{ needs.prepare.outputs.is_tag == 'true' && needs.prepare.outputs.release_crates == 'true' }}
    runs-on: ubuntu-latest
    outputs:
      xberg_exists: ${{ steps.check.outputs.exists }}
      tesseract_exists: ${{ steps.check.outputs.tesseract_exists }}
      paddle_exists: ${{ steps.check.outputs.paddle_exists }}
      candle_exists: ${{ steps.check.outputs.candle_exists }}
      libheif_exists: ${{ steps.check.outputs.libheif_exists }}
      gliner_exists: ${{ steps.check.outputs.gliner_exists }}
      libwpd_exists: ${{ steps.check.outputs.libwpd_exists }}
      native_pdf_exists: ${{ steps.check.outputs.native_pdf_exists }}
      pdfium_exists: ${{ steps.check.outputs.pdfium_exists }}
      cli_exists: ${{ steps.check.outputs.cli_exists }}
      all_exist: ${{ steps.derive.outputs.all_exist }}
    steps:
      - id: check
        uses: xberg-io/actions/check-registry@v1
        with:
          registry: cratesio
          package: xberg
          version: ${{ needs.prepare.outputs.version }}
          extra-packages: |
            tesseract_exists=xberg-tesseract
            paddle_exists=xberg-paddle-ocr
            candle_exists=xberg-candle-ocr
            libheif_exists=xberg-libheif
            gliner_exists=xberg-gliner
            libwpd_exists=xberg-libwpd
            native_pdf_exists=xberg-native-pdf
            pdfium_exists=xberg-pdfium-render
            cli_exists=xberg-cli

      - id: derive
        run: |
          if [[ "${{ steps.check.outputs.exists }}" == "true" \
            && "${{ steps.check.outputs.tesseract_exists }}" == "true" \
            && "${{ steps.check.outputs.paddle_exists }}" == "true" \
            && "${{ steps.check.outputs.candle_exists }}" == "true" \
            && "${{ steps.check.outputs.libheif_exists }}" == "true" \
            && "${{ steps.check.outputs.gliner_exists }}" == "true" \
            && "${{ steps.check.outputs.libwpd_exists }}" == "true" \
            && "${{ steps.check.outputs.native_pdf_exists }}" == "true" \
            && "${{ steps.check.outputs.pdfium_exists }}" == "true" \
            && "${{ steps.check.outputs.cli_exists }}" == "true" ]]; then
            echo "all_exist=true" >> "$GITHUB_OUTPUT"
          else
            echo "all_exist=false" >> "$GITHUB_OUTPUT"
          fi

  check-hex:
    name: Check Hex.pm for existing versions
    needs: prepare
    if: ${{ needs.prepare.outputs.is_tag == 'true' && needs.prepare.outputs.release_elixir == 'true' }}
    runs-on: ubuntu-latest
    outputs:
      elixir_exists: ${{ steps.check.outputs.exists }}
    steps:
      - id: check
        uses: xberg-io/actions/check-registry@v1
        with:
          registry: hex
          package: xberg
          version: ${{ needs.prepare.outputs.version }}

  check-pub:
    name: Check pub.dev for existing version
    needs: prepare
    if: ${{ needs.prepare.outputs.is_tag == 'true' && needs.prepare.outputs.release_dart == 'true' }}
    runs-on: ubuntu-latest
    outputs:
      exists: ${{ steps.check.outputs.exists }}
    steps:
      - id: check
        uses: xberg-io/actions/check-registry@v1
        with:
          registry: pub
          package: xberg
          version: ${{ needs.prepare.outputs.version }}

  check-zig:
    name: Check Zig package presence
    needs: prepare
    if: ${{ (needs.prepare.outputs.is_tag == 'true' || needs.prepare.outputs.dry_run == 'true') && needs.prepare.outputs.release_zig == 'true' }}
    runs-on: ubuntu-latest
    outputs:
      exists: ${{ steps.check.outputs.exists }}
    steps:
      - id: check
        uses: xberg-io/actions/check-registry@v1
        with:
          registry: github-release
          package: xberg-zig-v${{ needs.prepare.outputs.version }}.tar.gz
          version: ${{ needs.prepare.outputs.version }}
          repo: ${{ github.repository }}
          assets: xberg-zig-v${{ needs.prepare.outputs.version }}.tar.gz

  check-homebrew:
    name: Check Homebrew tap for formula
    needs: prepare
    if: ${{ needs.prepare.outputs.is_tag == 'true' && needs.prepare.outputs.release_homebrew == 'true' }}
    runs-on: ubuntu-latest
    outputs:
      exists: ${{ steps.check.outputs.exists }}
    steps:
      - id: check
        uses: xberg-io/actions/check-registry@v1
        with:
          registry: homebrew
          package: xberg
          version: ${{ needs.prepare.outputs.version }}
          tap-repo: xberg-io/homebrew-tap

  check-cli:
    name: Check GitHub Release for CLI assets
    needs: prepare
    # Run in dry-run too (mirrors the zig check gate) so a `dry_run` dispatch does
    # not skip check-cli — otherwise every CLI build job (which `needs` this) would
    # cascade-skip, and the CLI lane (incl. the static binstall Docker build) could
    # never be exercised without cutting a real tag.
    if: ${{ (needs.prepare.outputs.is_tag == 'true' || needs.prepare.outputs.dry_run == 'true') && needs.prepare.outputs.release_cli == 'true' }}
    runs-on: ubuntu-latest
    outputs:
      exists: ${{ steps.check.outputs.exists }}
    steps:
      - id: check
        uses: xberg-io/actions/check-registry@v1
        with:
          registry: github-release
          package: xberg
          version: ${{ needs.prepare.outputs.version }}
          repo: xberg-io/xberg
          tag: ${{ needs.prepare.outputs.tag }}
          asset-prefix: xberg-cli-
          assets: |
            xberg-cli-aarch64-apple-darwin.tar.gz,xberg-cli-x86_64-apple-darwin.tar.gz,xberg-cli-aarch64-unknown-linux-gnu.tar.gz,xberg-cli-aarch64-unknown-linux-musl.tar.gz,xberg-cli-x86_64-unknown-linux-gnu.tar.gz,xberg-cli-x86_64-unknown-linux-musl.tar.gz,xberg-cli-x86_64-pc-windows-msvc.zip

  check-go:
    name: Check GitHub Release for Go FFI assets
    needs: prepare
    if: ${{ needs.prepare.outputs.is_tag == 'true' && needs.prepare.outputs.release_go == 'true' }}
    runs-on: ubuntu-latest
    outputs:
      exists: ${{ steps.check.outputs.exists }}
    steps:
      - id: check
        uses: xberg-io/actions/check-registry@v1
        with:
          registry: github-release
          package: xberg
          version: ${{ needs.prepare.outputs.version }}
          repo: xberg-io/xberg
          tag: ${{ needs.prepare.outputs.tag }}
          asset-prefix: xberg-go-

  check-c-ffi:
    name: Check GitHub Release for C FFI assets
    needs: prepare
    if: ${{ needs.prepare.outputs.is_tag == 'true' && needs.prepare.outputs.release_c_ffi == 'true' }}
    runs-on: ubuntu-latest
    outputs:
      exists: ${{ steps.check.outputs.exists }}
    steps:
      - id: check
        uses: xberg-io/actions/check-registry@v1
        with:
          registry: github-release
          package: xberg
          version: ${{ needs.prepare.outputs.version }}
          repo: xberg-io/xberg
          tag: ${{ needs.prepare.outputs.tag }}
          asset-prefix: xberg-ffi-

  check-elixir-release:
    name: Check GitHub Release for Elixir NIF assets
    needs: prepare
    if: ${{ needs.prepare.outputs.is_tag == 'true' && needs.prepare.outputs.release_elixir == 'true' }}
    runs-on: ubuntu-latest
    outputs:
      exists: ${{ steps.check.outputs.exists }}
    steps:
      - id: check
        uses: xberg-io/actions/check-registry@v1
        with:
          registry: github-release
          package: xberg
          version: ${{ needs.prepare.outputs.version }}
          repo: xberg-io/xberg
          tag: ${{ needs.prepare.outputs.tag }}
          asset-prefix: libxberg_nif-

  python-wheels:
    name: Build Python wheels (${{ matrix.os }})
    needs: [prepare, check-pypi]
    if: ${{ needs.prepare.outputs.release_python == 'true' && (needs.check-pypi.outputs.exists != 'true' || needs.prepare.outputs.force_republish == 'true') }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, macos-15, macos-15-intel]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}
          fetch-depth: 0

          submodules: false
      - name: Install system dependencies
        uses: ./.github/actions/install-system-deps

      # pyke's default download strategy links a Windows ORT build that always
      # imports DirectML.dll (ort-sys's static_link_prerequisites is
      # unconditional on windows targets), which this repo never ships and
      # which no arm of ort_discovery.rs ever selects -- so `import xberg`
      # fails on a clean Windows host before any Rust code runs
      # (xberg-io/xberg#1456). This step forces ORT_STRATEGY=system (the same
      # strategy every other Windows leg in this workflow already uses),
      # which hits an early return in ort-sys before static_link_prerequisites
      # runs, so the DirectML import is never introduced in the first place.
      - name: Setup ONNX Runtime (Windows)
        if: runner.os == 'Windows'
        uses: ./.github/actions/setup-onnx-runtime
        with:
          ort-version: "1.24.2"
          dest-dir: crates/xberg-py

      - name: Build wheels
        uses: xberg-io/actions/build-python-wheels@v1
        with:
          python-version: "3.13"
          package-dir: packages/python
          cibw-build: "cp310-*"
          upload-artifact: "false"
          build-libheif: "true"
          manylinux-x86_64-image: "manylinux_2_28"
          manylinux-aarch64-image: "manylinux_2_28"
          cibw-before-build-linux: |
            set -euo pipefail
            pip install maturin uv
            source ~/.cargo/env
            # Prevent GCC 14+ from emitting C23-versioned glibc symbols (__isoc23_strtoll etc.)
            # that require glibc ≥ 2.38. Fixes #588: ensures wheels work on Debian 12 (glibc 2.36),
            # Ubuntu 22.04 LTS (2.35), and RHEL 8 (2.28).
            export CFLAGS="-std=gnu11"
            export CXXFLAGS="-std=gnu++17"
            export CPPFLAGS="-std=gnu11"
            export CMAKE_C_FLAGS="${CFLAGS}"
            export CMAKE_CXX_FLAGS="${CXXFLAGS}"
            export CC="gcc ${CFLAGS}"
            export CXX="g++ ${CXXFLAGS}"
            # Link Microsoft's glibc-clean ONNX Runtime, not the pyke prebuilt; auditwheel bundles it (#1284).
            ort_version=1.24.2
            case "$(uname -m)" in aarch64 | arm64) ort_arch=aarch64 ;; *) ort_arch=x64 ;; esac
            curl -fsSL -o /tmp/ort.tgz "https://github.com/microsoft/onnxruntime/releases/download/v${ort_version}/onnxruntime-linux-${ort_arch}-${ort_version}.tgz"
            mkdir -p /opt/msort && tar -xzf /tmp/ort.tgz -C /opt/msort --strip-components=1
          cibw-environment: 'MATURIN_BUILD_ARGS="--compatibility manylinux_2_28" CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER=gcc CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=gcc CC_x86_64_unknown_linux_gnu=gcc CC_aarch64_unknown_linux_gnu=gcc CXX_x86_64_unknown_linux_gnu=g++ CXX_aarch64_unknown_linux_gnu=g++ ORT_STRATEGY=system ORT_LIB_LOCATION=/opt/msort/lib ORT_SKIP_DOWNLOAD=1 ORT_PREFER_DYNAMIC_LINK=1 LD_LIBRARY_PATH=/opt/msort/lib'
          # The deployment target is the wheel's macOS floor: 15.0 left macOS 11-14
          # with no installable wheel (#1243). delocate bundles the libheif closure,
          # so the hook builds it from source at the target and PKG_CONFIG_PATH links
          # the wheel against it instead of Homebrew's runner-OS bottles. ~keep
          cibw-before-build-macos: bash {project}/scripts/ci/build-macos-heif-deps.sh
          cibw-environment-macos: 'MATURIN_BUILD_ARGS="" CARGO_BUILD_LOCKED=true MACOSX_DEPLOYMENT_TARGET=11.0 PKG_CONFIG_PATH=/tmp/xberg-heif/lib/pkgconfig'
          cibw-before-build-windows: "rustup install 1.95-x86_64-pc-windows-msvc --profile minimal --component rust-src --component rustfmt --component clippy && rustup target add x86_64-pc-windows-msvc --toolchain 1.95-x86_64-pc-windows-msvc && pip install maturin uv && set PATH=%USERPROFILE%\\.cargo\\bin;%PATH%"
          cibw-environment-windows: 'MATURIN_BUILD_ARGS="--target x86_64-pc-windows-msvc" RUSTUP_TOOLCHAIN="1.95-x86_64-pc-windows-msvc" RUSTC_WRAPPER='

      - name: Vendor ONNX Runtime into wheel
        if: runner.os == 'Linux'
        shell: bash
        run: |
          # auditwheel's default repair only bundles libs it can resolve via ldd
          # at repair time; it has been observed to drop libonnxruntime.so here
          # (#1284 follow-up). Vendor explicitly, same as every other native
          # target in this workflow, instead of depending on auditwheel alone.
          for w in wheelhouse/*.whl; do bash scripts/ci/vendor-native-closure.sh "$w"; done

      - name: Vendor ONNX Runtime into wheel (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # System-strategy dynamic linking (switched above) no longer bakes ORT
          # into the .pyd the way the pyke static-link strategy did, so it must
          # be vendored explicitly -- same rationale as the Linux step above.
          Get-ChildItem -Path wheelhouse -Filter "*.whl" | ForEach-Object {
            & "${{ github.workspace }}\scripts\ci\vendor-windows-wheel-closure.ps1" -Wheel $_.FullName -DllSourceDir "$env:ORT_LIB_LOCATION" -NativeGlob "*.pyd"
            if ($LASTEXITCODE -ne 0) { throw "vendor-windows-wheel-closure failed for $($_.FullName)" }
          }

      - name: Verify wheel has no DirectML import and ships ONNX Runtime (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-ChildItem -Path wheelhouse -Filter "*.whl" | ForEach-Object {
            & "${{ github.workspace }}\scripts\ci\verify-windows-dll-closure.ps1" -Artifact $_.FullName -NativeGlob "*.pyd"
            if ($LASTEXITCODE -ne 0) { throw "verify-windows-dll-closure failed for $($_.FullName)" }
          }

      - name: Verify wheel glibc floor + bundled ONNX Runtime
        if: runner.os == 'Linux'
        shell: bash
        run: |
          for w in wheelhouse/*.whl; do bash scripts/ci/verify-glibc-floor.sh "$w" "$GLIBC_FLOOR"; done

      # The checks above only prove a file exists (or, for Linux/Windows,
      # inspect symbols/imports statically) -- none of them ever import or
      # run the wheel. This installs it into a real venv on this same runner
      # (matching glibc/macOS/Windows -- the family it was actually built
      # for, unlike the musl leg which needs a separate Alpine container) and
      # runs a real extraction against a known fixture, asserting the exact
      # expected text comes back. See scripts/ci/smoke_test_python_wheel.py
      # for why import-only is not enough. No continue-on-error: a broken
      # wheel must fail this job, not merely warn.
      - name: Smoke-test wheel (real extraction, not just import)
        shell: bash
        run: |
          set -euo pipefail
          wheel="$(find wheelhouse -name '*.whl' | head -n1)"
          python="python3"
          venv_python="smoke-venv/bin/python"
          if [ "${{ runner.os }}" = "Windows" ]; then
            python="python"
            venv_python="smoke-venv/Scripts/python.exe"
          fi
          "$python" -m venv smoke-venv
          "$venv_python" -m pip install --no-cache-dir --quiet "$wheel"
          "$venv_python" scripts/ci/smoke_test_python_wheel.py \
            scripts/ci/fixtures/musl-python-smoke.pdf "XBERG MUSL SMOKE 490"

      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: python-wheels-${{ matrix.os }}
          path: wheelhouse/*.whl
          retention-days: 14

  python-wheels-musl:
    name: Build Python wheels (musl-${{ matrix.arch }})
    needs: [prepare, check-pypi]
    if: ${{ needs.prepare.outputs.release_python == 'true' && (needs.check-pypi.outputs.exists != 'true' || needs.prepare.outputs.force_republish == 'true') }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, arch: x86_64, target: x86_64-unknown-linux-musl }
          - { os: ubuntu-24.04-arm, arch: aarch64, target: aarch64-unknown-linux-musl }
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}
          fetch-depth: 0
          submodules: false

      - name: Build Python wheel via Alpine Docker
        run: |
          docker build -f docker/Dockerfile.musl-python \
            --build-arg TARGET=${{ matrix.target }} \
            --output type=local,dest=./build-output .

      - name: Verify musl wheel produced
        run: |
          test -n "$(find build-output -name '*.whl')" || {
            echo "::error::no wheel produced by musl build for ${{ matrix.target }}"; exit 1; }

      # Closes xberg-io/xberg#490: the wheel-existence check above only proves a
      # file was produced, never that it installs and extracts correctly on the
      # musl libc family it was cross-compiled for. This installs it into a real
      # Alpine container and runs an actual extraction against a known fixture,
      # asserting the exact expected text comes back. No continue-on-error: a
      # broken wheel must fail this job, not merely warn.
      - name: Smoke-test musl wheel (real extraction, not just import)
        run: |
          wheel="$(find build-output -name '*.whl' | head -n1)"
          bash scripts/ci/smoke-test-musl-python-wheel.sh "$wheel"

      - uses: actions/upload-artifact@v7
        with:
          name: python-wheels-musl-${{ matrix.arch }}
          path: build-output/*.whl
          if-no-files-found: error
          retention-days: 14

  python-sdist:
    name: Build Python sdist
    needs: [prepare, check-pypi, publish-crates]
    # Skipped on dry runs. The sdist is built out of the workspace with internal `path = "..."` keys
    # stripped, so `cargo generate-lockfile` must resolve `xberg = "^<version>"` from crates.io. A dry
    # run's `publish-crates` succeeds without actually publishing, so that version is never on the
    # registry and resolution fails by construction — the job can only ever be red here, whatever the
    # code does. (`is_tag` is NOT the right predicate: dry runs synthesize a tag and set it true.)
    if: ${{ !cancelled() && needs.prepare.outputs.dry_run != 'true' && needs.publish-crates.result != 'failure' && needs.prepare.outputs.release_python == 'true' && (needs.check-pypi.outputs.exists != 'true' || needs.prepare.outputs.force_republish == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}
          fetch-depth: 0

          submodules: false
      - uses: xberg-io/actions/setup-rust@v1
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install system dependencies
        uses: ./.github/actions/install-system-deps

      - uses: xberg-io/actions/build-python-sdist@v1
        with:
          output-dir: dist
          dry-run: ${{ needs.prepare.outputs.dry_run }}

      - uses: actions/upload-artifact@v7
        with:
          name: python-sdist
          path: dist/*.tar.gz
          retention-days: 14

  node-bindings:
    name: Build Node bindings (${{ matrix.target }})
    needs: [prepare, check-npm]
    if: ${{ needs.prepare.outputs.release_node == 'true' && (needs.check-npm.outputs.node_exists != 'true' || needs.prepare.outputs.force_republish == 'true') }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15, target: aarch64-apple-darwin }
          # x86_64-apple-darwin (Intel macOS) intentionally omitted: pyke ships
          # no static ORT for it and Microsoft's last dylib is 1.23.2. Kept in
          # sync with alef's [crates.node].exclude_platforms=["darwin-x64"]. ~keep
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}
          fetch-depth: 0

          submodules: false
      - uses: xberg-io/actions/setup-rust@v1
        with:
          target: ${{ matrix.target }}

      - uses: xberg-io/actions/setup-node-workspace@v1
        with:
          node-version: "24"

      - name: Install system dependencies
        uses: ./.github/actions/install-system-deps

      - name: Setup ONNX Runtime
        uses: ./.github/actions/setup-onnx-runtime
        with:
          ort-version: "1.24.2"

      # Build the libheif closure from source at the macOS floor (#1243) and
      # make the .node link it instead of Homebrew's runner-OS bottles. ~keep
      - name: Build libheif stack for the macOS floor
        if: contains(matrix.target, 'apple-darwin')
        shell: bash
        run: |
          export MACOSX_DEPLOYMENT_TARGET=11.0
          bash scripts/ci/build-macos-heif-deps.sh
          {
            echo "MACOSX_DEPLOYMENT_TARGET=$MACOSX_DEPLOYMENT_TARGET"
            echo "PKG_CONFIG_PATH=/tmp/xberg-heif/lib/pkgconfig"
          } >>"$GITHUB_ENV"

      - name: Build NAPI binding
        uses: xberg-io/actions/build-node-napi@v1
        with:
          crate-dir: crates/xberg-node
          target: ${{ matrix.target }}
          use-napi-cross: "false"
          pack-target-tarball: node-bindings-${{ matrix.target }}.tar.gz

      - name: Ship the alef-generated index.d.ts, not napi's regenerated one
        shell: bash
        run: |
          set -euo pipefail
          # `napi build` (run inside build-node-napi) regenerates
          # crates/xberg-node/index.d.ts from the Rust napi idents, reintroducing
          # dangling `Js*` type references that TypeScript resolves to `any`
          # (#1351). The committed file is alef-generated and correct, so restore
          # it and repack the per-target tarball so the clean declaration file is
          # what ships. On macOS the vendor step below repacks again with the
          # dylib closure, reusing this restored file; on the other targets this
          # repack produces the final tarball (build-node-napi does not repack).
          git checkout HEAD -- crates/xberg-node/index.d.ts
          members=(npm)
          [ -f crates/xberg-node/index.js ] && members+=(index.js)
          [ -f crates/xberg-node/index.d.ts ] && members+=(index.d.ts)
          tar -czf "node-bindings-${{ matrix.target }}.tar.gz" -C crates/xberg-node "${members[@]}"

      - name: Vendor macOS dylib closure (libheif + codecs) into the .node package
        if: contains(matrix.target, 'apple-darwin')
        shell: bash
        run: |
          set -euo pipefail
          # build-node-napi staged the .node (+ @rpath-relocatable ONNX Runtime)
          # into crates/xberg-node/npm/<platform>/ and packed the tarball. The
          # libheif closure is still absolute paths in the .node, so vendor it
          # beside the .node (@loader_path) and repack.
          node_file="$(find crates/xberg-node/npm -maxdepth 2 -name '*.node' -type f | head -1)"
          [ -n "$node_file" ] || { echo "::error::no .node staged under crates/xberg-node/npm"; exit 1; }
          platform_dir="$(dirname "$node_file")"
          bash scripts/ci/vendor-macos-node-dylibs.sh "$platform_dir"
          # Reconcile the platform package.json `files` with every binary now on
          # disk so npm pack ships the whole closure.
          node -e '
            const fs = require("fs"), path = require("path");
            const dir = process.argv[1];
            const p = path.join(dir, "package.json");
            const pkg = JSON.parse(fs.readFileSync(p, "utf8"));
            const ship = /\.(node|dylib|dll)$|\.so(\.[0-9]+)*$/;
            const onDisk = fs.readdirSync(dir).filter((f) => ship.test(f));
            pkg.files = [...new Set([...(pkg.files || []), ...onDisk])].sort();
            fs.writeFileSync(p, JSON.stringify(pkg, null, 2) + "\n");
            console.log("reconciled files:", JSON.stringify(pkg.files));
          ' "$platform_dir"
          # Repack the per-target tarball with the same layout build-node-napi
          # uses (npm/ tree + root index.js/index.d.ts), overwriting the
          # pre-vendor one.
          members=(npm)
          [ -f crates/xberg-node/index.js ] && members+=(index.js)
          [ -f crates/xberg-node/index.d.ts ] && members+=(index.d.ts)
          tar -czf "node-bindings-${{ matrix.target }}.tar.gz" -C crates/xberg-node "${members[@]}"

      - uses: actions/upload-artifact@v7
        with:
          name: node-bindings-${{ matrix.target }}
          path: node-bindings-${{ matrix.target }}.tar.gz
          retention-days: 14

  node-bindings-musl:
    name: Build Node bindings (linux-musl-${{ matrix.arch }})
    needs: [prepare, check-npm]
    if: ${{ needs.prepare.outputs.release_node == 'true' && (needs.check-npm.outputs.node_exists != 'true' || needs.prepare.outputs.force_republish == 'true') }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, arch: x86_64, napi_arch: x64, target: x86_64-unknown-linux-musl }
          - { os: ubuntu-24.04-arm, arch: aarch64, napi_arch: arm64, target: aarch64-unknown-linux-musl }
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}
          fetch-depth: 0
          submodules: false
      - name: Build Node NAPI binding via Alpine Docker
        run: |
          docker build -f docker/Dockerfile.musl-node \
            --build-arg TARGET=${{ matrix.target }} \
            --output type=local,dest=./build-output .
      - name: Stage .node into napi platform dir for npm
        run: |
          platform="linux-${{ matrix.napi_arch }}-musl"
          mkdir -p "staging/npm/${platform}"
          find build-output -name "*.node" -exec cp {} "staging/npm/${platform}/" \;
          test -n "$(find "staging/npm/${platform}" -name '*.node')" || {
            echo "::error::no .node produced by musl build for ${platform}"; exit 1; }
          # Ship the .node's vendored shared-lib closure (libonnxruntime + codecs)
          # beside it — the .node's RUNPATH is $ORIGIN, so co-located libs resolve
          # at require() time. Without them consumers hit ERR_DLOPEN_FAILED.
          # `*.so*` (not `*.so`) matches versioned sonames like libonnxruntime.so.1,
          # which a plain `*.so` glob silently drops. ~keep
          if ls build-output/*.so* >/dev/null 2>&1; then
            cp -v build-output/*.so* "staging/npm/${platform}/"
          else
            echo "::error::no vendored shared libs produced by musl build for ${platform}"; exit 1
          fi
          cp "crates/xberg-node/npm/${platform}/package.json" "staging/npm/${platform}/package.json"
          # Reconcile `files` with the binaries on disk — napi create-npm-dirs
          # regenerates the committed package.json to list only *.node, so the
          # vendored libs must be re-added here or npm publish drops them.
          python3 -c '
          import json, os, re, sys
          d = sys.argv[1]; p = os.path.join(d, "package.json")
          pkg = json.load(open(p))
          ship = re.compile(r"\.(node|dylib|dll)$|\.so(\.[0-9]+)*$")
          on_disk = sorted(f for f in os.listdir(d) if ship.search(f))
          pkg["files"] = sorted(set(pkg.get("files", [])) | set(on_disk))
          with open(p, "w") as fh:
              json.dump(pkg, fh, indent=2); fh.write("\n")
          print("reconciled files:", pkg["files"])
          ' "staging/npm/${platform}"
          tar -czf node-bindings-${{ matrix.target }}.tar.gz -C staging npm

      # The steps above only prove a .node file (and its vendored shared-lib
      # closure) exist on disk -- never that require()ing it actually works.
      # This installs it into a real Alpine (musl libc) container and runs a
      # real extraction against a known fixture, asserting the exact expected
      # text comes back. See scripts/ci/smoke_test_node_binding.js for what
      # this catches and why a require()-only check is not enough. No
      # continue-on-error: a broken binding must fail this job, not merely
      # warn.
      - name: Smoke-test musl Node binding (real extraction, not just require)
        run: |
          platform="linux-${{ matrix.napi_arch }}-musl"
          bash scripts/ci/smoke-test-musl-node-binding.sh "staging/npm/${platform}"

      - uses: actions/upload-artifact@v7
        with:
          name: node-bindings-${{ matrix.target }}
          path: node-bindings-${{ matrix.target }}.tar.gz
          if-no-files-found: error
          retention-days: 14

  node-bindings-manylinux:
    name: Build Node bindings (linux-gnu-${{ matrix.arch }})
    needs: [prepare, check-npm]
    if: ${{ needs.prepare.outputs.release_node == 'true' && (needs.check-npm.outputs.node_exists != 'true' || needs.prepare.outputs.force_republish == 'true') }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {
              os: ubuntu-latest,
              arch: x86_64,
              napi_arch: x64,
              target: x86_64-unknown-linux-gnu,
              image: quay.io/pypa/manylinux_2_28_x86_64,
            }
          - {
              os: ubuntu-24.04-arm,
              arch: aarch64,
              napi_arch: arm64,
              target: aarch64-unknown-linux-gnu,
              image: quay.io/pypa/manylinux_2_28_aarch64,
            }
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}
          fetch-depth: 0
          submodules: false
      - name: Build Node NAPI binding via manylinux Docker
        run: |
          docker build -f docker/Dockerfile.manylinux-node \
            --build-arg MANYLINUX_IMAGE=${{ matrix.image }} \
            --build-arg TARGET=${{ matrix.target }} \
            --output type=local,dest=./build-output .
      - name: Stage .node into napi platform dir for npm
        run: |
          platform="linux-${{ matrix.napi_arch }}-gnu"
          mkdir -p "staging/npm/${platform}"
          find build-output -name "*.node" -exec cp {} "staging/npm/${platform}/" \;
          test -n "$(find "staging/npm/${platform}" -name '*.node')" || {
            echo "::error::no .node produced by manylinux build for ${platform}"; exit 1; }
          # Ship the .node's vendored shared-lib closure (libonnxruntime + codecs)
          # beside it — the .node's RUNPATH is $ORIGIN, so co-located libs resolve
          # at require() time. Without them consumers hit ERR_DLOPEN_FAILED.
          # `*.so*` (not `*.so`) matches versioned sonames like libonnxruntime.so.1,
          # which a plain `*.so` glob silently drops. ~keep
          if ls build-output/*.so* >/dev/null 2>&1; then
            cp -v build-output/*.so* "staging/npm/${platform}/"
          else
            echo "::error::no vendored shared libs produced by manylinux build for ${platform}"; exit 1
          fi
          cp "crates/xberg-node/npm/${platform}/package.json" "staging/npm/${platform}/package.json"
          # Reconcile `files` with the binaries on disk — napi create-npm-dirs
          # regenerates the committed package.json to list only *.node, so the
          # vendored libs must be re-added here or npm publish drops them.
          python3 -c '
          import json, os, re, sys
          d = sys.argv[1]; p = os.path.join(d, "package.json")
          pkg = json.load(open(p))
          ship = re.compile(r"\.(node|dylib|dll)$|\.so(\.[0-9]+)*$")
          on_disk = sorted(f for f in os.listdir(d) if ship.search(f))
          pkg["files"] = sorted(set(pkg.get("files", [])) | set(on_disk))
          with open(p, "w") as fh:
              json.dump(pkg, fh, indent=2); fh.write("\n")
          print("reconciled files:", pkg["files"])
          ' "staging/npm/${platform}"
          tar -czf node-bindings-${{ matrix.target }}.tar.gz -C staging npm
      - name: Verify glibc floor
        run: bash scripts/ci/verify-glibc-floor.sh "staging/npm/linux-${{ matrix.napi_arch }}-gnu" "$GLIBC_FLOOR"
      - uses: actions/upload-artifact@v7
        with:
          name: node-bindings-${{ matrix.target }}
          path: node-bindings-${{ matrix.target }}.tar.gz
          if-no-files-found: error
          retention-days: 14

  wasm-bindings:
    name: Build WASM package
    needs: [prepare, check-npm]
    if: ${{ needs.prepare.outputs.release_wasm == 'true' && (needs.check-npm.outputs.wasm_exists != 'true' || needs.prepare.outputs.force_republish == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # The WASM package is a best-effort publish gate, not part of the core release: a WASM
    # build failure must not block publishing the crate/PyPI/npm/Maven/etc. artifacts that
    # depend only on `prepare`. downstream `publish-wasm` requires
    # needs.wasm-bindings.result == 'success', so a failure here still correctly skips
    # publishing a broken WASM package -- it just doesn't fail the whole run. ~keep
    continue-on-error: true
    env:
      CARGO_BUILD_JOBS: 1
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}
          fetch-depth: 0

          submodules: false
      - uses: xberg-io/actions/setup-rust@v1
        with:
          target: wasm32-unknown-unknown
          cache-key-prefix: wasm-bindings

      - uses: xberg-io/actions/install-wasi-sdk@v1

      - uses: xberg-io/actions/setup-node-workspace@v1
        with:
          node-version: "24"

      - name: Install system dependencies
        uses: ./.github/actions/install-system-deps

      - uses: xberg-io/actions/build-wasm-package@v1
        with:
          crate-dir: crates/xberg-wasm
          pack-tarball: "true"
          # The wasm-pack nodejs glue carries unresolvable require("env") /
          # require("wasi_snapshot_preview1") calls (from the WASI-cross-compiled
          # Tesseract in ocr-wasm) that throw on load. fix-wasi-imports.mjs stubs
          # them post-build. This override is the durable hook: alef regenerates
          # crates/xberg-wasm/package.json scripts and drops any hand-added
          # suffix, so we invoke the patch here (publish.yaml is not generated)
          # rather than relying on a package.json script surviving regen. ~keep
          # CARGO_PROFILE_RELEASE_OPT_LEVEL=z: the workspace `[profile.release]` is
          # tuned for native throughput (`opt-level = 3`), and only the thin
          # `xberg-wasm` glue crate carries a per-package `opt-level = "z"` — every
          # dependency that actually fills the blob (xberg, crawlberg, candle,
          # tract, tokenizers, the WASI Tesseract) was still generated at 3. On
          # wasm32 that inflates the `code` section by ~48%: measured on this
          # revision, code 37,885,900 -> 25,543,030 bytes and the shipped
          # `pkg/web/xberg_wasm_bg.wasm` 52,208,780 -> 40,020,247 (-23.3%), with
          # `data` unchanged (14.07 MB, mostly bundled eng.traineddata) and the
          # Node load smoke test still reporting the same 364 exports. That is what
          # brings the artifact back under WASM_MAX_FILE_BYTES without dropping a
          # feature. It is set here rather than in `.cargo/config.toml`, because a
          # `[target.wasm32-unknown-unknown] rustflags` entry is silently discarded
          # whenever RUSTFLAGS is set (CI sets `-D warnings`) — see
          # crates/xberg-wasm/build.rs — and rather than in package.json, which alef
          # regenerates. Keep it in step with .task/languages/rust.yml's
          # `wasm:build:all` so a local build measures what publish ships. ~keep
          build-command: "CARGO_PROFILE_RELEASE_OPT_LEVEL=z pnpm run build:all && node scripts/fix-wasi-imports.mjs"

      - name: Enforce WASM CDN size budget (jsDelivr limits)
        working-directory: crates/xberg-wasm
        shell: bash
        run: |
          set -euo pipefail
          # Early warning, deliberately NOT the blocking gate: this job carries a
          # job-level `continue-on-error: true`, so a failure here does not
          # reliably stop publish-wasm from running. The authoritative check is
          # the npm-tarball measurement inside publish-wasm, which runs before
          # the publish step in a job that is not continue-on-error. This step
          # exists to surface the number early, against the build output rather
          # than the packed tarball, so growth toward the jsDelivr caps is
          # visible on every run instead of being discovered from a broken
          # demo. Sizes print whether or not the budget is breached. ~keep
          FAIL=0
          {
            echo "### WASM CDN size budget (crates/xberg-wasm)"
            echo
            echo "| artifact | size (bytes) | limit (bytes) | status |"
            echo "|---|---|---|---|"
          } >>"$GITHUB_STEP_SUMMARY"

          while IFS= read -r -d '' file; do
            size=$(stat -c%s "$file")
            rel="crates/xberg-wasm/${file#./}"
            status="ok"
            if (( size > WASM_MAX_FILE_BYTES )); then
              status="FAIL"
              FAIL=1
              echo "::error::${rel} is ${size} bytes, exceeding the per-file budget of ${WASM_MAX_FILE_BYTES} bytes (jsDelivr's hard per-file cap is 50 MB). Trim this artifact (or feature-gate the dependency that grew it) before it can publish."
            fi
            echo "size: ${rel} = ${size} bytes (limit ${WASM_MAX_FILE_BYTES})"
            echo "| ${rel} | ${size} | ${WASM_MAX_FILE_BYTES} | ${status} |" >>"$GITHUB_STEP_SUMMARY"
          done < <(find pkg -name '*.wasm' -print0)

          total=$(du -sb pkg | cut -f1)
          status="ok"
          if (( total > WASM_MAX_PACKAGE_BYTES )); then
            status="FAIL"
            FAIL=1
            echo "::error::crates/xberg-wasm/pkg is ${total} bytes, exceeding the package budget of ${WASM_MAX_PACKAGE_BYTES} bytes (jsDelivr's hard per-package cap is 150 MB). Trim the published bundle before it can publish."
          fi
          echo "size: crates/xberg-wasm/pkg (total) = ${total} bytes (limit ${WASM_MAX_PACKAGE_BYTES})"
          echo "| crates/xberg-wasm/pkg (total) | ${total} | ${WASM_MAX_PACKAGE_BYTES} | ${status} |" >>"$GITHUB_STEP_SUMMARY"

          if [[ "$FAIL" -ne 0 ]]; then
            exit 1
          fi

      - name: Smoke test — Node can load the wasm web bundle
        working-directory: crates/xberg-wasm
        shell: bash
        run: |
          set -euo pipefail
          # Guards the rc.21/rc.22 regression: the wasm-pack glue carried
          # unresolvable "env" / "wasi_snapshot_preview1" imports (from the
          # WASI-cross-compiled Tesseract in ocr-wasm) that threw on load.
          # scripts/fix-wasi-imports.mjs (run via the build-command override
          # above) must have stripped and stubbed them; if not, importing the
          # bundle throws here and fails the job before a broken package can
          # publish. The package is web-only (single ESM target under pkg/web),
          # so import it as an ES module — this exercises the same env/wasi ESM
          # shim path. Load-only (no tessdata needed): fast and network-free.
          node --input-type=module -e '
            const wasm = await import("./pkg/web/xberg_wasm.js");
            if (typeof wasm.extract !== "function" || typeof wasm.WasmExtractInput !== "function") {
              console.error("wasm web glue loaded but expected exports are missing"); process.exit(1);
            }
            console.log("wasm web glue loaded; exports present:", Object.keys(wasm).length);
          '

      - uses: actions/upload-artifact@v7
        with:
          name: wasm-bundle
          path: |
            crates/xberg-wasm/dist/**
            crates/xberg-wasm/dist-node/**
            crates/xberg-wasm/dist-web/**
            crates/xberg-wasm/pkg/**
            crates/xberg-wasm/package.json
          retention-days: 14

  ruby-gem:
    name: Build Ruby gem (${{ matrix.label }})
    needs: [prepare, check-rubygems, publish-crates]
    if: ${{ !cancelled() && needs.publish-crates.result != 'failure' && needs.prepare.outputs.release_ruby == 'true' && (needs.check-rubygems.outputs.exists != 'true' || needs.prepare.outputs.force_republish == 'true') }}
    runs-on: ${{ matrix.os }}
    env:
      RB_SYS_CARGO_PROFILE: release
      # Alef's target dependency override selects `windows-gnu-target`, but the generated
      # binding crate's default forwarding features otherwise union ORT back into xberg.
      # MinGW has no ORT prebuilt, so compile the wrapper with only the cfg-gated APIs that
      # the Windows GNU surface supports. The target dependency still supplies the complete
      # `windows-gnu-target` implementation feature set.
      RB_SYS_EXTRA_CARGO_ARGS: ${{ matrix.ruby_cargo_args }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, label: linux-x86_64 }
          - { os: ubuntu-24.04-arm, label: linux-aarch64 }
          - { os: macos-15, label: macos-arm64 }
          - os: windows-latest
            label: windows-x86_64
            # This leg's binding features and the core features actually compiled are two
            # separate switches: `--no-default-features` here turns xberg-rb's OWN
            # `#[cfg(feature = "...")]`-gated match arms/fields off, while the Windows target
            # dep in packages/ruby/ext/xberg_rb/native/Cargo.toml unconditionally asks the core
            # for the whole `windows-gnu-target` bundle (crates/xberg/Cargo.toml), regardless of
            # what is listed here. Whenever a core feature inside that bundle also has a
            # same-named xberg-rb feature (a pure forward, e.g. `office = ["xberg/office"]`),
            # that xberg-rb feature MUST be listed below too, or the core keeps a variant/field
            # the generated binding lost the match arm for (E0004 non-exhaustive match, E0063
            # missing struct field, E0609 unknown field -- previously 827 E0004s on
            # `From<KeywordAlgorithm>` alone, from `svg`/`keywords-yake`/`keywords-rake` missing
            # here). This list is exactly xberg-rb's own `default` feature set (see the
            # generated `packages/ruby/ext/xberg_rb/native/Cargo.toml`) minus the four entries
            # `windows-gnu-target` deliberately excludes: `candle-ocr` and `ocr-wasm` (not part
            # of the bundle -- native `ocr` is used instead) and `reranker`/`late-interaction`
            # (the ORT-backed engines; `windows-gnu-target` keeps only their ORT-free
            # `reranker-presets`/`late-interaction-presets` siblings, since MinGW has no ORT
            # prebuilt). `heic` is already excluded from xberg-rb's default via alef.toml's
            # `excluded_default_features`. Adding a new xberg-rb feature later means adding it
            # here too whenever `windows-gnu-target` (or its core feature) also carries it. ~keep
            ruby_cargo_args: --no-default-features --features api,api-types,auto-rotate-types,chunking-tokenizers,classification,diff,embedding-presets,heuristics,html,keywords-rake,keywords-yake,late-interaction-presets,layout-types,markdown-footnotes,ocr,office,paddle-ocr-types,pdf,presets,quality,redaction,reranker-presets,sparse-embedding-presets,svg,transcription-types,tree-sitter,url-config-types,url-ingestion,xml
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}
          fetch-depth: 0

          submodules: false
      # RubyInstaller's Windows Ruby is built against the UCRT/MinGW ABI (gem
      # platform `x64-mingw-ucrt`, already declared in packages/ruby/Rakefile's
      # CROSS_PLATFORMS), not MSVC — unlike the Python/Node/PHP/C# Windows legs
      # in this workflow, which all target genuine MSVC binaries. rb_sys's
      # create_rust_makefile detects the host Ruby's platform and asks cargo to
      # build for the matching Rust target, so the host Rust toolchain itself
      # must be the GNU one; a MSVC-hosted rustc cross-building that target
      # would need a mingw sysroot dance rb_sys does not set up. Selecting it
      # through setup-rust's own `toolchain` input (rather than a later
      # `rustup default`) keeps the action's verify-install step checking the
      # toolchain we actually build with.
      - uses: xberg-io/actions/setup-rust@v1
        with:
          toolchain: ${{ runner.os == 'Windows' && 'stable-x86_64-pc-windows-gnu' || '' }}

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: false

      - name: Install system dependencies
        uses: ./.github/actions/install-system-deps

      - uses: xberg-io/actions/build-ruby-gem@v1
        with:
          package-dir: packages/ruby
          dry-run: ${{ needs.prepare.outputs.dry_run }}

      - name: Package platform gem
        working-directory: packages/ruby
        run: |
          bundle exec rake compile
          bundle exec rake build
        shell: bash

      - name: Drop source gem on non-canonical builders
        if: ${{ matrix.label != 'linux-x86_64' }}
        shell: bash
        run: |
          shopt -s nullglob
          for f in packages/ruby/pkg/*.gem; do
            base="$(basename "$f")"
            case "$base" in
              *-x86_64-linux.gem|*-aarch64-linux.gem|*-arm64-darwin.gem|*-x86_64-darwin.gem|*-x64-mingw-ucrt.gem) ;;
              *) echo "Removing non-canonical source gem $base"; rm -f "$f" ;;
            esac
          done

      - uses: actions/upload-artifact@v7
        with:
          name: rubygems-${{ matrix.label }}
          path: packages/ruby/pkg/*.gem
          retention-days: 14

  php-extension:
    name: Build PHP extension (php${{ matrix.php }} ${{ matrix.platform.label }})
    needs: [prepare, check-packagist, publish-crates]
    # Skipped on dry runs for the same reason as `python-sdist`: the extension is packaged out of the
    # workspace with internal `path = "..."` keys stripped, so it resolves `xberg = "^<version>"` from
    # crates.io, which only exists after a real (non-dry-run) `publish-crates`.
    if: ${{ !cancelled() && needs.prepare.outputs.dry_run != 'true' && needs.publish-crates.result != 'failure' && needs.prepare.outputs.release_php == 'true' && (needs.check-packagist.outputs.exists != 'true' || needs.prepare.outputs.force_republish == 'true') }}
    runs-on: ${{ matrix.platform.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        php: ["8.3", "8.4", "8.5"]
        platform:
          - { os: ubuntu-latest, label: linux-x86_64, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, label: linux-arm64, target: aarch64-unknown-linux-gnu }
          - { os: macos-15, label: macos-arm64, target: aarch64-apple-darwin }
          - { os: windows-latest, label: windows-x86_64, target: x86_64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}
          fetch-depth: 0

          submodules: false
      - uses: xberg-io/actions/setup-php@v1
        with:
          php-version: ${{ matrix.php }}

      - uses: xberg-io/actions/setup-rust@v1
        with:
          target: ${{ matrix.platform.target }}

      - name: Install system dependencies
        uses: ./.github/actions/install-system-deps

      # See the equivalent step on python-wheels for the DirectML root cause
      # (xberg-io/xberg#1456). This leg had no ORT setup step at all on
      # Windows, so it defaulted to the pyke download strategy every time.
      - name: Setup ONNX Runtime (Windows)
        if: contains(matrix.platform.target, 'windows')
        uses: ./.github/actions/setup-onnx-runtime
        with:
          ort-version: "1.24.2"
          dest-dir: crates/xberg-php

      - uses: xberg-io/actions/build-php-extension@v1
        with:
          crate-name: xberg-php
          lib-name: xberg_php
          php-version: ${{ matrix.php }}
          php-ts: nts
          dry-run: ${{ needs.prepare.outputs.dry_run }}

      # alef is a third-party tool. The job-wide `-D warnings` turns its own
      # lint warnings into build errors, which has no bearing on this repo. ~keep
      - uses: xberg-io/actions/install-alef@v1
        env:
          RUSTFLAGS: ""

      - uses: xberg-io/actions/package-php-pie@v1
        with:
          php-version: ${{ matrix.php }}
          php-ts: nts
          target: ${{ matrix.platform.target }}
          windows-compiler: ${{ contains(matrix.platform.target, 'windows') && 'vs17' || '' }}
          version: ${{ needs.prepare.outputs.version }}
          output-dir: dist/php-package

      # package-php-pie@v1 is an external action (xberg-io/actions); its
      # internal file selection was not auditable from this repo, so vendor
      # onto its OUTPUT archives (control we do have) rather than assume it
      # bundles a co-located onnxruntime.dll from the build directory.
      - name: Vendor ONNX Runtime into PHP package (Windows)
        if: contains(matrix.platform.target, 'windows')
        shell: pwsh
        run: |
          Get-ChildItem -Path dist/php-package -Include "php_*.zip", "php_*.tgz" -Recurse | ForEach-Object {
            & "${{ github.workspace }}\scripts\ci\vendor-windows-native-closure.ps1" -Archive $_.FullName -DllSourceDir "$env:ORT_LIB_LOCATION" -NativeGlob "php_xberg.dll"
            if ($LASTEXITCODE -ne 0) { throw "vendor-windows-native-closure failed for $($_.FullName)" }
            # Vendoring rewrites the archive bytes, so the .sha256 sidecar
            # package-php-pie already wrote is now stale -- regenerate it.
            $sha256Path = "$($_.FullName).sha256"
            if (Test-Path $sha256Path) {
              (Get-FileHash -Path $_.FullName -Algorithm SHA256).Hash.ToLower() + "  " + $_.Name | Set-Content -Path $sha256Path -NoNewline:$false
            }
          }

      - name: Verify PHP package has no DirectML import and ships ONNX Runtime (Windows)
        if: contains(matrix.platform.target, 'windows')
        shell: pwsh
        run: |
          Get-ChildItem -Path dist/php-package -Include "php_*.zip", "php_*.tgz" -Recurse | ForEach-Object {
            & "${{ github.workspace }}\scripts\ci\verify-windows-dll-closure.ps1" -Artifact $_.FullName -NativeGlob "php_xberg.dll"
            if ($LASTEXITCODE -ne 0) { throw "verify-windows-dll-closure failed for $($_.FullName)" }
          }

      - uses: actions/upload-artifact@v7
        with:
          name: php-package-${{ matrix.platform.label }}-php${{ matrix.php }}
          path: |
            dist/php-package/php_*.tgz
            dist/php-package/php_*.tgz.sha256
            dist/php-package/php_*.zip
            dist/php-package/php_*.zip.sha256
          retention-days: 14

  cli-binaries:
    name: Build CLI binary (${{ matrix.target }})
    needs: [prepare, check-cli]
    if: ${{ needs.prepare.outputs.release_cli == 'true' && (needs.check-cli.outputs.exists != 'true' || needs.prepare.outputs.force_republish == 'true') }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {
              os: ubuntu-24.04,
              target: x86_64-unknown-linux-gnu,
            }
          - {
              os: ubuntu-24.04-arm,
              target: aarch64-unknown-linux-gnu,
            }
          - { os: macos-15, target: aarch64-apple-darwin }
          - {
              os: macos-15-intel,
              target: x86_64-apple-darwin,
              extra_cargo_args: "--features ort-dynamic,mcp,mcp-http,api,heic",
            }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}
          fetch-depth: 0

          submodules: false

      - uses: xberg-io/actions/setup-rust@v1
        with:
          target: ${{ matrix.target }}
          cache-key-prefix: cli-native-v1

      - name: Install system dependencies
        uses: ./.github/actions/install-system-deps

      - name: Setup ONNX Runtime
        if: contains(matrix.target, 'windows')
        uses: ./.github/actions/setup-onnx-runtime
        with:
          ort-version: "1.24.2"

      - uses: xberg-io/actions/build-rust-cli@v1
        id: build
        with:
          package-name: xberg-cli
          binary-name: xberg
          target: ${{ matrix.target }}
          # `heic` re-adds HEIC/HEIF to the prebuilt binaries — the CLI default
          # dropped it so `cargo install` works on stock Windows (#1361); CI has
          # libheif so the official binaries keep HEIC. ~keep
          extra-cargo-args: ${{ matrix.extra_cargo_args || '--features mcp,mcp-http,api,heic' }}

      # Stage ONNX Runtime for Intel macOS after the build so the ort-dynamic
      # compile is unaffected; this exports ORT_DYLIB_PATH for the vendor step.
      # pyke ships no x86_64-apple-darwin build, so the macOS setup script pins
      # Microsoft's last x86_64 release (1.23.2, self-contained). ~keep
      - name: Setup ONNX Runtime (Intel macOS)
        if: matrix.target == 'x86_64-apple-darwin'
        uses: ./.github/actions/setup-onnx-runtime
        with:
          ort-version: "1.23.2"
          arch-id: x64
          dest-dir: crates/xberg-cli

      - name: Vendor ONNX Runtime dylib (Intel macOS)
        if: matrix.target == 'x86_64-apple-darwin'
        shell: bash
        run: |
          set -euxo pipefail
          # Bundle the dylib the setup step staged next to the binary.
          test -f "$ORT_DYLIB_PATH"
          echo "ORT_VENDOR_LIB=$ORT_DYLIB_PATH" >> "$GITHUB_ENV"

      - name: Package CLI artifact
        env:
          BINARY_PATH: ${{ steps.build.outputs.binary-path }}
          TARGET: ${{ matrix.target }}
        shell: bash
        run: |
          STAGE="xberg-cli-${TARGET}"
          mkdir -p "$STAGE"
          cp LICENSE THIRD_PARTY_LICENSES.md "$STAGE/"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            cp "$BINARY_PATH" "$STAGE/xberg.exe"
            # The `Setup ONNX Runtime` step above runs with its default `system`
            # strategy (ORT_STRATEGY=system), which links ONNX Runtime
            # dynamically rather than statically baking it in -- so, unlike the
            # Linux/macOS branches which either vendor a shared-object closure
            # or need nothing extra, this zip must ship the DLL closure itself
            # (xberg-io/xberg#1456 sibling bug: this leg shipped no DLLs at
            # all). Mirror the Dart leg's vendoring exactly.
            cp "${ORT_LIB_LOCATION:?}"/*.dll "$STAGE/"
            [ -f "$STAGE/onnxruntime.dll" ] || { echo "::error::onnxruntime.dll not staged"; exit 1; }
            # Smoke-test the staged tree exactly as a user would unzip it, the
            # Windows counterpart of the `--version` runs on the macOS and
            # linux-gnu branches below. The `Setup ONNX Runtime` step prepends
            # its staged DLL directory (under the workspace) to PATH; leaving it
            # there would let the loader satisfy the import from the build tree
            # and pass no matter what the zip contains, so strip it first — the
            # analogue of `env -u LD_LIBRARY_PATH` on the linux-gnu branch. This
            # now proves the DLLs just copied into $STAGE are what satisfy the
            # load, not an ambient workspace path.
            WORKSPACE_POSIX="$(pwd)"
            CLEAN_PATH=""
            while IFS= read -r path_entry; do
              [ -n "$path_entry" ] || continue
              case "$path_entry" in
                "$WORKSPACE_POSIX" | "$WORKSPACE_POSIX"/*)
                  continue
                  ;;
              esac
              if [ -e "$path_entry/onnxruntime.dll" ]; then
                echo "Dropping PATH entry providing onnxruntime.dll: $path_entry"
                continue
              fi
              CLEAN_PATH="${CLEAN_PATH:+$CLEAN_PATH:}$path_entry"
            done <<<"${PATH//:/$'\n'}"
            # The loader always searches System32 ahead of PATH, so a DLL there
            # can still mask a missing vendored copy. Say so in the log rather
            # than let a green step imply more than it proves.
            if [ -e "/c/Windows/System32/onnxruntime.dll" ]; then
              echo "::warning title=Windows CLI smoke test is weakened::C:\\Windows\\System32\\onnxruntime.dll exists on this runner and is searched before PATH, so xberg.exe --version may succeed here on a host DLL that end users do not have"
            fi
            PATH="$CLEAN_PATH" "$STAGE/xberg.exe" --version
            echo "Windows CLI smoke test passed: $STAGE/xberg.exe --version ran without a workspace-provided onnxruntime.dll"
            # `--version` alone does not prove the loader is happy: a hard PE
            # import (like DirectML.dll before this fix) is resolved before
            # main() runs either way, but a *delay-loaded* import only breaks
            # once the code path that touches it executes, which `--version`
            # never does. Inspect the import table directly instead of trusting
            # the smoke test's exit code for that class of defect.
            pwsh -NoProfile -File "$GITHUB_WORKSPACE/scripts/ci/verify-windows-dll-closure.ps1" -Artifact "$STAGE" -NativeGlob "xberg.exe"
            7z a "${STAGE}.zip" "$STAGE" >/dev/null
          else
            cp "$BINARY_PATH" "$STAGE/xberg"
            # Intel macOS: bundle libonnxruntime.dylib next to the binary; ort
            # resolves the default dylib name relative to the executable. The
            # official build links only system frameworks, so the one file is
            # the whole closure.
            if [[ "$TARGET" == "x86_64-apple-darwin" && -n "${ORT_VENDOR_LIB:-}" ]]; then
              cp "$ORT_VENDOR_LIB" "$STAGE/libonnxruntime.dylib"
              chmod u+w "$STAGE/libonnxruntime.dylib"
              install_name_tool -id "@loader_path/libonnxruntime.dylib" "$STAGE/libonnxruntime.dylib"
              deps="$(otool -L "$STAGE/libonnxruntime.dylib" | tail -n +3 | awk '{print $1}' \
                | grep -E '^(/opt/homebrew|/usr/local)/' || true)"
              if [[ -n "$deps" ]]; then
                echo "::error::vendored ONNX Runtime links non-system libraries:"; echo "$deps"; exit 1
              fi
              codesign --force -s - "$STAGE/libonnxruntime.dylib" || true
            fi
            # macOS CLI builds enable the formats feature, which dynamically
            # links libheif. Bundle its complete non-system dylib closure next to
            # the binary and rewrite load commands to @loader_path so the tarball
            # is self-contained rather than carrying an absolute Homebrew libheif
            # path that is absent on users' machines (xberg-io/xberg#1357). The
            # dlopen'd ONNX Runtime dylib (Intel, handled above) is not a link-time
            # dependency, so this closure walk does not disturb it.
            if [[ "$TARGET" == *-apple-darwin ]]; then
              bash scripts/ci/vendor-native-closure-macos.sh "$STAGE/xberg"
              "$STAGE/xberg" --version
            fi
            # Linux CLI builds enable the formats feature, which dynamically
            # links libheif. Ship its complete non-system dependency closure.
            if [[ "$TARGET" == *-unknown-linux-gnu ]]; then
              bash scripts/ci/vendor-native-closure.sh "$STAGE/xberg"
              compgen -G "$STAGE/libheif.so*" >/dev/null
              env -u LD_LIBRARY_PATH "$STAGE/xberg" --version
            fi
            tar -czf "${STAGE}.tar.gz" "$STAGE"
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: cli-${{ matrix.target }}
          path: |
            xberg-cli-${{ matrix.target }}.tar.gz
            xberg-cli-${{ matrix.target }}.zip
          if-no-files-found: ignore
          retention-days: 14

  cli-binaries-musl:
    name: Build CLI binary (${{ matrix.target }})
    needs: [prepare, check-cli]
    if: ${{ needs.prepare.outputs.release_cli == 'true' && (needs.check-cli.outputs.exists != 'true' || needs.prepare.outputs.force_republish == 'true') }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl }
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}
          fetch-depth: 0

          submodules: false
      - name: Build CLI via Alpine Docker
        run: |
          docker build -f docker/Dockerfile.musl-build \
            --output type=local,dest=./build-output .

      - name: Package CLI artifact (with bundled lib/)
        env:
          TARGET: ${{ matrix.target }}
        shell: bash
        run: |
          STAGE="xberg-cli-${TARGET}"
          mkdir -p "$STAGE/lib"
          cp LICENSE THIRD_PARTY_LICENSES.md "$STAGE/"
          cp build-output/xberg "$STAGE/xberg"
          cp build-output/xberg.bin "$STAGE/xberg.bin"
          cp -a build-output/lib/. "$STAGE/lib/"
          chmod +x "$STAGE/xberg"
          tar -czf "${STAGE}.tar.gz" "$STAGE"

      - uses: actions/upload-artifact@v7
        with:
          name: cli-${{ matrix.target }}
          path: xberg-cli-${{ matrix.target }}.tar.gz
          if-no-files-found: error
          retention-days: 14

  # Fully static musl CLI for `cargo binstall xberg-cli`. binstall extracts only
  # the binary from the archive, so this ships ONE static ELF (no sibling dylibs,
  # unlike the bundled cli-binaries-musl tarball). x86_64 gets Candle OCR
  # (binstall-ocr); aarch64 is extraction-only (binstall) since candle's gemm-f16
  # needs fullfp16, absent on the musl aarch64 baseline. Assets are named
  # `xberg-cli-binstall-<target>` so upload-cli-release attaches them via its
  # existing `xberg-cli-*` glob, and `[package.metadata.binstall]` points here.
  cli-binaries-binstall:
    name: Build static binstall CLI (${{ matrix.target }})
    needs: [prepare, check-cli]
    if: ${{ needs.prepare.outputs.release_cli == 'true' && (needs.check-cli.outputs.exists != 'true' || needs.prepare.outputs.force_republish == 'true') }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl, features: binstall-ocr }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, features: binstall }
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}
          fetch-depth: 0

          submodules: false
      - name: Build static CLI via Alpine Docker
        run: |
          docker build -f docker/Dockerfile.binstall-musl \
            --build-arg FEATURES=${{ matrix.features }} \
            --build-arg TARGET=${{ matrix.target }} \
            --output type=local,dest=./build-output .

      - name: Package binstall CLI artifact (single static binary)
        env:
          TARGET: ${{ matrix.target }}
        shell: bash
        run: |
          STAGE="xberg-cli-binstall-${TARGET}"
          mkdir -p "$STAGE"
          cp LICENSE THIRD_PARTY_LICENSES.md "$STAGE/"
          cp build-output/xberg "$STAGE/xberg"
          chmod +x "$STAGE/xberg"
          tar -czf "${STAGE}.tar.gz" "$STAGE"

      - uses: actions/upload-artifact@v7
        with:
          name: cli-binstall-${{ matrix.target }}
          path: xberg-cli-binstall-${{ matrix.target }}.tar.gz
          if-no-files-found: error
          retention-days: 14

  go-ffi-libraries:
    name: Build Go FFI library (${{ matrix.platform }})
    needs: [prepare, check-go]
    if: ${{ needs.prepare.outputs.release_go == 'true' && (needs.check-go.outputs.exists != 'true' || needs.prepare.outputs.force_republish == 'true') }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, platform: linux-x86_64, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, platform: linux-aarch64, target: aarch64-unknown-linux-gnu }
          - { os: macos-15, platform: macos-arm64, target: aarch64-apple-darwin }
          - { os: windows-latest, platform: windows-x86_64, target: x86_64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}
          fetch-depth: 0

          submodules: false
      - uses: xberg-io/actions/setup-rust@v1
        with:
          target: ${{ matrix.target }}

      - name: Install system dependencies
        uses: ./.github/actions/install-system-deps

      - name: Setup ONNX Runtime
        if: contains(matrix.target, 'windows') || contains(matrix.target, '-linux-gnu')
        uses: ./.github/actions/setup-onnx-runtime
        with:
          ort-version: "1.24.2"
          dest-dir: crates/xberg-ffi

      - name: Setup Zig for glibc 2.28 floor
        if: contains(matrix.target, '-linux-gnu')
        uses: xberg-io/actions/setup-zig@v1

      - name: Install cargo-zigbuild for glibc 2.28 floor
        if: contains(matrix.target, '-linux-gnu')
        shell: bash
        run: command -v cargo-zigbuild || cargo install --locked cargo-zigbuild

      - name: Build liblzma statically for glibc floor
        if: contains(matrix.target, '-linux-gnu')
        shell: bash
        run: echo "LZMA_API_STATIC=1" >> "$GITHUB_ENV"

      - uses: xberg-io/actions/build-go-ffi@v1
        with:
          target: ${{ matrix.target }}
          crate-name: xberg-ffi
          lib-name: xberg_ffi
          header-path: crates/xberg-ffi/include/xberg.h
          archive-name: xberg-go-${{ matrix.platform }}.tar.gz
          output-dir: dist/go-ffi
          glibc-version: ${{ env.GLIBC_FLOOR }}
      - name: Ship + verify ONNX Runtime (glibc Linux)
        if: contains(matrix.target, '-linux-gnu')
        shell: bash
        run: |
          shopt -s nullglob
          shipped=0
          for t in dist/go-ffi/*.tar.gz; do
            shipped=1
            bash scripts/ci/vendor-native-closure.sh "$t"
            bash scripts/ci/verify-glibc-floor.sh "$t" "$GLIBC_FLOOR"
          done
          [ "$shipped" = 1 ] || echo "::notice::no artifact produced (dry-run stub); skipping ship+verify"

      - uses: actions/upload-artifact@v7
        with:
          name: go-ffi-${{ matrix.platform }}
          path: dist/go-ffi/*.tar.gz
          if-no-files-found: error
          retention-days: 14

  c-ffi-libraries:
    name: Build C FFI distribution (${{ matrix.platform }})
    needs: [prepare, check-c-ffi]
    if: ${{ needs.prepare.outputs.release_c_ffi == 'true' && (needs.check-c-ffi.outputs.exists != 'true' || needs.prepare.outputs.force_republish == 'true') }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, platform: linux-x86_64, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, platform: linux-aarch64, target: aarch64-unknown-linux-gnu }
          - { os: macos-15, platform: macos-arm64, target: aarch64-apple-darwin }
          - { os: windows-latest, platform: windows-x86_64, target: x86_64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}
          fetch-depth: 0

          submodules: false
      - uses: xberg-io/actions/setup-rust@v1
        with:
          target: ${{ matrix.target }}

      - name: Install system dependencies
        uses: ./.github/actions/install-system-deps

      - name: Setup ONNX Runtime
        if: contains(matrix.target, 'windows') || contains(matrix.target, '-linux-gnu')
        uses: ./.github/actions/setup-onnx-runtime
        with:
          ort-version: "1.24.2"
          dest-dir: crates/xberg-ffi

      - name: Setup Zig for glibc 2.28 floor
        if: contains(matrix.target, '-linux-gnu')
        uses: xberg-io/actions/setup-zig@v1

      - name: Install cargo-zigbuild for glibc 2.28 floor
        if: contains(matrix.target, '-linux-gnu')
        shell: bash
        run: command -v cargo-zigbuild || cargo install --locked cargo-zigbuild

      - name: Build liblzma statically for glibc floor
        if: contains(matrix.target, '-linux-gnu')
        shell: bash
        run: echo "LZMA_API_STATIC=1" >> "$GITHUB_ENV"

      - uses: xberg-io/actions/build-rust-ffi@v1
        with:
          crate-name: xberg-ffi
          target: ${{ matrix.target }}
          glibc-version: ${{ contains(matrix.target, '-linux-gnu') && env.GLIBC_FLOOR || '' }}

      - name: Stage C FFI distribution
        # Inline: bundle library + header + LICENSE into a single tarball
        env:
          TARGET: ${{ matrix.target }}
          PLATFORM: ${{ matrix.platform }}
        shell: bash
        run: |
          STAGE="xberg-ffi-${PLATFORM}"
          mkdir -p "$STAGE/lib" "$STAGE/include"
          find "target/${TARGET}/release" -maxdepth 1 -type f \
            \( -name 'libxberg_ffi.*' -o -name 'xberg_ffi.dll' \) \
            -exec cp {} "$STAGE/lib/" \;
          cp crates/xberg-ffi/include/xberg.h "$STAGE/include/"
          # This step's contract (see the comment above) is "library + header +
          # LICENSE", and the sibling CLI staging steps copy LICENSE unsuppressed.
          # A published C FFI tarball missing its LICENSE is a distribution defect,
          # so name what is missing rather than discarding the error.
          [ -f LICENSE ] || {
            echo "::error::LICENSE is missing from the checkout — refusing to stage a C FFI tarball without it"
            exit 1
          }
          cp LICENSE "$STAGE/"
          # Windows links ONNX Runtime dynamically (`Setup ONNX Runtime` above
          # runs with its default `system` strategy); this leg had no
          # equivalent of the glibc-Linux step below and shipped no ONNX
          # Runtime DLL at all (xberg-io/xberg#1456 sibling bug). Mirror the
          # Dart leg's vendoring.
          if [[ "$TARGET" == *-pc-windows-msvc ]]; then
            cp "${ORT_LIB_LOCATION:?}"/*.dll "$STAGE/lib/"
            [ -f "$STAGE/lib/onnxruntime.dll" ] || { echo "::error::onnxruntime.dll not staged"; exit 1; }
          fi
          mkdir -p dist/c-ffi
          tar -czf "dist/c-ffi/${STAGE}.tar.gz" "$STAGE"

      - name: Verify C FFI distribution has no DirectML import and ships ONNX Runtime (Windows)
        if: contains(matrix.target, '-pc-windows-msvc')
        shell: pwsh
        run: |
          & "${{ github.workspace }}\scripts\ci\verify-windows-dll-closure.ps1" -Artifact "dist/c-ffi/xberg-ffi-${{ matrix.platform }}.tar.gz" -NativeGlob "xberg_ffi.dll"
          if ($LASTEXITCODE -ne 0) { throw "verify-windows-dll-closure failed" }

      - name: Ship + verify ONNX Runtime (glibc Linux)
        if: contains(matrix.target, '-linux-gnu')
        shell: bash
        run: |
          shopt -s nullglob
          shipped=0
          for t in dist/c-ffi/*.tar.gz; do
            shipped=1
            bash scripts/ci/vendor-native-closure.sh "$t"
            bash scripts/ci/verify-glibc-floor.sh "$t" "$GLIBC_FLOOR"
          done
          [ "$shipped" = 1 ] || echo "::notice::no artifact produced (dry-run stub); skipping ship+verify"

      - uses: actions/upload-artifact@v7
        with:
          name: c-ffi-${{ matrix.platform }}
          path: dist/c-ffi/*.tar.gz
          if-no-files-found: error
          retention-days: 14

  java-natives:
