  csharp-natives:
    name: Build C# natives (${{ matrix.rid }})
    needs: [prepare, check-nuget]
    if: ${{ needs.prepare.outputs.release_csharp == 'true' && (needs.check-nuget.outputs.exists != 'true' || needs.prepare.outputs.force_republish == 'true') }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, rid: linux-x64, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, rid: linux-arm64, target: aarch64-unknown-linux-gnu }
          - { os: macos-15, rid: osx-arm64, target: aarch64-apple-darwin }
          - { os: windows-latest, rid: win-x64, target: x86_64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}
          fetch-depth: 0

          submodules: false
      - uses: xberg-io/actions/setup-rust@v1
        with:
          target: ${{ matrix.target }}

      - name: Setup ONNX Runtime
        uses: ./.github/actions/setup-onnx-runtime
        with:
          ort-version: "1.24.2"

      - name: Install system dependencies
        uses: ./.github/actions/install-system-deps

      # Build the libheif closure from source at the macOS floor (#1243) and make
      # the FFI dylib link it instead of Homebrew's runner-OS bottles, so the
      # osx-arm64 NuGet native bundles a floor-11 heif closure. ~keep
      - name: Build libheif stack for the macOS floor
        if: contains(matrix.target, 'apple-darwin')
        shell: bash
        run: |
          export MACOSX_DEPLOYMENT_TARGET=11.0
          bash scripts/ci/build-macos-heif-deps.sh
          {
            echo "MACOSX_DEPLOYMENT_TARGET=$MACOSX_DEPLOYMENT_TARGET"
            echo "PKG_CONFIG_PATH=/tmp/xberg-heif/lib/pkgconfig"
          } >>"$GITHUB_ENV"

      - name: Setup Zig for glibc 2.28 floor
        if: contains(matrix.target, '-linux-gnu')
        uses: xberg-io/actions/setup-zig@v1

      - name: Install cargo-zigbuild for glibc 2.28 floor
        if: contains(matrix.target, '-linux-gnu')
        shell: bash
        run: command -v cargo-zigbuild || cargo install --locked cargo-zigbuild

      - name: Build liblzma statically for glibc floor
        if: contains(matrix.target, '-linux-gnu')
        shell: bash
        run: echo "LZMA_API_STATIC=1" >> "$GITHUB_ENV"

      - uses: xberg-io/actions/build-csharp-natives@v1
        with:
          target: ${{ matrix.target }}
          crate-name: xberg-ffi
          lib-name: xberg_ffi
          rid: ${{ matrix.rid }}
          glibc-version: ${{ contains(matrix.target, '-linux-gnu') && env.GLIBC_FLOOR || '' }}

      - name: Ship and verify native closure (glibc Linux)
        if: contains(matrix.target, '-linux-gnu')
        shell: bash
        run: |
          bash scripts/ci/vendor-native-closure.sh dist/csharp-natives
          bash scripts/ci/verify-glibc-floor.sh dist/csharp-natives "$GLIBC_FLOOR"

      - uses: actions/upload-artifact@v7
        with:
          name: csharp-natives-${{ matrix.rid }}
          path: dist/csharp-natives
          if-no-files-found: error
          retention-days: 14

  csharp-natives-musl:
    name: Build C# natives (linux-musl-${{ matrix.arch }})
    needs: [prepare, check-nuget]
    if: ${{ needs.prepare.outputs.release_csharp == 'true' && (needs.check-nuget.outputs.exists != 'true' || needs.prepare.outputs.force_republish == 'true') }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, arch: x64, rid: linux-musl-x64 }
          - { os: ubuntu-24.04-arm, arch: arm64, rid: linux-musl-arm64 }
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}
          fetch-depth: 0

          submodules: false
      - name: Build xberg-ffi via Alpine Docker
        run: |
          docker build -f docker/Dockerfile.musl-ffi \
            --output type=local,dest=./build-output .

      - name: Stage native lib for NuGet RID layout
        env:
          RID: ${{ matrix.rid }}
        run: |
          mkdir -p "dist/csharp-natives/runtimes/${RID}/native"
          # Dockerfile.musl-ffi bundles the FFI library plus its vendored shared-lib
          # closure (libonnxruntime + codecs) with RUNPATH=$ORIGIN, so ship all of
          # them — not just libxberg_ffi.so — or .NET fails to load ORT at runtime (#1280).
          # `*.so*` (not `*.so`) matches versioned sonames like libonnxruntime.so.1,
          # which a plain `*.so` glob silently drops. ~keep
          cp build-output/*.so* "dist/csharp-natives/runtimes/${RID}/native/"

      # The step above only proves the shared-lib closure was produced --
      # never that .NET can load it and call into it correctly. [DllImport]
      # entry points bind lazily on first call, so nothing before this point
      # has ever executed a P/Invoke into the library. This builds a small
      # program against it inside a genuine Alpine (musl libc) container and
      # runs a real extraction against a known fixture, asserting the exact
      # expected text comes back. See scripts/ci/fixtures/csharp-smoke/Program.cs
      # for details. No continue-on-error: a broken native library must fail
      # this job, not merely warn.
      - name: Smoke-test musl C# native (real extraction, not just P/Invoke resolution)
        run: |
          bash scripts/ci/smoke-test-musl-csharp-ffi.sh "dist/csharp-natives/runtimes/${{ matrix.rid }}/native"

      - uses: actions/upload-artifact@v7
        with:
          name: csharp-natives-${{ matrix.rid }}
          path: dist/csharp-natives
          if-no-files-found: error
          retention-days: 14

  elixir-natives:
    name: Build Elixir NIF (${{ matrix.label }} nif-${{ matrix.nif }})
    needs: [prepare, check-elixir-release, publish-crates]
    if: ${{ !cancelled() && needs.publish-crates.result != 'failure' && needs.prepare.outputs.release_elixir == 'true' && (needs.check-elixir-release.outputs.exists != 'true' || needs.prepare.outputs.force_republish == 'true') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-15, windows-latest]
        nif: ["2.16"]
        include:
          - os: ubuntu-latest
            label: linux-x86_64
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            label: linux-aarch64
            target: aarch64-unknown-linux-gnu
          - os: macos-15
            label: macos-arm64
            target: aarch64-apple-darwin
          - os: windows-latest
            label: windows-x86_64
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}
          fetch-depth: 0

          submodules: false
      - name: Override ImageOS on ARM Linux runners
        if: matrix.os == 'ubuntu-24.04-arm'
        shell: bash
        run: echo "ImageOS=ubuntu24" >> "$GITHUB_ENV"

      - name: Override ImageOS on Windows runners
        if: runner.os == 'Windows'
        shell: bash
        run: echo "ImageOS=win25" >> "$GITHUB_ENV"

      - uses: erlef/setup-beam@v1.24.1
        with:
          elixir-version: "1.17"
          otp-version: "27"

      - uses: xberg-io/actions/setup-rust@v1
        with:
          target: ${{ matrix.target }}

      - name: Install system dependencies
        uses: ./.github/actions/install-system-deps

      - name: Setup Zig for glibc 2.28 floor
        if: contains(matrix.target, '-linux-gnu')
        uses: xberg-io/actions/setup-zig@v1

      - name: Install cargo-zigbuild for glibc 2.28 floor
        if: contains(matrix.target, '-linux-gnu')
        shell: bash
        run: command -v cargo-zigbuild || cargo install --locked cargo-zigbuild

      - name: Build liblzma statically for glibc floor
        if: contains(matrix.target, '-linux-gnu')
        shell: bash
        run: echo "LZMA_API_STATIC=1" >> "$GITHUB_ENV"

      - name: Disable sccache wrapper on Windows
        if: contains(matrix.target, 'windows')
        shell: bash
        run: echo "RUSTC_WRAPPER=" >> "$GITHUB_ENV"

      # Was gated to `-linux-gnu` only, so Windows fell through to pyke's
      # default download strategy, which always imports DirectML.dll on
      # Windows (xberg-io/xberg#1456). Widen the gate to also run on Windows,
      # forcing ORT_STRATEGY=system so that import is never introduced.
      - name: Setup ONNX Runtime
        if: contains(matrix.target, '-linux-gnu') || contains(matrix.target, 'windows')
        uses: ./.github/actions/setup-onnx-runtime
        with:
          ort-version: "1.24.2"
          dest-dir: crates/xberg-ffi

      - uses: xberg-io/actions/build-elixir-natives@v1
        with:
          target: ${{ matrix.target }}
          nif-crate-name: xberg_nif
          nif-crate-path: packages/elixir/native/xberg_nif
          package-dir: packages/elixir
          nif-version: ${{ needs.prepare.outputs.version }}
          nif-api-version: ${{ matrix.nif }}
          glibc-version: ${{ contains(matrix.target, '-linux-gnu') && env.GLIBC_FLOOR || '' }}
          dry-run: ${{ needs.prepare.outputs.dry_run }}

      - name: Ship + verify ONNX Runtime (glibc Linux)
        if: contains(matrix.target, '-linux-gnu')
        shell: bash
        run: |
          shopt -s nullglob
          shipped=0
          for t in dist/elixir-natives/*.tar.gz; do
            shipped=1
            bash scripts/ci/vendor-native-closure.sh "$t"
            bash scripts/ci/verify-glibc-floor.sh "$t" "$GLIBC_FLOOR"
          done
          [ "$shipped" = 1 ] || echo "::notice::no artifact produced (dry-run stub); skipping ship+verify"

      # build-elixir-natives@v1 is an external action; vendor onto its OUTPUT
      # tarball rather than assume it bundles a co-located onnxruntime.dll,
      # same reasoning as the PHP PIE package step above.
      - name: Ship + verify ONNX Runtime (Windows)
        if: contains(matrix.target, 'windows')
        shell: pwsh
        run: |
          $tarballs = @(Get-ChildItem -Path dist/elixir-natives -Filter "*.tar.gz" -File -ErrorAction SilentlyContinue)
          if ($tarballs.Count -eq 0) {
            Write-Host "::notice::no artifact produced (dry-run stub); skipping ship+verify"
          }
          foreach ($t in $tarballs) {
            & "${{ github.workspace }}\scripts\ci\vendor-windows-native-closure.ps1" -Archive $t.FullName -DllSourceDir "$env:ORT_LIB_LOCATION" -NativeGlob "xberg_nif.dll"
            if ($LASTEXITCODE -ne 0) { throw "vendor-windows-native-closure failed for $($t.FullName)" }
            & "${{ github.workspace }}\scripts\ci\verify-windows-dll-closure.ps1" -Artifact $t.FullName -NativeGlob "xberg_nif.dll"
            if ($LASTEXITCODE -ne 0) { throw "verify-windows-dll-closure failed for $($t.FullName)" }
          }

      # `build-elixir-natives` returns before creating the tarball on a dry run
      # (scripts/build.py writes its outputs and skips the cargo build), so the
      # glob below matches nothing and `if-no-files-found: error` fails the job
      # -- on exactly the case the ship+verify step above deliberately tolerates
      # as a "dry-run stub". Sibling actions emit a stub and so do not hit this.
      # Gate on dry_run, NOT on is_tag: publish.yaml synthesizes a dry-run tag,
      # so `is_tag` is true on a dry run and would not skip anything. ~keep
      - uses: actions/upload-artifact@v7
        if: ${{ needs.prepare.outputs.dry_run != 'true' }}
        with:
          name: elixir-${{ matrix.label }}-nif-${{ matrix.nif }}
          path: dist/elixir-natives/*.tar.gz
          if-no-files-found: error
          retention-days: 14

  elixir-natives-musl:
    name: Build Elixir NIF (linux-musl-${{ matrix.arch }} nif-${{ matrix.nif }})
    needs: [prepare, check-elixir-release, publish-crates]
    if: ${{ !cancelled() && needs.publish-crates.result != 'failure' && needs.prepare.outputs.release_elixir == 'true' && (needs.check-elixir-release.outputs.exists != 'true' || needs.prepare.outputs.force_republish == 'true') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
        nif: ["2.16"]
        include:
          - os: ubuntu-latest
            arch: x86_64
            target: x86_64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            arch: aarch64
            target: aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}
          fetch-depth: 0

          submodules: false
      - name: Build xberg_nif via Alpine Docker
        run: |
          docker build -f docker/Dockerfile.musl-rustler \
            --output type=local,dest=./build-output .

      # Nothing before this point has ever loaded libxberg_nif.so into a BEAM
      # VM. This loads the freshly built .so directly (bypassing
      # RustlerPrecompiled's release-download / force_build paths -- see
      # scripts/ci/smoke_test_elixir_nif.exs for why) inside a genuine Alpine
      # (musl libc) container and runs a real extraction against a known
      # fixture, asserting the exact expected text comes back. No
      # continue-on-error: a broken NIF must fail this job, not merely warn.
      - name: Smoke-test musl Elixir NIF (real extraction, not just load)
        run: |
          bash scripts/ci/smoke-test-musl-elixir-nif.sh build-output

      - name: Package NIF as RustlerPrecompiled tarball
        env:
          TARGET: ${{ matrix.target }}
          NIF_API: ${{ matrix.nif }}
          NIF_VERSION: ${{ needs.prepare.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/elixir-natives staging
          cp build-output/libxberg_nif.so staging/libxberg_nif.so
          TARBALL="libxberg_nif-v${NIF_VERSION}-nif-${NIF_API}-${TARGET}.so.tar.gz"
          tar -czf "dist/elixir-natives/${TARBALL}" -C staging libxberg_nif.so
          ( cd dist/elixir-natives && sha256sum "${TARBALL}" >"${TARBALL}.sha256" )

      - uses: actions/upload-artifact@v7
        with:
          name: elixir-musl-${{ matrix.arch }}-nif-${{ matrix.nif }}
          path: dist/elixir-natives/*.tar.gz
          if-no-files-found: error
          retention-days: 14

  dart-server-natives:
    name: Build Dart server native (${{ matrix.blob }})
    needs: [prepare, check-pub]
    if: ${{ needs.prepare.outputs.release_dart == 'true' && (needs.check-pub.outputs.exists != 'true' || needs.prepare.outputs.force_republish == 'true') }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {
              os: ubuntu-latest,
              target: x86_64-unknown-linux-gnu,
              blob: linux-x86_64,
              lib: libxberg_dart.so,
            }
          - {
              os: ubuntu-24.04-arm,
              target: aarch64-unknown-linux-gnu,
              blob: linux-aarch64,
              lib: libxberg_dart.so,
            }
          - {
              os: macos-15,
              target: aarch64-apple-darwin,
              # Asset blob uses the aarch64 spelling to match native_loader.dart's
              # nativeAssetBlob() (and the linux-aarch64 asset); the cache RID stays
              # macos-arm64. A macos-arm64 asset name here 404s on Apple Silicon. ~keep
              blob: macos-aarch64,
              lib: libxberg_dart.dylib,
            }
          - {
              os: windows-latest,
              target: x86_64-pc-windows-msvc,
              blob: windows-x86_64,
              lib: xberg_dart.dll,
            }
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}
          fetch-depth: 0
          submodules: false
      - uses: xberg-io/actions/setup-rust@v1
        with:
          target: ${{ matrix.target }}
      - name: Install system dependencies
        uses: ./.github/actions/install-system-deps
      - name: Setup ONNX Runtime
        uses: ./.github/actions/setup-onnx-runtime
        with:
          ort-version: "1.24.2"
      - name: Setup Zig for glibc 2.28 floor
        if: contains(matrix.target, '-linux-gnu')
        uses: xberg-io/actions/setup-zig@v1
      - name: Install cargo-zigbuild for glibc 2.28 floor
        if: contains(matrix.target, '-linux-gnu')
        shell: bash
        run: command -v cargo-zigbuild || cargo install --locked cargo-zigbuild
      - name: Build liblzma statically for glibc floor
        if: contains(matrix.target, '-linux-gnu')
        shell: bash
        run: echo "LZMA_API_STATIC=1" >> "$GITHUB_ENV"
      - name: Disable sccache wrapper on Windows
        if: contains(matrix.target, 'windows')
        shell: bash
        run: echo "RUSTC_WRAPPER=" >> "$GITHUB_ENV"

      - name: Build Dart server native
        shell: bash
        run: |
          set -euo pipefail
          TARGET="${{ matrix.target }}"
          # `cargo zigbuild` REPLACES the `build` subcommand (no literal "build"
          # after it), so bake the whole subcommand into BUILD_CMD.
          BUILD_CMD="cargo build"
          TARGET_ARG="$TARGET"
          # Use zigbuild for linux-gnu targets to set glibc floor to 2.28
          if [[ "$TARGET" == *"-linux-gnu" ]]; then
            BUILD_CMD="cargo zigbuild"
            TARGET_ARG="${TARGET}.${GLIBC_FLOOR}"
            echo "[publish] glibc floor: ${GLIBC_FLOOR} (target: ${TARGET_ARG})"
          fi
          ${BUILD_CMD} --locked -p xberg-dart --release --target "${TARGET_ARG}"
      - name: Stage native library and vendor its ONNX Runtime closure
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          LIB: ${{ matrix.lib }}
        run: |
          set -euxo pipefail
          STAGE=dist/server-natives
          mkdir -p "$STAGE"
          cp "target/${TARGET}/release/${LIB}" "$STAGE/${LIB}"
          # The Dart native dynamically links ONNX Runtime; the download-based
          # pub package ships only these staged files, so the ORT runtime must be
          # bundled beside the native or `RustLib.init()` fails to dlopen it.
          case "$TARGET" in
            *-apple-darwin)
              # Native loads `@rpath/libonnxruntime.<ver>.dylib` with rpath
              # `@loader_path`, so ship that exact basename next to it.
              base="$(otool -L "$STAGE/${LIB}" | awk '/onnxruntime/{print $1; exit}' | xargs -r basename)"
              [ -n "$base" ] || { echo "::error::dart native does not link onnxruntime"; exit 1; }
              src="${ORT_LIB_LOCATION:?}/$base"
              [ -f "$src" ] || src="${ORT_DYLIB_PATH:?}"
              cp "$src" "$STAGE/$base"
              chmod u+w "$STAGE/$base"
              install_name_tool -id "@loader_path/$base" "$STAGE/$base"
              # This leg builds aarch64-apple-darwin, where signature state is
              # fatal, not cosmetic: dyld refuses an unsigned library outright
              # and AMFI SIGKILLs the process for an invalid one. `codesign` was
              # suppressed here and nothing ever verified the result, so a bad
              # signature would have reached Dart pub users as a hard crash.
              codesign --force -s - "$STAGE/$base"
              codesign --verify --strict "$STAGE/$base" \
                || { echo "::error::$base has no valid code signature; it would be killed at dlopen on arm64"; exit 1; }
              # The native and the ORT dylib must not resolve non-system libs.
              bad="$(otool -L "$STAGE/${LIB}" "$STAGE/$base" | tail -n +2 \
                | awk '{print $1}' | grep -E '^(/opt/homebrew|/usr/local)/' || true)"
              [ -z "$bad" ] || { echo "::error::dart native links non-system libs:"; echo "$bad"; exit 1; }
              ;;
            *-unknown-linux-gnu)
              # patchelf the $ORIGIN rpath and copy the .so closure (libonnxruntime + codecs).
              bash scripts/ci/vendor-native-closure.sh "$STAGE/${LIB}"
              bash scripts/ci/verify-glibc-floor.sh "$STAGE" "$GLIBC_FLOOR"
              compgen -G "$STAGE/libonnxruntime.so*" >/dev/null \
                || { echo "::error::libonnxruntime not vendored beside dart native"; exit 1; }
              ;;
            *-pc-windows-msvc)
              # Windows resolves imports from the loader's own directory, so ship
              # every ORT DLL beside the native.
              cp "${ORT_LIB_LOCATION:?}"/*.dll "$STAGE/"
              [ -f "$STAGE/onnxruntime.dll" ] || { echo "::error::onnxruntime.dll not staged"; exit 1; }
              ;;
          esac
          ls -l "$STAGE"
      - uses: actions/upload-artifact@v7
        with:
          name: dart-server-${{ matrix.blob }}
          path: dist/server-natives
          if-no-files-found: error
          retention-days: 14

  upload-dart-release:
    name: Upload Dart server natives to GitHub Release
    needs: [prepare, dart-server-natives]
    if: ${{ needs.prepare.outputs.is_tag == 'true' && needs.prepare.outputs.release_dart == 'true' && needs.dart-server-natives.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          owner: xberg-io

      - uses: actions/download-artifact@v8
        with:
          pattern: dart-server-*
          path: dart-server-artifacts

      - name: Package server natives as tarballs
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/dart-release
          for dir in dart-server-artifacts/dart-server-*; do
            [[ -d "$dir" ]] || continue
            blob="$(basename "$dir" | sed 's/^dart-server-//')"
            [[ -n "$(ls -A "$dir")" ]] || continue
            # Ship the whole vendored native closure (native + libonnxruntime +
            # codecs), flattened to the tarball root so native_loader.dart extracts
            # them side by side in the versioned cache dir — the native then
            # resolves ORT via @loader_path (macOS) / $ORIGIN (Linux) / the load
            # directory (Windows).
            tarball="xberg-dart-v${VERSION}-${blob}.tar.gz"
            tar -czf "dist/dart-release/${tarball}" -C "$dir" .
            ( cd dist/dart-release && sha256sum "${tarball}" >"${tarball}.sha256" )
          done

      - uses: xberg-io/actions/upload-release-assets@v1
        with:
          tag: ${{ needs.prepare.outputs.tag }}
          working-directory: dist/dart-release
          dry-run: ${{ needs.prepare.outputs.dry_run }}
          token: ${{ steps.app-token.outputs.token }}
          # Include the .sha256 sidecars: native_loader.dart verifies the
          # downloaded tarball against them before extracting, so a bare
          # xberg-dart-*.tar.gz pattern (no trailing *) would ship natives the
          # loader then refuses to install. ~keep
          assets: xberg-dart-*.tar.gz*

  swift-artifactbundle:
    name: Build Swift artifact bundle
    needs: prepare
    if: ${{ needs.prepare.outputs.release_swift == 'true' }}
    runs-on: macos-15
    # This job legitimately takes ~4h -- it succeeded in 251m in run 33623195090, by far the
    # longest in the workflow (next is 92m). The bound exists only so a genuine hang fails in
    # 5.5h instead of burning GitHub's 6h default; it is NOT sized to catch a slow build, and
    # anything below ~300m would kill a healthy one. Re-measure before lowering it. ~keep
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}
          fetch-depth: 0
          submodules: false
      - uses: xberg-io/actions/setup-rust@v1
      - name: Install system dependencies
        uses: ./.github/actions/install-system-deps

      - uses: xberg-io/actions/build-swift-artifactbundle@v1
        id: bundle
        with:
          crate-name: xberg-swift
          # Must match the asset filename the alef-generated root Package.swift
          # binaryTarget resolves: `<name>.artifactbundle.zip`. The manifest
          # references Xberg-rs.artifactbundle.zip, so the uploaded asset (named
          # after artifact-name) must be Xberg-rs, not XbergSwift, or SwiftPM 404s. ~keep
          artifact-name: Xberg-rs
          include-macos-x86_64: "false"
          include-ios-x86_64: "false"
      - uses: actions/upload-artifact@v7
        with:
          name: swift-artifactbundle
          path: ${{ steps.bundle.outputs.bundle-zip }}
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v7
        with:
          name: swift-checksum
          path: ${{ steps.bundle.outputs.checksum-file }}
          if-no-files-found: error
          retention-days: 14

  swift-package:
    name: Build Swift package
    needs: prepare
    if: ${{ needs.prepare.outputs.release_swift == 'true' }}
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}
          fetch-depth: 0

          submodules: false
      - uses: xberg-io/actions/setup-rust@v1

      - name: Install system dependencies
        uses: ./.github/actions/install-system-deps

      - uses: xberg-io/actions/build-swift-package@v1
        with:
          package-dir: packages/swift
          crate-name: xberg-swift

      - uses: actions/upload-artifact@v7
        with:
          name: swift-package
          path: packages/swift
          retention-days: 14

  update-swift-package-manifest:
    name: Update Swift Package.swift manifest with version and checksum
    # A real release checks the exact uploaded asset; a dry run checks the run artifact
    # because upload-release-assets intentionally creates no release. Only the real
    # release may rewrite Package.swift or move remote refs. ~keep
    needs: [prepare, upload-swift-bundle]
    if: ${{ needs.prepare.outputs.release_swift == 'true' && needs.upload-swift-bundle.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          owner: xberg-io

      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: true

      - uses: actions/download-artifact@v8
        if: ${{ needs.prepare.outputs.dry_run == 'true' }}
        with:
          name: swift-artifactbundle
          path: bundle-dl

      - name: Compute checksum from the artifact bundle
        id: checksum
        env:
          DRY_RUN: ${{ needs.prepare.outputs.dry_run }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          if [ "$DRY_RUN" != "true" ]; then
            gh release download "$TAG" --repo "${{ github.repository }}" \
              --pattern 'Xberg-rs.artifactbundle.zip' --dir bundle-dl --clobber
          fi
          CHECKSUM=$(sha256sum bundle-dl/Xberg-rs.artifactbundle.zip | cut -d' ' -f1)
          echo "checksum=$CHECKSUM" >> "$GITHUB_OUTPUT"

      - name: Update Package.swift with version and checksum
        if: ${{ needs.prepare.outputs.dry_run != 'true' }}
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          CHECKSUM="${{ steps.checksum.outputs.checksum }}"

          # Substitute version + checksum. Match the current value (placeholder OR a
          # real prior checksum), so a re-run re-pins the freshly-computed checksum
          # instead of no-op'ing on an already-substituted manifest.
          sed -i "s/__ALEF_SWIFT_VERSION__/${VERSION}/g" Package.swift
          sed -i -E "s|(checksum:[[:space:]]*\")[^\"]*(\")|\1${CHECKSUM}\2|" Package.swift

          echo "Updated Package.swift:"
          head -40 Package.swift

      - name: Commit and push Package.swift
        if: ${{ needs.prepare.outputs.dry_run != 'true' }}
        run: |
          git config user.name "xberg-dev-publisher[bot]"
          git config user.email "291994444+xberg-dev-publisher[bot]@users.noreply.github.com"
          git add Package.swift
          git commit -m "chore(swift): update Package.swift with checksum for v${{ needs.prepare.outputs.version }}"
          git tag -f "${{ needs.prepare.outputs.tag }}"
          git push origin -f "refs/tags/${{ needs.prepare.outputs.tag }}"
          # Also publish the checksummed commit to a release/swift/<version> branch. The
          # alef-generated Swift e2e/test-app pins `branch: "release/swift/<version>"`, so this
          # ref must exist for SwiftPM to resolve the package with the substituted XCFramework
          # checksum.
          git push origin -f "HEAD:refs/heads/release/swift/${{ needs.prepare.outputs.version }}"

  zig-package:
    name: Build Zig package (smoke check)
    needs: prepare
    if: ${{ needs.prepare.outputs.release_zig == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}
          fetch-depth: 0

          submodules: false
      - uses: xberg-io/actions/setup-rust@v1

      - name: Install system dependencies
        uses: ./.github/actions/install-system-deps

      - uses: xberg-io/actions/build-zig-package@v1
        with:
          ffi-crate: xberg-ffi
          package-dir: packages/zig

  cli-proxy-wheels:
    name: Build CLI proxy wheel (${{ matrix.target }})
    needs: [prepare, check-cli, cli-binaries, cli-binaries-musl]
    # Runs on dry runs too, matching `check-cli` and `zig-package`. This job is where the
    # runtime wheel-payload smoke test lives (GH#1407), and gating it on `is_tag` alone meant
    # a dry run SKIPPED the one check that would have caught a 257-byte launcher wheel -- the
    # matrix never expanded, so the run went green having exercised nothing. Safe to widen:
    # the job ends at `upload-artifact` and contains no twine, token or secret, and
    # `cli-binaries`/`cli-binaries-musl` carry no `is_tag` term either, so they produce real
    # binaries on a dry run rather than stubs. ~keep
    if: ${{ (needs.prepare.outputs.is_tag == 'true' || needs.prepare.outputs.dry_run == 'true') && needs.cli-binaries.result == 'success' && needs.cli-binaries-musl.result == 'success' && (needs.check-cli.outputs.exists != 'true' || needs.prepare.outputs.force_republish == 'true') }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: aarch64-apple-darwin }
          - { target: aarch64-unknown-linux-gnu }
          - { target: aarch64-unknown-linux-musl }
          - { target: x86_64-apple-darwin }
          - { target: x86_64-unknown-linux-gnu }
          - { target: x86_64-unknown-linux-musl }
          - { target: x86_64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Download CLI binaries
        uses: actions/download-artifact@v8
        with:
          pattern: cli-${{ matrix.target }}
          path: dist-cli-binaries
          merge-multiple: true

      - name: Prepare binary for wheel
        shell: bash
        run: |
          set -euo pipefail
          TARGET="${{ matrix.target }}"

          # Find the binary artifact
          if [ -f "dist-cli-binaries/xberg-cli-${TARGET}.tar.gz" ]; then
            ARTIFACT="dist-cli-binaries/xberg-cli-${TARGET}.tar.gz"
          elif [ -f "dist-cli-binaries/xberg-cli-${TARGET}.zip" ]; then
            ARTIFACT="dist-cli-binaries/xberg-cli-${TARGET}.zip"
          else
            echo "Error: No binary found for ${TARGET}"
            ls -la dist-cli-binaries/ || true
            exit 1
          fi

          # Extract to repo root so hatch_build.py can find it
          cp "$ARTIFACT" "xberg-cli-${TARGET}.$([ "${ARTIFACT##*.}" = "gz" ] && echo tar.gz || echo zip)"
          echo "Binary prepared: xberg-cli-${TARGET}.*"

      - name: Build wheel with bundled binary
        shell: bash
        working-directory: cli-proxy/pypi
        env:
          XBERG_CLI_TARGET: ${{ matrix.target }}
        run: |
          pip install hatchling build
          python -m build --wheel

      # Runtime half of the wheel payload guard. `hatch_build.py` refuses to
      # build a wheel whose staged payload is incomplete, but a build-time file
      # check cannot prove the packaged binary actually starts: `xberg_cli-1.0.14`
      # musllinux reached PyPI as a 257-byte launcher script with neither
      # `xberg.bin` nor the `lib/` tree it execs (GH#1407). Unzip the wheel and
      # run the binary it ships, mirroring the tarball smoke tests in the
      # `cli-binaries` job (`compgen -G` + `env -u LD_LIBRARY_PATH ... --version`)
      # so a wheel cannot pass on a library the runner happens to have.
      - name: Smoke-test wheel payload
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          case "$TARGET" in
            x86_64-unknown-linux-gnu | x86_64-unknown-linux-musl) ;;
            *)
              echo "::notice title=Wheel smoke test not run::${TARGET} binaries cannot execute on this x86_64 linux runner; the ${TARGET} wheel payload is covered only by the build-time checks in cli-proxy/pypi/hatch_build.py"
              exit 0
              ;;
          esac

          shopt -s nullglob
          wheels=(cli-proxy/pypi/dist/*.whl)
          if [ "${#wheels[@]}" -ne 1 ]; then
            echo "::error::expected exactly one wheel in cli-proxy/pypi/dist, found ${#wheels[@]}"
            exit 1
          fi

          UNPACK="${RUNNER_TEMP}/wheel-smoke/${TARGET}"
          rm -rf "$UNPACK"
          mkdir -p "$UNPACK"
          unzip -q "${wheels[0]}" -d "$UNPACK"

          STAGE="${UNPACK}/xberg_cli/bin/${TARGET}"
          if [ ! -d "$STAGE" ]; then
            echo "::error::wheel ships no payload directory xberg_cli/bin/${TARGET}"
            find "$UNPACK" -maxdepth 4
            exit 1
          fi
          # Wheels do not reliably carry the execute bit through force_include.
          find "$STAGE" -type f -exec chmod u+rx {} +
          case "$TARGET" in
            *-unknown-linux-gnu)
              compgen -G "$STAGE/libheif.so*" >/dev/null \
                || { echo "::error::wheel payload for ${TARGET} has no libheif.so* beside the binary"; ls -la "$STAGE"; exit 1; }
              ;;
            *-unknown-linux-musl)
              test -f "$STAGE/xberg.bin" \
                || { echo "::error::wheel payload for ${TARGET} has no xberg.bin; 'xberg' is only a launcher script"; ls -la "$STAGE"; exit 1; }
              compgen -G "$STAGE/lib/ld-musl-*.so.1" >/dev/null \
                || { echo "::error::wheel payload for ${TARGET} has no lib/ld-musl-*.so.1 for the launcher to exec"; ls -la "$STAGE"; exit 1; }
              ;;
          esac
          # On failure, dump the closure before exiting. The loader's own message
          # usually names the missing library, but on musl `$STAGE/xberg` is a
          # launcher script that execs `ld-musl-*.so.1 xberg.bin`, so the failure
          # is one indirection away from the binary that actually failed to link
          # and the bare message can be ambiguous. Task #490 has been unable to
          # name the missing library across several cycles precisely because the
          # evidence was never captured at the moment of failure; this makes one
          # run conclusive instead of buying another round trip. Diagnostics only
          # -- the `exit 1` preserves the existing failure behaviour exactly.
          if ! env -u LD_LIBRARY_PATH "$STAGE/xberg" --version; then
            echo "::group::vendor closure for ${TARGET}"
            ls -la "$STAGE" || true
            for probe in "$STAGE/xberg.bin" "$STAGE/xberg"; do
              [ -f "$probe" ] || continue
              echo "--- readelf -d $probe (NEEDED/RPATH/RUNPATH) ---"
              readelf -d "$probe" 2>/dev/null | grep -E 'NEEDED|RPATH|RUNPATH' || echo "(not an ELF, or readelf unavailable)"
              echo "--- ldd $probe ---"
              ldd "$probe" 2>&1 || true
            done
            echo "::endgroup::"
            echo "::error::wheel payload for ${TARGET} failed to run; see the closure dump above for the unresolved library"
            exit 1
          fi
          echo "Wheel smoke test passed for ${TARGET}: $(basename "${wheels[0]}")"

      - name: Upload wheel
        uses: actions/upload-artifact@v7
        with:
          name: cli-proxy-wheel-${{ matrix.target }}
          path: cli-proxy/pypi/dist/*.whl
          retention-days: 14

  upload-cli-release:
    name: Upload CLI binaries to GitHub Release
    needs: [prepare, cli-binaries, cli-binaries-musl, cli-binaries-binstall]
    if: ${{ needs.prepare.outputs.is_tag == 'true' && needs.cli-binaries.result == 'success' && needs.cli-binaries-musl.result == 'success' && needs.cli-binaries-binstall.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          owner: xberg-io

      - uses: actions/download-artifact@v8
        with:
          pattern: cli-*
          path: dist/cli
          merge-multiple: true

      # `cli-*` also matches the `cli-binstall-*` artifacts, and the
      # `xberg-cli-*` globs below attach the `xberg-cli-binstall-<target>`
      # archives alongside the bundled tarballs in one shot.
      - uses: xberg-io/actions/upload-release-assets@v1
        with:
          tag: ${{ needs.prepare.outputs.tag }}
          working-directory: dist/cli
          dry-run: ${{ needs.prepare.outputs.dry_run }}
          token: ${{ steps.app-token.outputs.token }}
          assets: |
            xberg-cli-*.tar.gz
            xberg-cli-*.zip

  # Prove a consumer can actually `cargo binstall xberg-cli` the freshly uploaded
  # (--manifest-path) so it verifies the exact metadata against the release assets
  # without waiting on the crates.io publish. Only the musl targets have binstall
  # archives, so the matrix is overridden to those triples.
  verify-binstall:
    name: Verify cargo-binstall
    needs: [prepare, upload-cli-release]
    # Not runnable on a dry run, and not adaptable to local artifacts: `cargo binstall` resolves
    # and downloads its archive over HTTP from a real, published GitHub Release, which a dry run
    # never creates (see the "Ensure GitHub Release exists" step). This is the reusable workflow's
    # entire job -- proving the public download URL resolves -- so there is no local-artifact
    # substitute that would still test the thing this job exists to test. A dry run therefore does
    # NOT verify that a consumer can actually `cargo binstall xberg-cli` against this release. ~keep
    if: ${{ needs.prepare.outputs.is_tag == 'true' && needs.upload-cli-release.result == 'success' && needs.prepare.outputs.dry_run != 'true' }}
    permissions:
      contents: read
    uses: xberg-io/actions/.github/workflows/reusable-binstall-verify.yml@v1
    with:
      package-name: xberg-cli
      binary-name: xberg
      manifest-path: crates/xberg-cli
      checkout-ref: ${{ needs.prepare.outputs.checkout_ref }}
      targets: >-
        [
          {"os": "ubuntu-latest", "target": "x86_64-unknown-linux-musl"},
          {"os": "ubuntu-24.04-arm", "target": "aarch64-unknown-linux-musl"}
        ]

  upload-go-release:
    name: Upload Go FFI archives to GitHub Release
    needs: [prepare, go-ffi-libraries]
    if: ${{ needs.prepare.outputs.is_tag == 'true' && needs.go-ffi-libraries.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          owner: xberg-io

      - uses: actions/download-artifact@v8
        with:
          pattern: go-ffi-*
          path: dist/go-ffi
          merge-multiple: true

      # The generated Go cmd/setup tool verifies each downloaded archive against
      # its .sha256 sidecar before extracting (dart download_libs parity), so the
      # sidecars must ship as release assets alongside the tarballs. ~keep
      - name: Generate SHA-256 sidecars for cmd/setup verification
        shell: bash
        run: |
          set -euo pipefail
          cd dist/go-ffi
          for t in xberg-go-*.tar.gz; do
            sha256sum "$t" > "$t.sha256"
          done
          ls -la

      - uses: xberg-io/actions/upload-release-assets@v1
        with:
          tag: ${{ needs.prepare.outputs.tag }}
          working-directory: dist/go-ffi
          dry-run: ${{ needs.prepare.outputs.dry_run }}
          token: ${{ steps.app-token.outputs.token }}
          # Trailing * includes the .sha256 sidecars (same pattern as dart). ~keep
          assets: xberg-go-*.tar.gz*

  tag-go-module:
    name: Tag Go module for pkg.go.dev resolution
    # Must run AFTER update-swift-package-manifest force-moves the release tag onto
    # the Package.swift-checksum commit. Otherwise this job races the tag-mover and
    # its checkout asserts the original triggering SHA, failing with "ref does not
    # point to expected commit". Ordering also removes a concurrent tag-push race.
    # `skipped` is accepted so a non-Swift release still tags the Go module. ~keep
    needs: [prepare, upload-go-release, update-swift-package-manifest]
    # dry-run releases must NEVER mint real remote tags; the tag script has no
    # dry-run awareness of its own, so this job is skipped entirely when dry_run
    # is true instead of trying to thread a flag through the script. ~keep
    if: ${{ !cancelled() && needs.prepare.outputs.is_tag == 'true' && needs.prepare.outputs.dry_run != 'true' && needs.upload-go-release.result == 'success' && (needs.update-swift-package-manifest.result == 'success' || needs.update-swift-package-manifest.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          owner: xberg-io

      - uses: actions/checkout@v7
        with:
          # Pin to the tag by name so checkout takes its CURRENT commit rather
          # than asserting the triggering `github.sha`. update-swift-package-manifest
          # force-moves this tag onto the Package.swift-checksum commit before this
          # job runs; without an explicit ref, checkout fails "ref does not point to
          # the expected commit". Tagging the Go module at the moved (released) tip
          # is correct for pkg.go.dev. ~keep
          ref: refs/tags/${{ needs.prepare.outputs.tag }}
          fetch-depth: 0
          fetch-tags: true
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: true

      - name: Configure git identity
        run: |
          git config user.name "xberg-bot[bot]"
          git config user.email "xberg-bot[bot]@users.noreply.github.com"

      - name: Create and push packages/go tags
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: scripts/publish/go/tag-and-push-go-module.sh "${{ needs.prepare.outputs.tag }}"

  upload-c-ffi-release:
    name: Upload C FFI archives to GitHub Release
    needs: [prepare, c-ffi-libraries]
    if: ${{ needs.prepare.outputs.is_tag == 'true' && needs.c-ffi-libraries.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          owner: xberg-io

      - uses: actions/download-artifact@v8
        with:
          pattern: c-ffi-*
          path: dist/c-ffi
          merge-multiple: true

      - uses: xberg-io/actions/upload-release-assets@v1
        with:
          tag: ${{ needs.prepare.outputs.tag }}
          working-directory: dist/c-ffi
          dry-run: ${{ needs.prepare.outputs.dry_run }}
          token: ${{ steps.app-token.outputs.token }}
          assets: xberg-ffi-*.tar.gz

  upload-elixir-release:
    name: Upload Elixir NIF archives to GitHub Release
    needs: [prepare, elixir-natives, elixir-natives-musl]
    # `is_tag` alone does NOT exclude a dry run -- prepare synthesizes
    # `v<version>-dryrun-<sha>`, so `is_tag` is true there too. Without the
    # dry_run test this job would start uploading release assets as soon as the
    # native builds stopped failing, and its download-artifact would find
    # nothing because the dry-run upload above is skipped. ~keep
    if: ${{ needs.prepare.outputs.dry_run != 'true' && needs.prepare.outputs.is_tag == 'true' && (needs.elixir-natives.result == 'success' || needs.elixir-natives-musl.result == 'success') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          owner: xberg-io

      - uses: actions/download-artifact@v8
        with:
          pattern: elixir-*
          path: dist/elixir
          merge-multiple: true

      - uses: xberg-io/actions/upload-release-assets@v1
        with:
          tag: ${{ needs.prepare.outputs.tag }}
          working-directory: dist/elixir
          dry-run: ${{ needs.prepare.outputs.dry_run }}
          token: ${{ steps.app-token.outputs.token }}
          assets: libxberg_nif-*.tar.gz

  upload-php-pie-release:
    name: Upload PHP PIE archives to GitHub Release
    needs: [prepare, php-extension]
    if: ${{ needs.prepare.outputs.is_tag == 'true' && needs.php-extension.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          owner: xberg-io

      - uses: actions/download-artifact@v8
        with:
          pattern: php-package-*
          path: dist/php-package
          merge-multiple: true

      - uses: xberg-io/actions/upload-release-assets@v1
        with:
          tag: ${{ needs.prepare.outputs.tag }}
          working-directory: dist/php-package
          dry-run: ${{ needs.prepare.outputs.dry_run }}
          token: ${{ steps.app-token.outputs.token }}
          assets: |
            php_*.tgz
            php_*.tgz.sha256
            php_*.zip
            php_*.zip.sha256

  upload-swift-bundle:
    name: Upload Swift artifact bundle to GitHub Release
    needs: [prepare, swift-artifactbundle]
    if: ${{ needs.prepare.outputs.is_tag == 'true' && needs.swift-artifactbundle.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          owner: xberg-io

      - uses: actions/download-artifact@v8
        with:
          name: swift-artifactbundle
          path: dist/swift-bundle

      - uses: xberg-io/actions/upload-release-assets@v1
        with:
          tag: ${{ needs.prepare.outputs.tag }}
          working-directory: dist/swift-bundle
          dry-run: ${{ needs.prepare.outputs.dry_run }}
          token: ${{ steps.app-token.outputs.token }}
          assets: "*.zip"

  verify-assets:
    name: Verify release assets
    needs:
      - prepare
      - upload-cli-release
      - upload-go-release
      - upload-c-ffi-release
      - upload-elixir-release
      - upload-php-pie-release
    # Runs on dry runs too, but checks different evidence. A real tag verifies against the
    # live GitHub Release (verify-release-assets queries it by tag, which does not exist on a
    # dry run — nothing is ever created at line ~150). A dry run instead verifies the same
    # cli/go-ffi/c-ffi run-artifacts that upload-*-release would have uploaded, which DO get
    # built on a dry run. Elixir and PHP are NOT covered here: elixir-natives and php-extension
    # both skip producing real artifacts on a dry run (see their own ~keep comments), so
    # upload-elixir-release/upload-php-pie-release have nothing to check and a dry run does not
    # verify NIF or PHP-PIE asset packaging. ~keep
    if: ${{ always() && needs.prepare.outputs.is_tag == 'true' && !contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-latest
    steps:
      # Mint the App token for release asset lookups (push access), consistent
      # with finalize and the other release-writing jobs. Without it the lookup
      # failed every retry with "release not found", skipping finalize and
      # cascading into a skipped Homebrew bottle build (issue #1247). ~keep
      - uses: actions/create-github-app-token@v3
        id: app-token
        if: ${{ needs.prepare.outputs.dry_run != 'true' }}
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          owner: xberg-io

      - uses: xberg-io/actions/verify-release-assets@v1
        if: ${{ needs.prepare.outputs.dry_run != 'true' }}
        with:
          tag: ${{ needs.prepare.outputs.tag }}
          token: ${{ steps.app-token.outputs.token }}
          expected-assets: |
            # CLI
            xberg-cli-*.tar.gz
            xberg-cli-*.zip
            # Go FFI
            xberg-go-*.tar.gz
            # C FFI
            xberg-ffi-*.tar.gz
            # Elixir NIF
            libxberg_nif-*.tar.gz

      - uses: actions/download-artifact@v8
        if: ${{ needs.prepare.outputs.dry_run == 'true' }}
        with:
          pattern: cli-*
          path: dist/verify-assets/cli
          merge-multiple: true

      - uses: actions/download-artifact@v8
        if: ${{ needs.prepare.outputs.dry_run == 'true' }}
        with:
          pattern: go-ffi-*
          path: dist/verify-assets/go-ffi
          merge-multiple: true

      - uses: actions/download-artifact@v8
        if: ${{ needs.prepare.outputs.dry_run == 'true' }}
        with:
          pattern: c-ffi-*
          path: dist/verify-assets/c-ffi
          merge-multiple: true

      # Same expected-assets globs as the live-release check above, minus Elixir/PHP (not
      # built on a dry run -- see the job comment). Checks the run-artifacts directly rather
      # than a GitHub Release, since a dry run never creates one. ~keep
      - name: Verify locally built release assets
        if: ${{ needs.prepare.outputs.dry_run == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          declare -A globs=(
            ["dist/verify-assets/cli"]="xberg-cli-*.tar.gz xberg-cli-*.zip"
            ["dist/verify-assets/go-ffi"]="xberg-go-*.tar.gz"
            ["dist/verify-assets/c-ffi"]="xberg-ffi-*.tar.gz"
          )
          missing=0
          for dir in "${!globs[@]}"; do
            for pattern in ${globs[$dir]}; do
              if ! compgen -G "${dir}/${pattern}" >/dev/null; then
                echo "::error::no local asset matched ${dir}/${pattern}" >&2
                missing=1
              else
                echo "OK: ${dir}/${pattern}"
              fi
            done
          done
          if [[ "$missing" -ne 0 ]]; then
            echo "::error::one or more expected dry-run release assets were not built" >&2
            exit 1
          fi

  publish-crates:
    name: Publish crates.io packages
    needs: [prepare, validate-versions, check-cratesio]
    if: ${{ needs.prepare.outputs.release_crates == 'true' && needs.prepare.outputs.is_tag == 'true' && (needs.check-cratesio.outputs.all_exist != 'true' || needs.prepare.outputs.force_republish == 'true') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.ref }}

          submodules: false
      - uses: xberg-io/actions/setup-rust@v1

      - name: Install system dependencies
        uses: ./.github/actions/install-system-deps

      - uses: xberg-io/actions/publish-crates@v1
        with:
          crates: xberg-libheif xberg-tesseract xberg-paddle-ocr xberg-candle-ocr xberg-gliner xberg-libwpd xberg-native-pdf xberg-pdfium-render xberg xberg-cli
          version: ${{ needs.prepare.outputs.version }}
          dry-run: ${{ needs.prepare.outputs.dry_run }}

  publish-pypi:
    name: Publish to PyPI
    needs: [prepare, python-wheels, python-wheels-musl, python-sdist, check-pypi, publish-crates]
    if: ${{ needs.publish-crates.result != 'failure' && needs.prepare.outputs.release_python == 'true' && needs.prepare.outputs.is_tag == 'true' && (needs.check-pypi.outputs.exists != 'true' || needs.prepare.outputs.force_republish == 'true') }}
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: python-wheels-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          name: python-sdist
          path: dist

      - name: Verify Python wheel package contents
        uses: xberg-io/actions/verify-package-contents@v1
        with:
          language: python
          artifact-path: dist
          package-name: xberg
          strict: "false"

      - uses: xberg-io/actions/publish-pypi@v1
        with:
          packages-dir: dist
          dry-run: ${{ needs.prepare.outputs.dry_run }}

  publish-cli-proxy:
    name: Publish CLI proxy to PyPI (wheels + sdist)
    needs: [prepare, check-cli, cli-proxy-wheels, publish-crates]
    if: ${{ needs.publish-crates.result != 'failure' && needs.prepare.outputs.release_cli == 'true' && needs.prepare.outputs.is_tag == 'true' && (needs.check-cli.outputs.exists != 'true' || needs.prepare.outputs.force_republish == 'true') }}
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Download CLI proxy wheels
        uses: actions/download-artifact@v8
        with:
          pattern: cli-proxy-wheel-*
          path: dist
          merge-multiple: true

      - name: Build CLI proxy sdist (fallback with downloader)
        working-directory: cli-proxy/pypi
        run: |
          pip install hatchling build
          python -m build --sdist
          cp dist/*.tar.gz ../../dist/

      - name: Verify CLI proxy package contents
        uses: xberg-io/actions/verify-package-contents@v1
        with:
          language: python
          artifact-path: dist
          package-name: xberg-cli
          strict: "false"

      - uses: xberg-io/actions/publish-pypi@v1
        with:
          packages-dir: dist
          dry-run: ${{ needs.prepare.outputs.dry_run }}

  publish-rubygems:
    name: Publish Ruby gems
    needs: [prepare, ruby-gem, check-rubygems, publish-crates]
    if: ${{ needs.publish-crates.result != 'failure' && needs.prepare.outputs.release_ruby == 'true' && needs.prepare.outputs.is_tag == 'true' && (needs.check-rubygems.outputs.exists != 'true' || needs.prepare.outputs.force_republish == 'true') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: rubygems-*
          path: dist

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: false

      - name: Update RubyGems for OIDC trusted publishing
        run: gem update --system

      - uses: rubygems/configure-rubygems-credentials@v2.1.0

      - name: Verify Ruby gem package contents
        uses: xberg-io/actions/verify-package-contents@v1
        with:
          language: ruby
          artifact-path: dist
          package-name: xberg

      - uses: xberg-io/actions/publish-rubygems@v1
        with:
          gems-dir: dist
          dry-run: ${{ needs.prepare.outputs.dry_run }}

  publish-node:
    name: Publish Node packages
    needs: [prepare, node-bindings, node-bindings-musl, node-bindings-manylinux, check-npm, publish-crates]
    if: ${{ needs.publish-crates.result != 'failure' && needs.prepare.outputs.release_node == 'true' && needs.prepare.outputs.is_tag == 'true' && (needs.check-npm.outputs.node_exists != 'true' || needs.prepare.outputs.force_republish == 'true') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.ref }}

          submodules: false
      - uses: actions/download-artifact@v8
        with:
          pattern: node-bindings-*
          path: node-artifacts
          merge-multiple: true

      - uses: xberg-io/actions/setup-node-workspace@v1
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org/"

      - name: Stage platform packages and main package
        shell: bash
        run: |
          # Every node-bindings artifact ships the canonical napi layout
          # (npm/<napi-platform>/{package.json,*.node}); the macOS/Windows legs
          # also carry index.js + index.d.ts at the tarball root. Extract them,
          # pack each platform sub-package that has both a package.json and a
          # built .node, and stamp the main package's optionalDependencies from
          # exactly those sub-packages. Platform dirs that napi created but no
          # job built (e.g. win32-arm64-msvc) have a package.json but no .node —
          # skip them so we never publish an empty package or reference it.
          # Extract each artifact in ISOLATION and copy only the platform dirs
          # that actually contain a built .node. `napi create-npm-dirs` stamps a
          # package.json stub for EVERY platform into EVERY artifact, so a blind
          # `tar -xzf` of all artifacts onto one shared tree lets a later
          # artifact's empty stub clobber the dylib-aware package.json a
          # platform's own artifact produced — resetting `files` to just the
          # .node, which makes `npm pack` silently drop the vendored ORT dylib
          # (rc.21 shipped darwin-arm64/-x64 + linux-arm64-gnu broken this way).
          # Copying only dirs-that-have-a-.node makes the merge a union of
          # populated dirs, immune to extraction order.
          rm -rf crates/xberg-node/npm
          mkdir -p crates/xberg-node/npm
          for pkg in node-artifacts/*.tar.gz; do
            scratch="$(mktemp -d)"
            tar -xzf "${pkg}" -C "${scratch}"
            for dir in "${scratch}"/npm/*/; do
              if ls "${dir}"*.node >/dev/null 2>&1; then
                # strip trailing slash so `cp -R src dest/` copies the dir
                # itself, not its contents (BSD/macOS cp semantics; harmless
                # on the GNU cp used in CI).
                cp -R "${dir%/}" crates/xberg-node/npm/
              fi
            done
            # index.js / index.d.ts ride at the tarball root on the macOS and
            # Windows legs and are identical across targets; copy when present.
            [ -f "${scratch}/index.js" ] && cp -f "${scratch}/index.js" crates/xberg-node/index.js
            [ -f "${scratch}/index.d.ts" ] && cp -f "${scratch}/index.d.ts" crates/xberg-node/index.d.ts
            rm -rf "${scratch}"
          done

          # Pack each platform sub-package (only those that shipped a binary).
          cd crates/xberg-node/npm
          for dir in */; do
            if [ -f "$dir/package.json" ] && ls "$dir"*.node >/dev/null 2>&1; then
              (cd "$dir" && npm pack && mv ./*.tgz ..)
            fi
          done
          cd ../../..

          # Stamp main package's optionalDependencies with the packed platforms.
          tmp_pkg_json="$(mktemp)"
          optional_deps_json='{}'
          for platform_pkg_json in crates/xberg-node/npm/*/package.json; do
            dir="$(dirname "$platform_pkg_json")"
            ls "$dir"/*.node >/dev/null 2>&1 || continue
            name="$(jq -r '.name // empty' "$platform_pkg_json")"
            version="$(jq -r '.version // empty' "$platform_pkg_json")"
            [[ -z "$name" || -z "$version" ]] && { echo "Invalid: $platform_pkg_json" >&2; exit 1; }
            optional_deps_json="$(jq -c --arg n "$name" --arg v "$version" '. + {($n): $v}' <<<"$optional_deps_json")"
          done
          jq --argjson deps "$optional_deps_json" '.optionalDependencies = $deps' \
            crates/xberg-node/package.json > "$tmp_pkg_json"
          mv "$tmp_pkg_json" crates/xberg-node/package.json

      # ~keep This job is gated only on the MAIN package being absent from npm
      # (check-npm.outputs.node_exists), so a re-run after a partial failure re-publishes
      # every platform sub-package and the ones that already landed answer 403
      # EPUBLISHCONFLICT. Failing the step on that would make a partially-published
      # release unrecoverable, which is why the tolerance exists. What it must NOT be
      # allowed to do is let the main package ship while a sub-package is genuinely
      # absent: the main package's optionalDependencies are stamped from the tarballs
      # this job packed, not from the registry, so a silently-skipped sub-package would
      # publish @xberg-io/xberg pointing at a version nobody can install. The
      # "Assert every optionalDependency is installable" step below is the real gate for
      # that -- it queries the registry instead of trusting this step's exit code.
      - name: Publish platform sub-packages
        continue-on-error: true
        uses: xberg-io/actions/publish-npm@v1
        with:
          packages-dir: crates/xberg-node/npm
          npm-tag: ${{ needs.prepare.outputs.npm_tag }}
          dry-run: ${{ needs.prepare.outputs.dry_run }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Wait for npm indexing (node-linux-x64-gnu)
        if: ${{ needs.prepare.outputs.dry_run != 'true' }}
        uses: xberg-io/actions/wait-for-package@v1
        with:
          registry: npm
          package: "@xberg-io/xberg-linux-x64-gnu"
          version: ${{ needs.prepare.outputs.version }}
          max-attempts: "60"

      - name: Wait for npm indexing (node-linux-arm64-gnu)
        if: ${{ needs.prepare.outputs.dry_run != 'true' }}
        uses: xberg-io/actions/wait-for-package@v1
        with:
          registry: npm
          package: "@xberg-io/xberg-linux-arm64-gnu"
          version: ${{ needs.prepare.outputs.version }}
          max-attempts: "60"

      # The two waits above only cover the two glibc Linux platforms; darwin, win32 and
      # the musl targets had no check at all. Assert that EVERY name in the main
      # package's optionalDependencies actually resolves on the registry at the exact
      # stamped version before publishing it -- otherwise `npm install @xberg-io/xberg`
      # resolves an optionalDependency that 404s. Optional deps are installed
      # best-effort by npm, so a missing one does not fail the consumer's install; it
      # fails later at import time with "Failed to load native binding", which is the
      # failure mode this gate exists to prevent.
      - name: Assert every optionalDependency is installable
        if: ${{ needs.prepare.outputs.dry_run != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          entries="$(jq -r '.optionalDependencies // {} | to_entries[] | "\(.key)\t\(.value)"' \
            crates/xberg-node/package.json)"
          if [[ -z "$entries" ]]; then
            echo "FATAL: crates/xberg-node/package.json has no optionalDependencies -- the staging step stamped nothing, so the main package would ship with no platform binaries at all." >&2
            exit 1
          fi
          missing=0
          while IFS=$'\t' read -r name version; do
            [[ -n "$name" ]] || continue
            for _ in $(seq 1 30); do
              if npm view "${name}@${version}" version >/dev/null 2>&1; then
                echo "OK: ${name}@${version}"
                continue 2
              fi
              sleep 10
            done
            echo "FATAL: ${name}@${version} is not on the npm registry" >&2
            missing=1
          done <<<"$entries"
          if [[ "$missing" -ne 0 ]]; then
            echo "FATAL: refusing to publish @xberg-io/xberg -- it would reference platform sub-packages that were never published (the 'Publish platform sub-packages' step is continue-on-error, so check its log)." >&2
            exit 1
          fi
          echo "OK: every optionalDependency resolves on the npm registry"

      - name: Publish main @xberg-io/xberg package
        uses: xberg-io/actions/publish-npm@v1
        with:
          package-dir: crates/xberg-node
          npm-tag: ${{ needs.prepare.outputs.npm_tag }}
          dry-run: ${{ needs.prepare.outputs.dry_run }}
          provenance: "true"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # NOTE (#1246 follow-up): the npm `latest` dist-tag for @xberg-io/xberg-wasm
  # currently still points at a `0.0.1` placeholder published before this
  # workflow's dist-tag logic existed (`npm view @xberg-io/xberg-wasm
  # dist-tags` -> { latest: "0.0.1", next: "1.0.0-rc.29" }). This job always
  # passes npm-tag: ${{ needs.prepare.outputs.npm_tag }}, which is "next" for
  # every prerelease (see determine_npm_tag in
  # scripts/publish/validate-and-compute-release-metadata.sh) and would only
  # become "latest" on a genuine non-prerelease (1.0.0) publish -- so this
  # workflow cannot safely repoint `latest` today without prematurely
  # promoting an rc build. Fixing the stale pointer requires a one-time,
  # out-of-band `npm dist-tag add @xberg-io/xberg-wasm@<version> latest` (or
  # unpublish/deprecate of the 0.0.1 stub) run manually by someone with
  # publish rights on the package; do not automate it here until a real
  # 1.0.0 release exists. ~keep
  publish-wasm:
    name: Publish WASM package
    needs: [prepare, wasm-bindings, check-npm, publish-crates]
    if: ${{ needs.wasm-bindings.result == 'success' && needs.publish-crates.result != 'failure' && needs.prepare.outputs.release_wasm == 'true' && needs.prepare.outputs.is_tag == 'true' && (needs.check-npm.outputs.wasm_exists != 'true' || needs.prepare.outputs.force_republish == 'true') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.ref }}

          submodules: false
      - uses: actions/download-artifact@v8
        with:
          name: wasm-bundle
          path: crates/xberg-wasm

      - uses: xberg-io/actions/setup-node-workspace@v1
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org/"

      - name: Assert npm tarball contains the wasm web bundle and fits the CDN size budget
        working-directory: crates/xberg-wasm
        shell: bash
        run: |
          set -euo pipefail
          # Regression guard for #1246: crates/xberg-wasm/pkg/web/.gitignore = "*"
          # can silently drop pkg/web from the published tarball unless
          # build:all's `find pkg -name .gitignore -delete` step ran. A missing
          # pkg/web/xberg_wasm.js or pkg/web/xberg_wasm_bg.wasm ships a package
          # that 404s at import time (the live-demo failure this bug reports).
          TARBALL=$(npm pack --silent)
          # List the tarball once, then match against the captured text. Piping
          # `tar -tzf` into `grep -qx` lets grep exit on first match and SIGPIPE
          # `tar` while it is still inflating the ~40 MB gzip; under `pipefail`
          # that makes the pipeline report non-zero and `if !` misreads it as a
          # false "missing" (the bundle is actually present). ~keep
          listing=$(tar -tzf "$TARBALL")
          MISSING=0
          for f in "package/pkg/web/xberg_wasm.js" "package/pkg/web/xberg_wasm_bg.wasm"; do
            if ! grep -qxF "$f" <<<"$listing"; then
              echo "FATAL: npm tarball is missing $f" >&2
              MISSING=1
            fi
          done
          if [[ "$MISSING" -ne 0 ]]; then
            rm -f "$TARBALL"
            echo "FATAL: wasm npm package is missing required web bundle files; aborting publish." >&2
            exit 1
          fi
          echo "OK: npm tarball contains the wasm web bundle (xberg_wasm.js + xberg_wasm_bg.wasm)"

          # Authoritative package-size gate: wasm-bindings already checked the
          # unpacked pkg/ directory, but this is the actual gzip tarball
          # npm/jsDelivr will serve, measured immediately before publish-npm
          # runs so a regression introduced between jobs (or a stale
          # wasm-bundle artifact) still can't reach the registry. Always
          # printed, pass or fail, per #435. ~keep
          tarball_size=$(stat -c%s "$TARBALL")
          rm -f "$TARBALL"
          status="ok"
          if (( tarball_size > WASM_MAX_PACKAGE_BYTES )); then
            status="FAIL"
          fi
          echo "size: npm tarball ($TARBALL) = ${tarball_size} bytes (limit ${WASM_MAX_PACKAGE_BYTES})"
          {
            echo "### WASM npm tarball size budget"
            echo
            echo "| artifact | size (bytes) | limit (bytes) | status |"
            echo "|---|---|---|---|"
            echo "| npm tarball | ${tarball_size} | ${WASM_MAX_PACKAGE_BYTES} | ${status} |"
          } >>"$GITHUB_STEP_SUMMARY"
          if [[ "$status" == "FAIL" ]]; then
            echo "::error::npm tarball is ${tarball_size} bytes, exceeding the package budget of ${WASM_MAX_PACKAGE_BYTES} bytes (jsDelivr's hard per-package cap is 150 MB). Aborting before publish-npm runs."
            exit 1
          fi

      - uses: xberg-io/actions/publish-npm@v1
        with:
          package-dir: crates/xberg-wasm
          npm-tag: ${{ needs.prepare.outputs.npm_tag }}
          dry-run: ${{ needs.prepare.outputs.dry_run }}
          provenance: "true"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-packagist:
    name: Trigger Packagist update
    needs: [prepare, upload-php-pie-release, check-packagist, publish-crates]
    if: ${{ needs.publish-crates.result != 'failure' && needs.prepare.outputs.release_php == 'true' && needs.prepare.outputs.is_tag == 'true' && (needs.check-packagist.outputs.exists != 'true' || needs.prepare.outputs.force_republish == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: xberg-io/actions/publish-packagist@v1
        with:
          packagist-username: xberg-dev
          package-name: xberg/xberg
          version: ${{ needs.prepare.outputs.version }}
          repository-url: https://github.com/xberg-io/xberg
          dry-run: ${{ needs.prepare.outputs.dry_run }}
        env:
          PACKAGIST_API_TOKEN: ${{ secrets.PACKAGIST_API_TOKEN }}

  publish-maven:
    name: Publish Maven (Java) package
    needs: [prepare, java-natives, java-natives-musl, check-maven, publish-crates]
    if: ${{ needs.publish-crates.result != 'failure' && needs.prepare.outputs.release_java == 'true' && needs.prepare.outputs.is_tag == 'true' && (needs.check-maven.outputs.java_exists != 'true' || needs.prepare.outputs.force_republish == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.ref }}

          submodules: false
      - uses: actions/download-artifact@v8
        with:
          pattern: java-natives-*
          path: artifacts/java-natives
          merge-multiple: true

      - uses: xberg-io/actions/stage-java-natives@v1
        with:
          resources-dir: packages/java/src/main/resources/natives
          required-classifiers: >-
            linux-x86_64 linux-aarch64 macos-arm64 windows-x86_64
            linux-musl-x86_64 linux-musl-aarch64
          lib-name: xberg_ffi

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - uses: xberg-io/actions/setup-maven@v1
        with:
          version: "3.9.16"

      - uses: xberg-io/actions/publish-maven@v1
        with:
          pom-file: packages/java/pom.xml
          maven-profile: publish
          extra-args: -DskipTests
          dry-run: ${{ needs.prepare.outputs.dry_run }}
        env:
          MAVEN_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

  publish-kotlin-android:
    name: Publish Kotlin Android (Maven Central via Gradle)
    needs: [prepare, kotlin-android-natives, check-maven, publish-crates]
    if: ${{ needs.publish-crates.result != 'failure' && needs.prepare.outputs.release_kotlin == 'true' && needs.prepare.outputs.is_tag == 'true' && (needs.check-maven.outputs.kotlin_exists != 'true' || needs.prepare.outputs.force_republish == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.ref }}

          submodules: false
      - uses: actions/download-artifact@v8
        with:
          pattern: kotlin-android-*
          path: kotlin-android-artifacts
          merge-multiple: true

      - name: Stage Android natives into Kotlin Android module
        shell: bash
        run: |
          for abi in arm64-v8a x86_64; do
            dest="packages/kotlin-android/src/main/jniLibs/${abi}"
            mkdir -p "$dest"
            src="kotlin-android-artifacts/${abi}/libxberg_jni.so"
            if [[ -f "$src" ]]; then
              cp -v "$src" "$dest/"
            fi
          done

      - uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-36 build-tools;36.0.0"

      - uses: xberg-io/actions/publish-maven-gradle@v1
        with:
          working-directory: packages/kotlin-android
          gradle-task: publishAndReleaseToMavenCentral
          dry-run: ${{ needs.prepare.outputs.dry_run }}
        env:
          MAVEN_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          MAVEN_GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

  publish-nuget:
    name: Publish NuGet package
    needs: [prepare, csharp-natives, csharp-natives-musl, check-nuget, publish-crates]
    if: ${{ needs.publish-crates.result != 'failure' && needs.prepare.outputs.release_csharp == 'true' && needs.prepare.outputs.is_tag == 'true' && (needs.check-nuget.outputs.exists != 'true' || needs.prepare.outputs.force_republish == 'true') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.ref }}

          submodules: false
      - uses: actions/download-artifact@v8
        with:
          pattern: csharp-natives-*
          path: csharp-natives
          merge-multiple: true

      - name: Stage runtimes/<rid>/native into NuGet project
        run: |
          mkdir -p packages/csharp/Xberg/runtimes
          for dir in csharp-natives/runtimes/*/; do
            rid="$(basename "$dir")"
            mkdir -p "packages/csharp/Xberg/runtimes/${rid}/native"
            cp -v "${dir}native/"* "packages/csharp/Xberg/runtimes/${rid}/native/"
          done
        shell: bash

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"

      - name: Render runtime.json for the meta-package's RID fallback graph
        # rc.35 still shipped every RID's native closure inside the meta package
        # itself (Xberg.csproj packed `runtimes/**` directly) and nuget.org
        # rejected the push with 413, even though the per-RID runtime.<rid>
        # packages below were already lean and published fine. The meta package
        # must instead carry only the managed assembly + this rendered
        # runtime.json, which tells NuGet's RID-fallback graph which
        # XbergIo.Xberg.runtime.<rid> package to pull in for the consumer's RID
        # — the standard runtime-package split, same shape as e.g. SQLitePCLRaw.
        # The RID list here must match packages/csharp/Xberg/runtime.json.template. ~keep
        run: |
          sed "s/{{VERSION}}/${{ needs.prepare.outputs.version }}/g" \
            packages/csharp/Xberg/runtime.json.template > packages/csharp/Xberg/runtime.json
        shell: bash

      - name: Pack NuGet packages (meta + one per-RID runtime package)
        run: |
          set -euo pipefail
          dotnet pack packages/csharp/Xberg/Xberg.csproj \
            -c Release \
            -p:Version=${{ needs.prepare.outputs.version }} \
            -o dist/nuget

          for dir in packages/csharp/Xberg/runtimes/*/; do
            rid="$(basename "$dir")"
            dotnet pack packages/csharp/Xberg.Runtime/Xberg.Runtime.csproj \
              -c Release \
              -p:Version=${{ needs.prepare.outputs.version }} \
              -p:PublishedRID="${rid}" \
              -o dist/nuget
          done
        shell: bash

      - uses: xberg-io/actions/publish-nuget@v1
        with:
          packages-dir: dist/nuget
          dry-run: ${{ needs.prepare.outputs.dry_run }}
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}

  finalize-github-release-after-uploads:
    name: Finalize GitHub Release (after uploads)
    needs:
      - prepare
      - verify-assets
      - upload-cli-release
      - upload-go-release
      - upload-c-ffi-release
      - upload-elixir-release
      - upload-php-pie-release
      - upload-swift-bundle
    # Decoupled gating: un-draft the release unless a required upload genuinely
    # FAILED. `!= 'failure'` (not `== 'success'`) tolerates idempotently-SKIPPED
    # uploads on same-tag retries — a skipped upload means the asset is already on
    # the release, so finalize must still run. `== 'success'` here previously
    # stuck every retry in draft, cascading into skipped hex/zig/homebrew. ~keep
    # Excluded from dry runs on purpose: finalize-release un-drafts (publishes) the real
    # GitHub Release, an outward-facing, irreversible action with no dry-run mode of its own,
    # and there is no such release to finalize on a dry run in the first place. ~keep
    if: >-
      ${{ always()
      && needs.prepare.outputs.is_tag == 'true'
      && needs.prepare.outputs.dry_run != 'true'
      && needs.verify-assets.result != 'failure'
      && needs.upload-cli-release.result != 'failure'
      && needs.upload-go-release.result != 'failure'
      && needs.upload-c-ffi-release.result != 'failure'
      && needs.upload-elixir-release.result != 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          owner: xberg-io

      - uses: xberg-io/actions/finalize-release@v1
        with:
          tag: ${{ needs.prepare.outputs.tag }}
          is-prerelease: ${{ needs.prepare.outputs.is_prerelease }}
          token: ${{ steps.app-token.outputs.token }}

  publish-hex:
    name: Publish Elixir Hex package
    needs: [prepare, finalize-github-release-after-uploads, check-hex, publish-crates]
    # Runs whenever the release is finalized, independent of any sibling channel's
    # result. Fetches its NIFs from the finalized release (not run-artifacts), so it
    # only needs finalize to have succeeded. ~keep
    if: >-
      ${{ always()
      && needs.finalize-github-release-after-uploads.result == 'success'
      && needs.publish-crates.result != 'failure'
      && needs.prepare.outputs.release_elixir == 'true'
      && needs.prepare.outputs.is_tag == 'true'
      && (needs.check-hex.outputs.elixir_exists != 'true' || needs.prepare.outputs.force_republish == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.ref }}

          submodules: false
      - uses: xberg-io/actions/setup-rust@v1
      - uses: erlef/setup-beam@v1.24.1
        with:
          elixir-version: "1.17"
          otp-version: "27"

      - name: Generate NIF checksum file
        uses: xberg-io/actions/generate-elixir-checksums@v1
        with:
          github-repo: xberg-io/xberg
          tag: ${{ needs.prepare.outputs.tag }}
          version: ${{ needs.prepare.outputs.version }}
          lib-name: xberg_nif
          # Must match the NIF versions actually built (elixir-natives matrix) and
          # declared in packages/elixir/lib/xberg/native.ex (`nif_versions: ["2.16"]`).
          # NIF 2.16 loads fine on OTP 27 (NIF minor versions are backward compatible),
          # so a single 2.16 artifact covers every supported runtime. Requesting 2.17
          # here made the checksum step hunt for assets that were never built. ~keep
          nif-versions: "2.16"
          targets: x86_64-unknown-linux-gnu,aarch64-unknown-linux-gnu,x86_64-unknown-linux-musl,aarch64-unknown-linux-musl,aarch64-apple-darwin,x86_64-pc-windows-msvc
          output-path: packages/elixir/checksum-Elixir.Xberg.Native.exs

      - name: Build Elixir Hex tarball with dependency rewrite
        id: build-hex
        uses: xberg-io/actions/build-elixir-hex@v1
        with:
          package-dir: packages/elixir
          nif-crate-path: packages/elixir/native/xberg_nif
          rewrite-native-deps: "true"
          dry-run: ${{ needs.prepare.outputs.dry_run }}

      - uses: xberg-io/actions/publish-hex@v1
        with:
          package-dir: packages/elixir
          tarball-path: ${{ steps.build-hex.outputs.archive-path }}
          dry-run: ${{ needs.prepare.outputs.dry_run }}
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}

  trigger-pubdev:
    name: Trigger pub.dev publish workflow
    needs: [prepare, check-pub, upload-dart-release, publish-crates]
    # Excluded from dry runs on purpose: `gh workflow run` dispatches a separate, real
    # publish-pubdev.yaml run with no dry-run awareness of its own -- an external, irreversible
    # side effect this workflow cannot take back once dispatched. ~keep
    if: ${{ needs.publish-crates.result != 'failure' && needs.prepare.outputs.release_dart == 'true' && needs.prepare.outputs.is_tag == 'true' && needs.prepare.outputs.dry_run != 'true' && (needs.check-pub.outputs.exists != 'true' || needs.prepare.outputs.force_republish == 'true') && needs.upload-dart-release.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          owner: xberg-io

      - name: Dispatch publish-pubdev workflow
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh workflow run publish-pubdev.yaml \
            --ref ${{ github.ref_name }} \
            -f ref=${{ needs.prepare.outputs.checkout_ref }}

  publish-zig:
    name: Publish Zig package metadata
    needs: [prepare, finalize-github-release-after-uploads, check-zig, c-ffi-libraries, publish-crates]
    # Consumes c-ffi RUN-artifacts, so c-ffi-libraries must have SUCCEEDED this run
    # (a skip means there are no artifacts to download). Otherwise runs independent
    # of any sibling channel's result, once the release is finalized. ~keep
    if: >-
      ${{ always()
      && needs.finalize-github-release-after-uploads.result == 'success'
      && needs.c-ffi-libraries.result == 'success'
      && needs.publish-crates.result != 'failure'
      && needs.prepare.outputs.release_zig == 'true'
      && needs.prepare.outputs.is_tag == 'true'
      && (needs.check-zig.outputs.exists != 'true' || needs.prepare.outputs.force_republish == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.ref }}
          submodules: false

      - uses: actions/download-artifact@v8
        with:
          pattern: c-ffi-*
          path: dist/c-ffi-downloaded
          merge-multiple: false

      - name: Lay out FFI artifacts for multi-platform Zig bundle
        shell: bash
        run: |
          set -euo pipefail
          # xberg c-ffi tarballs are named by platform label (no version):
          # xberg-ffi-<platform>.tar.gz, each containing <stage>/lib/* and
          # <stage>/include/*.h. Map each platform to the publish-zig RID layout.
          declare -A RID_FOR=(
            ["linux-x86_64"]="linux-x64"
            ["linux-aarch64"]="linux-arm64"
            ["macos-arm64"]="osx-arm64"
            ["windows-x86_64"]="win-x64"
          )
          out="ffi-artifacts"
          mkdir -p "$out/include"
          for art in dist/c-ffi-downloaded/*/xberg-ffi-*.tar.gz; do
            [ -f "$art" ] || continue
            platform="$(basename "$art" .tar.gz)"
            platform="${platform#xberg-ffi-}"
            rid="${RID_FOR[$platform]:-}"
            if [ -z "$rid" ]; then
              echo "::warning::Unknown C FFI platform '$platform' — skipping"
              continue
            fi
            tmp="$(mktemp -d)"
            tar -xzf "$art" -C "$tmp"
            stage_root="$(find "$tmp" -maxdepth 1 -mindepth 1 -type d | head -1)"
            mkdir -p "$out/$rid"
            # Ship shared libraries only. packages/zig/build.zig links xberg_ffi
            # dynamically (linkSystemLibrary), so the per-platform static archives
            # (libxberg_ffi.a, 500-760MB each) are dead weight. Bundling all five
            # platforms' .a produced a 1.15GB release tarball whose upload to
            # uploads.github.com failed; shared libs alone are ~70-105MB/platform.
            shopt -s nullglob
            copied=0
            for lib in "$stage_root"/lib/*.so "$stage_root"/lib/*.so.* \
                       "$stage_root"/lib/*.dylib "$stage_root"/lib/*.dll; do
              cp "$lib" "$out/$rid/"
              copied=1
            done
            shopt -u nullglob
            if [ "$copied" -eq 0 ]; then
              echo "::warning::no shared library found for $rid under $stage_root/lib — skipping"
            fi
            # nullglob is unset again just above, so an include/ with no .h would
            # leave the pattern literal and `cp` would fail -- an error previously
            # discarded, publishing a Zig bundle with no C headers to compile
            # against. Collect under nullglob and assert on the count instead of
            # trusting cp's exit status.
            shopt -s nullglob
            headers=("$stage_root"/include/*.h)
            shopt -u nullglob
            if [ "${#headers[@]}" -eq 0 ]; then
              echo "::error::no C headers found under $stage_root/include for $rid (from $art) — refusing to ship a headerless Zig bundle"
              exit 1
            fi
            cp "${headers[@]}" "$out/include/"
            rm -rf "$tmp"
          done
          # include/ is also left empty when the loop body never ran at all -- no
          # artifacts downloaded, or every platform label unknown -- which the
          # per-artifact check above cannot observe.
          shopt -s nullglob
          staged_headers=("$out"/include/*.h)
          shopt -u nullglob
          if [ "${#staged_headers[@]}" -eq 0 ]; then
            echo "::error::$out/include contains no headers — refusing to publish a Zig bundle consumers cannot compile against"
            exit 1
          fi
          ls -la "$out"
          for d in "$out"/*/; do echo "--- $d ---"; ls -la "$d"; done

      # Mint the app token immediately before the upload. GitHub App installation
      # tokens have a hard 1h TTL; laying out the multi-platform FFI bundle (>1GB)
      # can outlast a token minted at job start, causing the release upload to 401. ~keep
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          owner: xberg-io

      - uses: xberg-io/actions/publish-zig@v1
        with:
          working-directory: packages/zig
          tag: ${{ needs.prepare.outputs.tag }}
          # ~keep The action's internal steps use `GH_TOKEN: ${{ inputs.token }}`, which
          # ~keep defaults to the read-only github.token (workflow permissions are
          # ~keep contents:read) — without forwarding the app token here the release
          # ~keep asset upload fails 403 "Resource not accessible by integration".
          token: ${{ steps.app-token.outputs.token }}
          # ~keep Override the auto-detected package-name (`.xberg` from
          # ~keep build.zig.zon) to match the alef-emitted test_app URL pattern
          # ~keep `{crate-name}-zig-v{version}.tar.gz`. Without this, the asset
          # ~keep uploads as `xberg-v{version}.tar.gz` while test_apps/zig
          # ~keep fetches `xberg-zig-v{version}.tar.gz` → 404 + consumer
          # ~keep build.zig.zon placeholder hash.
          package-name: xberg-zig
          multi-platform-ffi-dir: ffi-artifacts
          module-name: xberg
          ffi-lib-name: xberg_ffi
          update-release-notes: "true"
          update-existing: "true"
          dry-run: ${{ needs.prepare.outputs.dry_run }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

  publish-homebrew-formula:
    name: Update Homebrew formula
    needs: [prepare, upload-cli-release, check-homebrew, publish-crates]
    # Pins release-asset URLs that persist on the release, so a SKIPPED upload-cli
    # on a same-tag retry (asset already uploaded) must not skip the formula bump;
    # only a genuine upload failure should. Independent of all other channels. ~keep
    if: >-
      ${{ always()
      && needs.upload-cli-release.result != 'failure'
      && needs.publish-crates.result != 'failure'
      && needs.prepare.outputs.release_homebrew == 'true'
      && needs.prepare.outputs.is_tag == 'true'
      && (needs.check-homebrew.outputs.exists != 'true' || needs.prepare.outputs.force_republish == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          owner: xberg-io

      - uses: actions/create-github-app-token@v3
        id: tap-token
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          owner: xberg-io
          repositories: homebrew-tap

      - name: Checkout source repo
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: true

      - name: Checkout homebrew-tap
        uses: actions/checkout@v7
        with:
          repository: xberg-io/homebrew-tap
          token: ${{ steps.tap-token.outputs.token }}
          path: homebrew-tap
          persist-credentials: true

      - name: Update formula files
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
          TAP_DIR: ${{ github.workspace }}/homebrew-tap
          DRY_RUN: ${{ needs.prepare.outputs.dry_run }}
        run: scripts/publish/update-homebrew-formula.sh
        shell: bash

      - name: Commit and push to tap
        if: ${{ needs.prepare.outputs.dry_run != 'true' }}
        working-directory: homebrew-tap
        env:
          GH_TOKEN: ${{ steps.tap-token.outputs.token }}
        run: |
          git config user.name "xberg-dev-publisher[bot]"
          git config user.email "291994444+xberg-dev-publisher[bot]@users.noreply.github.com"
          if git diff --quiet Formula/; then
            echo "No formula changes; skipping commit."
            exit 0
          fi
          git add Formula/xberg.rb
          git commit -m "xberg ${{ needs.prepare.outputs.version }}"
          # Every repo's publish pipeline pushes to this one shared tap, so a concurrent
          # release can land between our checkout and our push and reject it as non-fast-forward.
          # Each repo touches only its own formulas, so rebasing onto the new tip and retrying is
          # safe -- there is nothing for two releases to genuinely conflict over. ~keep
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD; then
              exit 0
            fi
            if [ "$attempt" -eq 5 ]; then
              echo "::error::could not push to the tap after 5 attempts"
              exit 1
            fi
            echo "push rejected (attempt $attempt); rebasing onto the current tap tip"
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "::error::tap rebase hit a real conflict; refusing to force the push"
              exit 1
            fi
            sleep $((attempt * 3))
          done
        shell: bash

  # The Windows counterpart of publish-homebrew-formula. There is deliberately no
  # `check-scoop` idempotency gate: the render step rewrites the manifest in place and
  # the commit below is guarded by `git diff --quiet bucket/`, so re-running a release
  # is already a no-op. ~keep
  publish-scoop-manifest:
    name: Update Scoop manifest
    needs: [prepare, upload-cli-release]
    if: ${{ needs.prepare.outputs.release_scoop == 'true' && needs.upload-cli-release.result == 'success' && (needs.prepare.outputs.is_tag == 'true' || needs.prepare.outputs.dry_run == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        id: bucket-token
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          owner: xberg-io
          repositories: scoop-bucket

      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        id: source-token
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          owner: xberg-io

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: xberg-io/scoop-bucket
          token: ${{ steps.bucket-token.outputs.token }}
          path: scoop-bucket
          persist-credentials: true

      - uses: xberg-io/actions/publish-scoop-manifests@v1
        with:
          bucket-dir: ${{ github.workspace }}/scoop-bucket
          config-file: scripts/publish/scoop.json
          tag: ${{ needs.prepare.outputs.tag }}
          version: ${{ needs.prepare.outputs.version }}
          github-repo: ${{ github.repository }}
          dry-run: ${{ needs.prepare.outputs.dry_run }}
          token: ${{ steps.source-token.outputs.token }}

      - name: Commit and push to bucket
        if: ${{ needs.prepare.outputs.dry_run != 'true' }}
        working-directory: scoop-bucket
        env:
          GH_TOKEN: ${{ steps.bucket-token.outputs.token }}
        run: |
          git config user.name "xberg-dev-publisher[bot]"
          git config user.email "291994444+xberg-dev-publisher[bot]@users.noreply.github.com"
          if git diff --quiet bucket/; then
            echo "No manifest changes; skipping commit."
            exit 0
          fi
          git add bucket/xberg.json
          git commit -m "xberg ${{ needs.prepare.outputs.version }}"
          # Six release pipelines push to this one bucket, so a concurrent release can land
          # between our checkout and our push and reject it as non-fast-forward. Each repo
          # touches only its own manifest, so rebasing onto the new tip and retrying is safe --
          # there is nothing for two releases to genuinely conflict over. ~keep
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD; then
              exit 0
            fi
            echo "push rejected (attempt $attempt); rebasing onto the current bucket tip"
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "::error::bucket rebase hit a real conflict; refusing to force the push"
              exit 1
            fi
            sleep $((attempt * 3))
          done
          echo "::error::could not push to the bucket after 5 attempts"
          exit 1

  homebrew-bottles:
    name: Build Homebrew bottle (${{ matrix.bottle_tag }})
    # Depends on finalize so the GitHub Release is out of draft before the bottle
    # build's `brew install` fetches the source tarball: the formula now pins a
    # release-asset URL (stable bytes, uploaded by publish-homebrew-formula), and
    # draft-release assets are not publicly downloadable. In dry-run finalize is
    # skipped, so this job is skipped too (no asset is uploaded to point at). ~keep
    needs: [prepare, publish-homebrew-formula, finalize-github-release-after-uploads]
    # Runs once the formula is bumped and the release is finalized (out of draft so
    # `brew install` can fetch the pinned release asset), independent of any sibling
    # channel's result. Builds from source — consumes no cross-job run-artifacts. ~keep
    if: >-
      ${{ always()
      && needs.publish-homebrew-formula.result == 'success'
      && needs.finalize-github-release-after-uploads.result == 'success'
      && needs.prepare.outputs.release_homebrew == 'true'
      && needs.prepare.outputs.is_tag == 'true' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, bottle_tag: arm64_sonoma, install_brew: false }
          # ~keep The Intel macOS `sequoia` bottle is deliberately absent, not forgotten.
          # From 2026-09-01 Homebrew serves no `openssl@3` bottle for x86_64 macOS after
          # Apple dropped Intel in macOS 27, so this leg cannot build and no change here
          # can fix it. Unlike some sibling repos, a failed bottle leg does NOT revert this
          # release to a draft -- `publish-homebrew-bottles` tolerates a failed matrix by
          # design and `release-finalize` does not gate on it -- so what the entry actually
          # costs is a permanently red job and a bottle that never appears. Intel macOS
          # falls back to a source build, which is the same outcome the entry produced.
          - { os: ubuntu-latest, bottle_tag: x86_64_linux, install_brew: true }
          - { os: ubuntu-24.04-arm, bottle_tag: arm64_linux, install_brew: true }
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}

          submodules: false
      - name: Install Homebrew (Linux)
        if: ${{ matrix.install_brew }}
        uses: xberg-io/actions/install-homebrew-linux@v1

      # Build (from source) and STAGE the bottle without uploading. A from-source build on
      # the slow macOS runners can outlast a GitHub App token's hard 1h TTL, so uploading
      # inside this step with a token minted before the build 401s (rc.36 sequoia). ~keep
      - name: Build bottles
        uses: xberg-io/actions/homebrew-build-bottles@v1
        with:
          tag: ${{ needs.prepare.outputs.tag }}
          version: ${{ needs.prepare.outputs.version }}
          tap: xberg-io/homebrew-tap
          formulas: |
            xberg
          out-dir: ${{ github.workspace }}/bottle-json
          github-repo: xberg-io/xberg
          upload: false

      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          owner: xberg-io

      - name: Upload bottle to release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          bottles=("${{ github.workspace }}/bottle-json/"*.bottle.tar.gz)
          if [[ ${#bottles[@]} -eq 0 ]]; then
            echo "::error::no bottle tarball staged in bottle-json/" >&2
            exit 1
          fi
          for b in "${bottles[@]}"; do
            echo "Uploading $(basename "$b") to ${TAG}"
            for attempt in 1 2 3 4 5; do
              if gh release upload "$TAG" "$b" --clobber --repo xberg-io/xberg; then break; fi
              if [ "$attempt" = 5 ]; then
                echo "::error::failed to upload $(basename "$b") after 5 attempts" >&2
                exit 1
              fi
              echo "attempt ${attempt}/5 failed; retrying in $((attempt * 5))s" >&2
              sleep $((attempt * 5))
            done
          done

      - uses: actions/upload-artifact@v7
        with:
          name: homebrew-bottle-json-${{ matrix.bottle_tag }}
          path: ${{ github.workspace }}/bottle-json/*.json
          if-no-files-found: error
          retention-days: 14

  publish-homebrew-bottles:
    name: Merge Homebrew bottle DSL
    needs: [prepare, publish-homebrew-formula, homebrew-bottles]
    # Consumes the bottle-json RUN-artifacts. Runs on a PARTIAL bottle set too: with
    # fail-fast:false the matrix legs upload independently, and merge-bottles renders a
    # bottle block from whatever JSON manifests are present (missing platforms fall back
    # to source-build). So a single failed leg (e.g. the slow sequoia runner) must NOT
    # drop the bottle DSL for every platform — hence success OR failure, not just success.
    # (download-artifact only pulls the legs that succeeded.) ~keep
    if: >-
      ${{ always()
      && needs.publish-homebrew-formula.result == 'success'
      && (needs.homebrew-bottles.result == 'success' || needs.homebrew-bottles.result == 'failure')
      && needs.prepare.outputs.release_homebrew == 'true'
      && needs.prepare.outputs.is_tag == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v3
        id: tap-token
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          owner: xberg-io
          repositories: homebrew-tap

      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}

          submodules: false
      - name: Checkout homebrew-tap
        uses: actions/checkout@v7
        with:
          repository: xberg-io/homebrew-tap
          token: ${{ steps.tap-token.outputs.token }}
          path: homebrew-tap
          persist-credentials: true

      - uses: actions/download-artifact@v8
        with:
          path: ${{ github.workspace }}/bottle-json
          pattern: homebrew-bottle-json-*
          merge-multiple: true

      - uses: xberg-io/actions/homebrew-merge-bottles@v1
        with:
          tag: ${{ needs.prepare.outputs.tag }}
          version: ${{ needs.prepare.outputs.version }}
          tap-dir: ${{ github.workspace }}/homebrew-tap
          json-dir: ${{ github.workspace }}/bottle-json
          formulas: |
            xberg
          github-repo: xberg-io/xberg

      - name: Commit and push bottle DSL
        if: ${{ needs.prepare.outputs.dry_run != 'true' }}
        working-directory: homebrew-tap
        env:
          GH_TOKEN: ${{ steps.tap-token.outputs.token }}
        run: |
          git config user.name "xberg-dev-publisher[bot]"
          git config user.email "291994444+xberg-dev-publisher[bot]@users.noreply.github.com"
          if git diff --quiet Formula/; then
            echo "No bottle DSL changes; skipping commit."
            exit 0
          fi
          git add Formula/xberg.rb
          git commit -m "xberg ${{ needs.prepare.outputs.version }}: add bottle DSL"
          # Every repo's publish pipeline pushes to this one shared tap, so a concurrent
          # release can land between our checkout and our push and reject it as non-fast-forward.
          # Each repo touches only its own formulas, so rebasing onto the new tip and retrying is
          # safe -- there is nothing for two releases to genuinely conflict over. ~keep
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD; then
              exit 0
            fi
            if [ "$attempt" -eq 5 ]; then
              echo "::error::could not push to the tap after 5 attempts"
              exit 1
            fi
            echo "push rejected (attempt $attempt); rebasing onto the current tap tip"
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "::error::tap rebase hit a real conflict; refusing to force the push"
              exit 1
            fi
            sleep $((attempt * 3))
          done
        shell: bash

  release-finalize:
    name: Finalize GitHub Release (post-publish validation)
    needs:
      - prepare
      - finalize-github-release-after-uploads
      - update-swift-package-manifest
      - publish-crates
      - publish-pypi
      - publish-rubygems
      - publish-node
      - publish-wasm
      - publish-packagist
      - publish-maven
      - publish-kotlin-android
      - publish-nuget
      - publish-hex
      - trigger-pubdev
      - publish-zig
      - publish-homebrew-formula
      - publish-homebrew-bottles
      - publish-scoop-manifest
    # Excluded from dry runs on purpose: this is a second finalize-release call (go-module-path
    # flavor) that updates the same real, published GitHub Release as finalize-github-release-
    # after-uploads -- outward-facing and irreversible, and again there is no such release to
    # finalize on a dry run. ~keep
    if: |
      always() &&
      !cancelled() &&
      needs.prepare.outputs.is_tag == 'true' &&
      needs.prepare.outputs.dry_run != 'true' &&
      needs.finalize-github-release-after-uploads.result != 'failure' &&
      needs.publish-crates.result != 'failure' &&
      needs.publish-pypi.result != 'failure' &&
      needs.publish-rubygems.result != 'failure' &&
      needs.publish-node.result != 'failure' &&
      needs.publish-wasm.result != 'failure' &&
      needs.publish-packagist.result != 'failure' &&
      needs.publish-maven.result != 'failure' &&
      needs.publish-kotlin-android.result != 'failure' &&
      needs.publish-nuget.result != 'failure' &&
      needs.publish-hex.result != 'failure' &&
      needs.publish-zig.result != 'failure'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          owner: xberg-io

      - uses: xberg-io/actions/finalize-release@v1
        with:
          tag: ${{ needs.prepare.outputs.tag }}
          is-prerelease: ${{ needs.prepare.outputs.is_prerelease == 'true' && 'true' || 'false' }}
          go-module-path: packages/go
          go-strip-major-version: "false"
          token: ${{ steps.app-token.outputs.token }}

  announce-discord:
    name: Announce release on Discord
    needs:
      - prepare
      - publish-crates
      - publish-pypi
      - publish-rubygems
      - publish-node
      - publish-wasm
      - publish-packagist
      - publish-maven
      - publish-kotlin-android
      - publish-nuget
      - publish-hex
      - trigger-pubdev
      - publish-zig
      - publish-homebrew-formula
      - publish-homebrew-bottles
      - publish-scoop-manifest
      - upload-cli-release
      - upload-go-release
      - upload-c-ffi-release
      - upload-elixir-release
      - upload-php-pie-release
      - upload-swift-bundle
      - release-finalize
    # Excluded from dry runs on purpose: posts a real, outward-facing announcement to a public
    # Discord channel with no dry-run mode of its own -- irreversible once sent, and would be
    # actively misleading during a dry run (announcing a release that was never published). ~keep
    if: |
      always() &&
      !cancelled() &&
      needs.prepare.outputs.is_tag == 'true' &&
      needs.prepare.outputs.dry_run != 'true' &&
      needs.prepare.outputs.is_prerelease != 'true' &&
      !contains(needs.*.result, 'failure')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          owner: xberg-io

      - uses: xberg-io/actions/announce-release-discord@v1
        with:
          tag: ${{ needs.prepare.outputs.tag }}
          webhook-url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          project-name: xberg
          token: ${{ steps.app-token.outputs.token }}

  cli-proxy:
    name: Publish CLI proxy package (npm)
    needs: [prepare, check-cli, publish-crates]
    if: ${{ needs.publish-crates.result != 'failure' && needs.prepare.outputs.release_cli == 'true' && needs.prepare.outputs.is_tag == 'true' && (needs.check-cli.outputs.exists != 'true' || needs.prepare.outputs.force_republish == 'true') }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}
      - uses: xberg-io/actions/setup-node-workspace@v1
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org/"
      # dry-run must be threaded explicitly: prepare synthesizes a dry-run tag, so this job's
      # `is_tag == 'true'` gate does not exclude dry runs (same reasoning as the elixir-natives
      # upload-artifact step elsewhere in this file), and check-cli.outputs.exists only guards
      # re-run idempotency -- it happens to be true today but is not a dry-run safeguard. ~keep
      - uses: xberg-io/actions/publish-npm@v1
        with:
          package-dir: cli-proxy/npm
          access: public
          provenance: "true"
          dry-run: ${{ needs.prepare.outputs.dry_run }}

  # --- First-party integrations (lockstep with core; see integrations/README.md) ---
  # These are additive best-effort stages: they publish the integrations that ship
  # with this core version, but are intentionally NOT part of release-finalize /
  # announce-discord `needs`, so an integration hiccup never blocks the core release.
  # Each depends on the matching core publish job so the core artifact lands first. ~keep

  publish-integrations-pypi:
    name: Publish integrations to PyPI
    needs: [prepare, publish-pypi, publish-crates]
    if: >-
      ${{ !cancelled() && needs.publish-pypi.result != 'failure'
      && needs.publish-crates.result != 'failure'
      && needs.prepare.outputs.release_python == 'true'
      && needs.prepare.outputs.is_tag == 'true' }}
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - name: Build integration distributions
        run: |
          set -euo pipefail
          mkdir -p integrations-dist
          pkgs=(
            integrations/python/crewai
            integrations/python/txtai
            integrations/python/surrealdb
            integrations/python/langchain
            integrations/python/llama-index/readers/llama-index-readers-xberg
            integrations/python/llama-index/node_parsers/llama-index-node-parser-xberg
          )
          for p in "${pkgs[@]}"; do
            echo "::group::build $p"
            uv build --sdist --wheel --out-dir integrations-dist "$p"
            echo "::endgroup::"
          done
          ls -la integrations-dist
      # Every integration PyPI project trusts (xberg-io/xberg, publish.yaml, env pypi),
      # so a single OIDC upload publishes all of them. ~keep
      - uses: xberg-io/actions/publish-pypi@v1
        with:
          packages-dir: integrations-dist
          dry-run: ${{ needs.prepare.outputs.dry_run }}

  publish-integrations-maven:
    name: Publish spring-ai integration to Maven Central
    needs: [prepare, publish-maven, publish-crates]
    if: >-
      ${{ !cancelled() && needs.publish-maven.result != 'failure'
      && needs.publish-crates.result != 'failure'
      && needs.prepare.outputs.release_java == 'true'
      && needs.prepare.outputs.is_tag == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.ref }}
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE
      - uses: xberg-io/actions/setup-maven@v1
        with:
          version: "3.9.16"
      - name: Wait for core artifact on Maven Central
        if: needs.prepare.outputs.dry_run != 'true'
        env:
          XBERG_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          # spring-ai depends on io.xberg:xberg:$XBERG_VERSION, published by the core
          # `publish-maven` job. `needs: publish-maven` guarantees that job finished but NOT
          # that the Central Portal has synced the artifact to repo1.maven.org, where mvn
          # resolves it — that indexing lag (minutes to tens of minutes) is what failed the
          # rc.36 spring-ai deploy ("Could not find artifact io.xberg:xberg:jar in central").
          url="https://repo1.maven.org/maven2/io/xberg/xberg/${XBERG_VERSION}/xberg-${XBERG_VERSION}.pom"
          for attempt in $(seq 1 60); do
            if curl -fsSL -o /dev/null "$url"; then
              echo "core artifact available after attempt ${attempt}: ${url}"
              exit 0
            fi
            echo "attempt ${attempt}/60: not yet on Central; sleeping 30s (${url})"
            sleep 30
          done
          echo "::error::io.xberg:xberg:${XBERG_VERSION} did not appear on Maven Central within ~30m; re-run this job once it syncs" >&2
          exit 1
      - uses: xberg-io/actions/publish-maven@v1
        with:
          pom-file: integrations/java/spring-ai/pom.xml
          maven-profile: publish
          extra-args: -DskipTests
          dry-run: ${{ needs.prepare.outputs.dry_run }}
        env:
          MAVEN_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

  publish-integrations-npm:
    name: Publish ${{ matrix.package }} to npm
    needs: [prepare, publish-node, publish-crates]
    # Runs on dry runs too. Each integration package pins `@xberg-io/xberg` to the exact release
    # version, and a dry-run `publish-node` never puts that version on npm, so `npm install` would die
    # with ETARGET "No matching version found for @xberg-io/xberg@<version>" before anything ran. The
    # "Resolve core dependency for dry run" step below repoints the pin at whatever version is
    # currently on npm, so the dry run still exercises install/build/pack against a real, resolvable
    # dependency -- it just isn't proof this exact release version resolves (publish-node's own
    # dry-run pack step is what covers that). ~keep
    if: >-
      ${{ !cancelled() && needs.publish-node.result != 'failure'
      && needs.publish-crates.result != 'failure'
      && needs.prepare.outputs.release_node == 'true'
      && needs.prepare.outputs.is_tag == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        package:
          - n8n-nodes-xberg
          - langchain-xberg
          - llamaindex-xberg
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}
      - uses: xberg-io/actions/setup-node-workspace@v1
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org/"
      # Dry runs never publish the release version to npm (see the job comment above), so pin
      # to whatever IS on npm right now instead of the unresolvable release version. Best-effort:
      # if nothing has ever been published for this package, leave the pin alone and let `npm
      # install` fail exactly as it would without this step. ~keep
      - name: Resolve core dependency for dry run
        if: ${{ needs.prepare.outputs.dry_run == 'true' }}
        working-directory: integrations/node/${{ matrix.package }}
        run: |
          set -euo pipefail
          published_version="$(npm view @xberg-io/xberg version 2>/dev/null || true)"
          if [[ -z "$published_version" ]]; then
            echo "::warning::@xberg-io/xberg has no published version on npm; leaving the pin as-is"
          else
            jq --arg v "$published_version" '.dependencies["@xberg-io/xberg"] = $v' package.json > package.json.tmp
            mv package.json.tmp package.json
            echo "Pinned @xberg-io/xberg to published version ${published_version} for this dry run"
          fi
      - name: Build
        working-directory: integrations/node/${{ matrix.package }}
        # `npm install` (not `npm ci`): the integration pins `@xberg-io/xberg` to the exact rc,
        # which is published to npm only by the preceding `publish-node` job of THIS run — so a
        # committed lockfile can never pre-match it (the stale rc.32 lockfile broke rc.36's npm
        # publish). install reconciles the core entry against the just-published version while
        # preserving the third-party pins already recorded in package-lock.json. ~keep
        run: |
          npm install --no-audit --no-fund
          npm run build
      - uses: xberg-io/actions/publish-npm@v1
        with:
          package-dir: integrations/node/${{ matrix.package }}
          access: public
          npm-tag: ${{ needs.prepare.outputs.npm_tag }}
          provenance: "true"
          dry-run: ${{ needs.prepare.outputs.dry_run }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # --- Coding-agent plugin (lives in plugin/, generated by ai-rulez; see plugin/README.md) ---
  # Additive best-effort like the integrations above: intentionally NOT part of
  # release-finalize / announce-discord `needs`, so a plugin hiccup never blocks the core
  # release. Both publish the same content every tagged release (version tracks core), so
  # each guards against an already-published version. `needs: [prepare]` only — the plugin
  # has no build- or runtime-dependency on the core packages (mcp-launch.sh resolves the CLI
  # at runtime), so it publishes in parallel with the core jobs. ~keep

  publish-plugin-opencode:
    name: Publish OpenCode plugin to npm
    needs: [prepare]
    if: >-
      ${{ !cancelled() && needs.prepare.outputs.release_any == 'true'
      && needs.prepare.outputs.is_tag == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}
      - uses: xberg-io/actions/setup-node-workspace@v1
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org/"
      # Plain ESM adapter — no build step. Skip if this version is already on npm so a
      # release re-run is idempotent (publish-npm has no built-in skip-existing). ~keep
      - name: Skip if already on npm
        id: guard
        run: |
          name="$(node -p "require('./plugin/package.json').name")"
          ver="$(node -p "require('./plugin/package.json').version")"
          if npm view "${name}@${ver}" version >/dev/null 2>&1; then
            echo "skip=true" >>"$GITHUB_OUTPUT"
            echo "::notice::${name}@${ver} already on npm; skipping"
          else
            echo "skip=false" >>"$GITHUB_OUTPUT"
          fi
      - uses: xberg-io/actions/publish-npm@v1
        if: steps.guard.outputs.skip != 'true'
        with:
          package-dir: plugin
          access: public
          npm-tag: ${{ needs.prepare.outputs.npm_tag }}
          provenance: "true"
          dry-run: ${{ needs.prepare.outputs.dry_run }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-plugin-hermes:
    name: Publish Hermes plugin to PyPI
    needs: [prepare]
    if: >-
      ${{ !cancelled() && needs.prepare.outputs.release_any == 'true'
      && needs.prepare.outputs.is_tag == 'true' }}
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - name: Build Hermes wheel
        run: uv build --wheel --out-dir dist-hermes plugin/.hermes/package
      # publish-pypi is idempotent (skips a version already on PyPI). ~keep
      - uses: xberg-io/actions/publish-pypi@v1
        with:
          packages-dir: dist-hermes
          dry-run: ${{ needs.prepare.outputs.dry_run }}
