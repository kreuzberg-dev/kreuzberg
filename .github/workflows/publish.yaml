  java-natives-musl:
    name: Build Java natives (linux-musl-${{ matrix.arch }})
    needs: [prepare, check-maven]
    if: ${{ needs.prepare.outputs.release_java == 'true' && (needs.check-maven.outputs.java_exists != 'true' || needs.prepare.outputs.force_republish == 'true') }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, arch: x86_64, classifier: linux-musl-x86_64 }
          - { os: ubuntu-24.04-arm, arch: aarch64, classifier: linux-musl-aarch64 }
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}
          fetch-depth: 0

          submodules: false
      - name: Build xberg-ffi via Alpine Docker
        run: |
          docker build -f docker/Dockerfile.musl-ffi \
            --output type=local,dest=./build-output .

      - name: Stage native lib for Java classifier layout
        env:
          CLASSIFIER: ${{ matrix.classifier }}
        run: |
          mkdir -p "dist/java-natives/${CLASSIFIER}"
          cp build-output/libxberg_ffi.so "dist/java-natives/${CLASSIFIER}/libxberg_ffi.so"

      # The step above only proves libxberg_ffi.so was produced -- never that
      # a JVM can load it and call into it correctly. io.xberg.NativeLib
      # already validates every required C symbol resolves by name the first
      # time any io.xberg class is touched, but symbol presence does not
      # prove a real extraction call works end to end. This compiles the
      # io.xberg sources against a real JDK inside a genuine Alpine (musl
      # libc) container and runs a real extraction against a known fixture,
      # asserting the exact expected text comes back. See
      # scripts/ci/fixtures/java-smoke/Smoke.java for details. No
      # continue-on-error: a broken native library must fail this job, not
      # merely warn.
      - name: Smoke-test musl Java native (real extraction, not just symbol presence)
        run: |
          bash scripts/ci/smoke-test-musl-java-ffi.sh build-output

      - uses: actions/upload-artifact@v7
        with:
          name: java-natives-${{ matrix.classifier }}
          path: dist/java-natives
          if-no-files-found: error
          retention-days: 14

  kotlin-android-natives:
    name: Build Kotlin Android natives (${{ matrix.abi }})
    needs: [prepare, check-maven]
    if: ${{ needs.prepare.outputs.release_kotlin == 'true' && (needs.check-maven.outputs.kotlin_exists != 'true' || needs.prepare.outputs.force_republish == 'true') }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { abi: arm64-v8a }
          - { abi: x86_64 }
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}
          fetch-depth: 0
          submodules: false
      - uses: xberg-io/actions/setup-rust@v1
      - name: Install system dependencies
        uses: ./.github/actions/install-system-deps

      - uses: xberg-io/actions/build-android-natives@v1
        with:
          # xberg-jni has no [features] table of its own; it pulls in
          # xberg's android-target feature automatically via
          # cfg(target_os = "android") dependency selection, so no
          # --features/--no-default-features flags are passed here. ~keep
          crate-name: xberg-jni
          abis: ${{ matrix.abi }}
      - uses: actions/upload-artifact@v7
        with:
          name: kotlin-android-${{ matrix.abi }}
          path: dist/android-natives
          if-no-files-found: error
