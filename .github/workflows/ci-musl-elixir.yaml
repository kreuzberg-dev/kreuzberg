name: CI Musl Elixir NIF

# The publish.yaml `elixir-natives-musl` job builds libxberg_nif.so via
# docker/Dockerfile.musl-rustler, but only ever runs on `release: published` /
# `workflow_dispatch` / `repository_dispatch` -- i.e. only when cutting an
# actual release. Its real-extraction smoke test (xberg-io/xberg#490) landed
# alongside four siblings in 94e498c5d0 and, like them, has never executed
# even once: publish.yaml has not run since.
#
# This workflow runs the identical build + smoke-test path on ordinary CI
# (the publish job's `needs: [..., publish-crates]` dependency is publish
# packaging/versioning only -- Dockerfile.musl-rustler builds entirely from
# local path deps, so nothing here requires a crates.io publish), so a break
# in docker/Dockerfile.musl-rustler or the Rustler NIF surface surfaces on
# the PR that introduced it instead of at release time. Mirrors
# ci-musl-python.yaml's cost/scope tradeoff: scoped to push/pull_request on
# paths that can plausibly affect this build, with a weekly schedule as a
# backstop against Alpine package drift the path filter cannot see.
on:
  push:
    branches: [main, chore/alef-fixes]
    paths: &musl-elixir-paths
      - "docker/Dockerfile.musl-rustler"
      - "scripts/ci/smoke-test-musl-elixir-nif.sh"
      - "scripts/ci/smoke_test_elixir_nif.exs"
      - "scripts/ci/fixtures/musl-python-smoke.pdf"
      - "packages/elixir/native/**"
      - "crates/xberg/**"
      - "crates/xberg-gliner/**"
      - "crates/xberg-tesseract/**"
      - "crates/xberg-paddle-ocr/**"
      - "crates/xberg-candle-ocr/**"
      - "crates/xberg-pdfium-render/**"
      - "crates/xberg-native-pdf/**"
      - "crates/xberg-libheif/**"
      - "crates/xberg-libwpd/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/ci-musl-elixir.yaml"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
    paths: *musl-elixir-paths
  schedule:
    # Weekly backstop, offset from the other musl CI backstops to avoid
    # runner-queue contention.
    - cron: "0 10 * * 1"
  workflow_dispatch:

concurrency:
  group: ci-musl-elixir-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  musl-elixir-nif:
    name: Build + smoke-test Elixir NIF (linux-musl-${{ matrix.arch }})
    if: github.repository == 'xberg-io/xberg' && github.actor != 'dependabot[bot]' && github.event.pull_request.draft != true
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, arch: x86_64, target: x86_64-unknown-linux-musl }
          - { os: ubuntu-24.04-arm, arch: aarch64, target: aarch64-unknown-linux-musl }
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false

      - name: Build xberg_nif via Alpine Docker
        run: |
          docker build -f docker/Dockerfile.musl-rustler \
            --output type=local,dest=./build-output .

      # Nothing before this point has ever loaded libxberg_nif.so into a BEAM
      # VM. This loads the freshly built .so directly (bypassing
      # RustlerPrecompiled's release-download / force_build paths -- see
      # scripts/ci/smoke_test_elixir_nif.exs for why) inside a genuine Alpine
      # (musl libc) container and runs a real extraction against a known
      # fixture, asserting the exact expected text comes back. No
      # continue-on-error: a broken NIF must fail this job, not merely warn.
      - name: Smoke-test musl Elixir NIF (real extraction, not just load)
        run: |
          bash scripts/ci/smoke-test-musl-elixir-nif.sh build-output
