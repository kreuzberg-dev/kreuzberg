name: CI Musl C# Native

# The publish.yaml `csharp-natives-musl` job builds libxberg_ffi.so (plus its
# vendored shared-lib closure) for .NET via docker/Dockerfile.musl-ffi, but
# only ever runs on `release: published` / `workflow_dispatch` /
# `repository_dispatch` -- i.e. only when cutting an actual release. Its
# real-extraction smoke test (xberg-io/xberg#490) landed alongside four
# siblings in 94e498c5d0 and, like them, has never executed even once:
# publish.yaml has not run since.
#
# This workflow runs the identical build + smoke-test path on ordinary CI, so
# a break in docker/Dockerfile.musl-ffi or the C# P/Invoke surface surfaces
# on the PR that introduced it instead of at release time. Mirrors
# ci-musl-python.yaml's cost/scope tradeoff: scoped to push/pull_request on
# paths that can plausibly affect this build, with a weekly schedule as a
# backstop against Alpine package drift the path filter cannot see.
on:
  push:
    branches: [main, chore/alef-fixes]
    paths: &musl-csharp-paths
      - "docker/Dockerfile.musl-ffi"
      - "scripts/ci/smoke-test-musl-csharp-ffi.sh"
      - "scripts/ci/fixtures/csharp-smoke/**"
      - "scripts/ci/fixtures/musl-python-smoke.pdf"
      - "crates/xberg-ffi/**"
      - "crates/xberg/**"
      - "crates/xberg-tesseract/**"
      - "crates/xberg-paddle-ocr/**"
      - "crates/xberg-candle-ocr/**"
      - "crates/xberg-pdfium-render/**"
      - "crates/xberg-native-pdf/**"
      - "crates/xberg-libheif/**"
      - "crates/xberg-libwpd/**"
      - "packages/csharp/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/ci-musl-csharp.yaml"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
    paths: *musl-csharp-paths
  schedule:
    # Weekly backstop, offset from the other musl CI backstops to avoid
    # runner-queue contention.
    - cron: "0 9 * * 1"
  workflow_dispatch:

concurrency:
  group: ci-musl-csharp-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  musl-csharp-native:
    name: Build + smoke-test C# native (linux-musl-${{ matrix.arch }})
    if: github.repository == 'xberg-io/xberg' && github.actor != 'dependabot[bot]' && github.event.pull_request.draft != true
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, arch: x64, rid: linux-musl-x64 }
          - { os: ubuntu-24.04-arm, arch: arm64, rid: linux-musl-arm64 }
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false

      - name: Build xberg-ffi via Alpine Docker
        run: |
          docker build -f docker/Dockerfile.musl-ffi \
            --output type=local,dest=./build-output .

      - name: Stage native lib for NuGet RID layout
        env:
          RID: ${{ matrix.rid }}
        run: |
          mkdir -p "dist/csharp-natives/runtimes/${RID}/native"
          # `*.so*` (not `*.so`) matches versioned sonames like libonnxruntime.so.1,
          # which a plain `*.so` glob silently drops. ~keep
          cp build-output/*.so* "dist/csharp-natives/runtimes/${RID}/native/"

      # The step above only proves the shared-lib closure was produced --
      # never that .NET can load it and call into it correctly. [DllImport]
      # entry points bind lazily on first call, so nothing before this point
      # has ever executed a P/Invoke into the library. This builds a small
      # program against it inside a genuine Alpine (musl libc) container and
      # runs a real extraction against a known fixture, asserting the exact
      # expected text comes back. See scripts/ci/fixtures/csharp-smoke/Program.cs
      # for details. No continue-on-error: a broken native library must fail
      # this job, not merely warn.
      - name: Smoke-test musl C# native (real extraction, not just P/Invoke resolution)
        run: |
          bash scripts/ci/smoke-test-musl-csharp-ffi.sh "dist/csharp-natives/runtimes/${{ matrix.rid }}/native"
