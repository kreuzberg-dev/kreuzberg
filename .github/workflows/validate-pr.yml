name: Validate PR

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  validate:
    if: github.event.pull_request.draft != true
    uses: xberg-io/actions/.github/workflows/reusable-validate-pr.yml@v1
    secrets: inherit
