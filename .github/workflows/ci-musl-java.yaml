name: CI Musl Java Native

# The publish.yaml `java-natives-musl` job builds libxberg_ffi.so for the JVM
# via docker/Dockerfile.musl-ffi, but only ever runs on `release: published` /
# `workflow_dispatch` / `repository_dispatch` -- i.e. only when cutting an
# actual release. Its real-extraction smoke test (xberg-io/xberg#490) landed
# alongside four siblings in 94e498c5d0 and, like them, has never executed
# even once: publish.yaml has not run since.
#
# This workflow runs the identical build + smoke-test path on ordinary CI, so
# a break in docker/Dockerfile.musl-ffi or the io.xberg JNI/Panama surface
# surfaces on the PR that introduced it instead of at release time. Mirrors
# ci-musl-python.yaml's cost/scope tradeoff: scoped to push/pull_request on
# paths that can plausibly affect this build, with a weekly schedule as a
# backstop against Alpine package drift the path filter cannot see.
on:
  push:
    branches: [main, chore/alef-fixes]
    paths: &musl-java-paths
      - "docker/Dockerfile.musl-ffi"
      - "scripts/ci/smoke-test-musl-java-ffi.sh"
      - "scripts/ci/fixtures/java-smoke/**"
      - "scripts/ci/fixtures/musl-python-smoke.pdf"
      - "crates/xberg-ffi/**"
      - "crates/xberg/**"
      - "crates/xberg-tesseract/**"
      - "crates/xberg-paddle-ocr/**"
      - "crates/xberg-candle-ocr/**"
      - "crates/xberg-pdfium-render/**"
      - "crates/xberg-native-pdf/**"
      - "crates/xberg-libheif/**"
      - "crates/xberg-libwpd/**"
      - "packages/java/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/ci-musl-java.yaml"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
    paths: *musl-java-paths
  schedule:
    # Weekly backstop, offset from the other musl CI backstops to avoid
    # runner-queue contention.
    - cron: "0 8 * * 1"
  workflow_dispatch:

concurrency:
  group: ci-musl-java-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  musl-java-native:
    name: Build + smoke-test Java native (linux-musl-${{ matrix.arch }})
    if: github.repository == 'xberg-io/xberg' && github.actor != 'dependabot[bot]' && github.event.pull_request.draft != true
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, arch: x86_64, classifier: linux-musl-x86_64 }
          - { os: ubuntu-24.04-arm, arch: aarch64, classifier: linux-musl-aarch64 }
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false

      - name: Build xberg-ffi via Alpine Docker
        run: |
          docker build -f docker/Dockerfile.musl-ffi \
            --output type=local,dest=./build-output .

      # The build alone only proves libxberg_ffi.so was produced -- never
      # that a JVM can load it and call into it correctly. This compiles the
      # io.xberg sources against a real JDK inside a genuine Alpine (musl
      # libc) container and runs a real extraction against a known fixture,
      # asserting the exact expected text comes back. See
      # scripts/ci/fixtures/java-smoke/Smoke.java for details. No
      # continue-on-error: a broken native library must fail this job, not
      # merely warn.
      - name: Smoke-test musl Java native (real extraction, not just symbol presence)
        run: |
          bash scripts/ci/smoke-test-musl-java-ffi.sh build-output
