name: CI Docker

on:
  push:
    branches: [main]
    paths: &docker-paths
      - "docker/**"
      - "scripts/ci/docker/**"
      - "scripts/test/test-docker-config-local.sh"
      - "crates/xberg/Cargo.toml"
      - "crates/xberg-cli/Cargo.toml"
      - ".github/workflows/ci-docker.yaml"
  pull_request:
    branches: [main]
    paths: *docker-paths
  workflow_dispatch:

concurrency:
  group: ci-docker-${{ github.ref }}
  cancel-in-progress: true

env:
  ORT_VERSION: "1.24.2"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read

jobs:
  docker:
    name: Docker (${{ matrix.variant }})
    if: github.repository == 'xberg-io/xberg' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        variant: [core, full, cli]
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      # scripts/ci/docker/test_docker.py mounts test_documents/ as /data:ro inside the
      # container. Without this the submodule is an empty directory, /data is empty, and
      # every variant fails identically on "File not found: '/data/pdf/searchable.pdf'".
      # Scoped to the six prefixes the suite actually reads (see the /data/... paths in
      # test_docker.py) rather than the whole corpus. ~keep
      - name: Fetch test_documents fixtures
        uses: xberg-io/actions/fetch-test-documents@v1
        with:
          include: |
            doc/**
            docx/**
            html/**
            images/**
            pdf/**
            text/**

      - name: Free disk space
        uses: xberg-io/actions/free-disk-space-linux@v1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.${{ matrix.variant }}
          push: false
          load: true
          tags: xberg:${{ matrix.variant }}
          build-args: ONNXRUNTIME_VERSION=${{ env.ORT_VERSION }}
          cache-from: type=gha,scope=ci-docker-${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=ci-docker-${{ matrix.variant }}

      - name: Save Docker image
        shell: bash
        run: |
          mkdir -p /tmp
          docker save xberg:${{ matrix.variant }} | gzip > /tmp/xberg-${{ matrix.variant }}.tar.gz
          ls -lh /tmp/xberg-${{ matrix.variant }}.tar.gz

      - name: Check image size
        uses: xberg-io/actions/check-docker-image-size@v1
        with:
          image: xberg:${{ matrix.variant }}
          warn-mb: ${{ matrix.variant == 'cli' && '200' || '' }}
          label: "${{ matrix.variant }} image"

      - name: Run feature tests
        if: matrix.variant != 'cli'
        run: scripts/ci/docker/run-feature-tests.sh "${{ matrix.variant }}"

      - name: Run configuration tests
        if: matrix.variant != 'cli'
        run: scripts/ci/docker/run-config-tests.sh "${{ matrix.variant }}"

      - name: Run API contract tests with schemathesis
        if: matrix.variant != 'cli'
        uses: xberg-io/actions/run-api-contract-tests@v1
        with:
          image: xberg:${{ matrix.variant }}
          port: "8000"

      - name: Run CLI tests
        if: matrix.variant == 'cli'
        run: scripts/ci/docker/run-cli-tests.sh
