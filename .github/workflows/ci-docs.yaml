name: CI Docs

on:
  push:
    branches: [main, chore/alef-fixes]
    paths:
      - "docs-site/**"
      - "alef.toml"
      - ".github/workflows/ci-docs.yaml"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
    paths:
      - "docs-site/**"
      - "alef.toml"
      - ".github/workflows/ci-docs.yaml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ci-docs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  docs:
    if: github.event.pull_request.draft != true
    uses: xberg-io/actions/.github/workflows/reusable-docs-deploy.yml@v1
    with:
      deploy: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' }}
