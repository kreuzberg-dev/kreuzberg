name: CI Musl Node Binding

# The publish.yaml `node-bindings-musl` job builds this NAPI binding, but only
# ever runs on `release: published` / `workflow_dispatch` / `repository_dispatch`
# -- i.e. only when cutting an actual release. Its real-extraction smoke test
# (xberg-io/xberg#490) landed alongside four siblings in 94e498c5d0 and, like
# them, has never executed even once: publish.yaml has not run since.
#
# This workflow runs the identical build + smoke-test path on ordinary CI, so
# a break in docker/Dockerfile.musl-node or the napi-rs binding surfaces on
# the PR that introduced it instead of at release time. Mirrors
# ci-musl-python.yaml's cost/scope tradeoff: scoped to push/pull_request on
# paths that can plausibly affect this build, with a weekly schedule as a
# backstop against Alpine package drift the path filter cannot see.
on:
  push:
    branches: [main, chore/alef-fixes]
    paths: &musl-node-paths
      - "docker/Dockerfile.musl-node"
      - "scripts/ci/smoke-test-musl-node-binding.sh"
      - "scripts/ci/smoke_test_node_binding.js"
      - "scripts/ci/fixtures/musl-python-smoke.pdf"
      - "crates/xberg-node/**"
      - "crates/xberg/**"
      - "crates/xberg-tesseract/**"
      - "crates/xberg-paddle-ocr/**"
      - "crates/xberg-candle-ocr/**"
      - "crates/xberg-pdfium-render/**"
      - "crates/xberg-native-pdf/**"
      - "crates/xberg-libheif/**"
      - "crates/xberg-libwpd/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/ci-musl-node.yaml"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
    paths: *musl-node-paths
  schedule:
    # Weekly backstop, offset from ci-musl-python.yaml (06:00 Monday) to avoid
    # runner-queue contention.
    - cron: "0 7 * * 1"
  workflow_dispatch:

concurrency:
  group: ci-musl-node-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  musl-node-binding:
    name: Build + smoke-test Node binding (linux-musl-${{ matrix.arch }})
    if: github.repository == 'xberg-io/xberg' && github.actor != 'dependabot[bot]' && github.event.pull_request.draft != true
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, arch: x86_64, napi_arch: x64, target: x86_64-unknown-linux-musl }
          - { os: ubuntu-24.04-arm, arch: aarch64, napi_arch: arm64, target: aarch64-unknown-linux-musl }
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false

      - name: Build Node NAPI binding via Alpine Docker
        run: |
          docker build -f docker/Dockerfile.musl-node \
            --build-arg TARGET=${{ matrix.target }} \
            --output type=local,dest=./build-output .

      - name: Stage .node + vendored shared libs for smoke test
        run: |
          platform="linux-${{ matrix.napi_arch }}-musl"
          mkdir -p "staging/npm/${platform}"
          find build-output -name "*.node" -exec cp {} "staging/npm/${platform}/" \;
          test -n "$(find "staging/npm/${platform}" -name '*.node')" || {
            echo "::error::no .node produced by musl build for ${platform}"; exit 1; }
          # `*.so*` (not `*.so`) matches versioned sonames like libonnxruntime.so.1,
          # which a plain `*.so` glob silently drops. ~keep
          if ls build-output/*.so* >/dev/null 2>&1; then
            cp -v build-output/*.so* "staging/npm/${platform}/"
          else
            echo "::error::no vendored shared libs produced by musl build for ${platform}"; exit 1
          fi

      # No continue-on-error and no `|| true` on this path: a broken binding
      # must fail this job loudly, not warn. See scripts/ci/smoke_test_node_binding.js
      # for exactly what this catches and why a require()-only check is not enough.
      - name: Smoke-test musl Node binding (real extraction, not just require)
        run: |
          platform="linux-${{ matrix.napi_arch }}-musl"
          bash scripts/ci/smoke-test-musl-node-binding.sh "staging/npm/${platform}"
