name: CI Musl Python Wheel

# The publish.yaml `python-wheels-musl` job builds this wheel, but only ever
# runs on `release: published` / `workflow_dispatch` / `repository_dispatch` --
# i.e. only when cutting an actual release, which is rare and often skipped in
# dry runs. That left the wheel's musl-libc build (and, until #490's fix, its
# smoke test) effectively unexercised between releases: a regression in
# docker/Dockerfile.musl-python, scripts/ci/vendor-native-closure.sh, or the
# xberg-py/xberg-py bindings could sit unnoticed for weeks.
#
# This workflow runs the identical build + smoke-test path on ordinary CI, so
# a break surfaces on the PR that introduced it instead of at release time.
# Cost/scope tradeoff, made deliberately:
#   - Full Alpine cross-compilation is expensive (each leg builds ONNX Runtime
#     bindings, libheif, libwpd, etc. from an Alpine base), so this is scoped
#     to push/pull_request on paths that can plausibly affect this build --
#     NOT every PR, and not the entire crates/ tree.
#   - A weekly schedule is kept as a backstop: the path filter is a best
#     effort (it cannot enumerate transitive Cargo.lock-level or toolchain
#     drift), and Alpine's rolling package repositories can break this build
#     with no repo change at all.
on:
  push:
    branches: [main, chore/alef-fixes]
    paths: &musl-python-paths
      - "docker/Dockerfile.musl-python"
      - "scripts/ci/vendor-native-closure.sh"
      - "scripts/ci/smoke-test-musl-python-wheel.sh"
      - "scripts/ci/smoke_test_python_wheel.py"
      - "scripts/ci/fixtures/musl-python-smoke.pdf"
      - "crates/xberg-py/**"
      - "crates/xberg/**"
      - "crates/xberg-tesseract/**"
      - "crates/xberg-paddle-ocr/**"
      - "crates/xberg-candle-ocr/**"
      - "crates/xberg-pdfium-render/**"
      - "crates/xberg-native-pdf/**"
      - "crates/xberg-libheif/**"
      - "crates/xberg-libwpd/**"
      - "packages/python/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/ci-musl-python.yaml"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
    paths: *musl-python-paths
  schedule:
    # Weekly backstop -- see rationale above. 06:00 UTC Monday, offset from
    # other scheduled jobs in this org to avoid runner-queue contention.
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: ci-musl-python-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  musl-python-wheel:
    name: Build + smoke-test Python wheel (musl-${{ matrix.arch }})
    if: github.repository == 'xberg-io/xberg' && github.actor != 'dependabot[bot]' && github.event.pull_request.draft != true
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, arch: x86_64, target: x86_64-unknown-linux-musl }
          - { os: ubuntu-24.04-arm, arch: aarch64, target: aarch64-unknown-linux-musl }
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false

      - name: Build Python wheel via Alpine Docker
        run: |
          docker build -f docker/Dockerfile.musl-python \
            --build-arg TARGET=${{ matrix.target }} \
            --output type=local,dest=./build-output .

      - name: Verify musl wheel produced
        run: |
          test -n "$(find build-output -name '*.whl')" || {
            echo "::error::no wheel produced by musl build for ${{ matrix.target }}"; exit 1; }

      # No continue-on-error and no `|| true` on this path: a broken wheel
      # must fail this job loudly, not warn. See scripts/ci/smoke_test_python_wheel.py
      # for exactly what this catches and why import-only is not enough.
      - name: Smoke-test musl wheel (real extraction, not just import)
        run: |
          wheel="$(find build-output -name '*.whl' | head -n1)"
          bash scripts/ci/smoke-test-musl-python-wheel.sh "$wheel"
