      - name: Setup Python
        uses: xberg-io/actions/setup-python-env@v1
        with:
          python-version: "3.11"
          cache-prefix: benchmark-markitdown
          install-command: "uv sync --no-install-project --no-install-workspace --group dev --group bench-markitdown --prerelease=allow"

      - name: Run benchmark
        env:
          FRAMEWORK: markitdown
