          retention-days: 30

  aggregate-and-publish:
    name: Aggregate & Release Results
    needs:
      [
        setup,
        prefetch-mineru-models,
        bench-rust,
        bench-docling,
        bench-markitdown,
        bench-unstructured,
        bench-tika,
        bench-pymupdf4llm,
        bench-mineru,
        bench-liteparse,
      ]
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write
    # MinerU prefetch is a HARD gate: if it fails, do not publish a partial
    # baseline -- skip aggregation so the whole run fails. Other frameworks stay
    # soft (always() tolerates their failures); only prefetch is mandatory.
    if: ${{ always() && !cancelled() && needs.prefetch-mineru-models.result == 'success' && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch') }}
    steps:
      - name: Create GitHub App token (if credentials available)
        id: app-token
        continue-on-error: true
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.setup.outputs.source-sha || github.sha }}
          submodules: recursive
          lfs: true

      - name: Download reference corpus cache
        uses: actions/download-artifact@v8
        with:
          name: benchmark-corpus-cache
          path: ${{ runner.temp }}/benchmark-corpus-cache

      - name: Unpack reference corpus cache
        run: tar -C test_documents -xf "${RUNNER_TEMP}/benchmark-corpus-cache/corpus-cache.tar"

      # Reuse the harness binary + xberg-cli that `setup` already built and
      # uploaded (benchmarks-target) instead of cold-rebuilding them here -- the
      # xberg-cli is only needed so its on-disk size can be measured, and the
      # harness binary runs validate-artifacts/consolidate. Same approach as
      # bench-rust. The runtime still needs the native libs + ORT to execute the
      # downloaded binary, but not a Rust toolchain or a compile.
      - name: Download build artifacts (harness binary + xberg-cli)
        if: needs.setup.result == 'success'
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.setup.outputs.artifact-name }}
          path: target/release

      - name: Restore benchmark binary permissions
        if: needs.setup.result == 'success'
        run: scripts/benchmarks/restore-binary-permissions.sh

      - name: Install system dependencies (libheif + native libs for harness binary)
        if: needs.setup.result == 'success'
        uses: ./.github/actions/install-system-deps

      - name: Setup ONNX Runtime
        if: needs.setup.result == 'success'
        uses: ./.github/actions/setup-onnx-runtime
        with:
          ort-version: ${{ env.ORT_VERSION }}

      - name: Download all benchmark artifacts
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          pattern: "benchmarks-*-${{ github.run_id }}"
          path: benchmark-artifacts/_all/
          merge-multiple: false

      - name: Partition artifacts into per-cohort directories
        if: always()
        run: |
          set -euo pipefail
          RUN_ID="${{ github.run_id }}"
          # CliCohort -> cohort-manifest basename. No basename is a suffix of another, so a
          # single trailing match assigns each artifact directory to exactly one cohort.
          declare -A COHORT_BASENAME=(
            [native]=native-pdf-fast-b8
            [ocr]=ocr-pdf-fast-b4
            [office]=native-office-fast
            [markup]=native-markup-fast
            [ebook]=native-ebook-fast
            [email]=native-email-fast
            [data]=native-data-fast
            [images]=ocr-images-fast
          )
          shopt -s nullglob
          for dir in benchmark-artifacts/_all/*/; do
            name="$(basename "$dir")"
            stem="${name%-"$RUN_ID"}"
            for clicohort in "${!COHORT_BASENAME[@]}"; do
              base="${COHORT_BASENAME[$clicohort]}"
              if [[ "$stem" == *-"$base" ]]; then
                mkdir -p "benchmark-artifacts/$clicohort"
                mv "$dir" "benchmark-artifacts/$clicohort/$name"
                break
              fi
            done
          done

      - name: Log downloaded benchmark artifact inventory
        if: always()
        run: |
          set -uo pipefail
          for cohort in native ocr office markup ebook email data images; do
            root="benchmark-artifacts/${cohort}"
            echo "=== ${cohort} artifacts (${root}) ==="
            if [ ! -d "$root" ]; then
              echo "!! no artifact directory (all ${cohort} jobs missing?)"
              continue
            fi
            find "$root" -mindepth 1 -maxdepth 1 -type d | sort | while read -r dir; do
              n_results=$(find "$dir" -name results.json | wc -l | tr -d ' ')
              n_prov=$(find "$dir" -name provenance.json | wc -l | tr -d ' ')
              echo "  $(basename "$dir"): results.json=${n_results} provenance.json=${n_prov}"
            done
          done

      - name: Validate benchmark artifacts (all cohorts)
        id: validate-artifacts
        if: always()
        run: |
          set -euo pipefail
          declare -A COHORT_BASENAME=(
            [native]=native-pdf-fast-b8
            [ocr]=ocr-pdf-fast-b4
            [office]=native-office-fast
            [markup]=native-markup-fast
            [ebook]=native-ebook-fast
            [email]=native-email-fast
            [data]=native-data-fast
            [images]=ocr-images-fast
          )
          for clicohort in native ocr office markup ebook email data images; do
            base="${COHORT_BASENAME[$clicohort]}"
            # mkdir so a cohort whose required producer emitted nothing yields the validator's
            # "missing artifacts" contract error rather than an opaque read_dir failure.
            mkdir -p "benchmark-artifacts/$clicohort"
            echo "=== validate-artifacts: $clicohort ($base) ==="
            ./target/release/benchmark-harness validate-artifacts \
              --cohort "$clicohort" \
              --artifacts-dir "benchmark-artifacts/$clicohort" \
              --cohort-manifest "tools/benchmark-harness/cohorts/$base.json" \
              --fixtures-root tools/benchmark-harness/fixtures \
              --source-sha '${{ needs.setup.outputs.source-sha }}' \
              --run-id '${{ github.run_id }}' \
              --iterations '${{ env.ITERATIONS }}'
          done

      - name: Consolidate results (all cohorts)
        if: ${{ always() && steps.validate-artifacts.outcome == 'success' }}
        run: |
          set -euo pipefail
          for clicohort in native ocr office markup ebook email data images; do
            INPUTS=$(find "benchmark-artifacts/$clicohort" -mindepth 1 -maxdepth 1 -type d | sort | paste -sd, -)
            ./target/release/benchmark-harness consolidate \
              --inputs "$INPUTS" \
              --output "consolidated-output/$clicohort/"
          done

      - name: Validate aggregates (all cohorts)
        id: validate-aggregates
        if: ${{ always() && steps.validate-artifacts.outcome == 'success' }}
        run: |
          set -euo pipefail
          for clicohort in native ocr office markup ebook email data images; do
            # Pass --fixtures-root explicitly (as the raw-artifact step above does): without it the
            # binary falls back to a compile-time env!("CARGO_MANIFEST_DIR") path baked on the
            # bench-rust build runner (/home/runner/_work/...), which does not exist on this runner.
            ./target/release/benchmark-harness validate-artifacts \
              --cohort "$clicohort" \
              --fixtures-root tools/benchmark-harness/fixtures \
              --aggregated-file "consolidated-output/$clicohort/aggregated.json"
          done

      - name: Prepare cohort release assets
        id: prepare-release-assets
        if: ${{ always() && steps.validate-aggregates.outcome == 'success' }}
        run: |
          set -euo pipefail
          mkdir -p release-assets
          SOURCE_SHA="${{ needs.setup.outputs.source-sha }}"
          UPDATED_AT="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          RUN_ID="${{ github.run_id }}"
          # Per-cohort manifest name, BLAKE3, and required/optional matrix key counts come
          # straight from the pinned bench_matrix contract via `cohort-contract`, so the release
          # metadata can never drift from the validator (no hand-copied hashes/counts here).
          index_cohorts='{}'
          for clicohort in native ocr office markup ebook email data images; do
            cp "consolidated-output/$clicohort/aggregated.json" "release-assets/benchmarks-$clicohort-aggregated.json"
            contract="$(./target/release/benchmark-harness cohort-contract --cohort "$clicohort")"
            jq -n \
              --arg cohort "$(jq -r '.manifest_name' <<<"$contract")" \
              --arg cohort_hash "$(jq -r '.manifest_blake3' <<<"$contract")" \
              --argjson expected "$(jq -r '.expected_matrix_keys' <<<"$contract")" \
              --argjson optional "$(jq -r '.optional_matrix_keys' <<<"$contract")" \
              --arg commit "$SOURCE_SHA" \
              --arg run_id "$RUN_ID" \
              --arg run_url "$RUN_URL" \
              --arg updated_at "$UPDATED_AT" \
              '{cohort: $cohort, cohort_manifest_blake3: $cohort_hash, expected_matrix_keys: $expected, optional_matrix_keys: $optional, commit: $commit, run_id: $run_id, run_url: $run_url, updated_at: $updated_at}' \
              > "release-assets/benchmarks-$clicohort-metadata.json"
            index_cohorts="$(jq \
              --arg k "$clicohort" \
              --arg agg "benchmarks-$clicohort-aggregated.json" \
              --arg meta "benchmarks-$clicohort-metadata.json" \
              '.[$k] = {aggregated: $agg, metadata: $meta}' <<<"$index_cohorts")"
          done
          jq -n \
            --arg commit "$SOURCE_SHA" \
            --arg run_id "$RUN_ID" \
            --arg run_url "$RUN_URL" \
            --arg updated_at "$UPDATED_AT" \
            --argjson cohorts "$index_cohorts" \
            '{schema_version: 1, commit: $commit, run_id: $run_id, run_url: $run_url, updated_at: $updated_at, cohorts: $cohorts}' \
            > release-assets/benchmarks-index.json

      - name: Log aggregation gate status
        if: always()
        run: |
          echo "=== Upstream job results ==="
          echo "setup=${{ needs.setup.result }}"
          echo "bench-rust=${{ needs.bench-rust.result }}"
          echo "bench-docling=${{ needs.bench-docling.result }}"
          echo "bench-markitdown=${{ needs.bench-markitdown.result }}"
          echo "bench-unstructured=${{ needs.bench-unstructured.result }}"
          echo "bench-tika=${{ needs.bench-tika.result }}"
          echo "bench-pymupdf4llm=${{ needs.bench-pymupdf4llm.result }}"
          echo "bench-mineru=${{ needs.bench-mineru.result }} (optional; NOT a release gate)"
          echo "bench-liteparse=${{ needs.bench-liteparse.result }}"
          echo "=== Aggregation step outcomes ==="
          echo "validate-artifacts=${{ steps.validate-artifacts.outcome }}"
          echo "validate-aggregates=${{ steps.validate-aggregates.outcome }}"
          echo "prepare-release-assets=${{ steps.prepare-release-assets.outcome }}"

      - name: Create GitHub Release with benchmark results
        # Publication gates on the required producer jobs (setup + bench-rust; xberg is required in
        # every cohort) AND on validate-artifacts, which enforces the full contract. The validator
        # is the real gate for competitors: the PDF cohorts' competitor cells (docling, liteparse,
        # tika, markitdown, unstructured, pymupdf4llm) are REQUIRED, so a missing one fails
        # validate-artifacts and blocks the release even though we dropped the per-competitor
        # `needs.*.result` gates. Only the competitor cells on the heterogeneous family cohorts are
        # best-effort (optional in the contract): a framework that cannot read one member format of
        # a family fails its own job without blocking the baseline, and its partial results still
        # flow into the aggregate as non-gating data.
        if: >-
          ${{
            always() &&
            steps.validate-artifacts.outcome == 'success' &&
            steps.validate-aggregates.outcome == 'success' &&
            steps.prepare-release-assets.outcome == 'success' &&
            needs.setup.result == 'success' &&
            needs.bench-rust.result == 'success'
          }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          echo "=== Creating GitHub Release with benchmark results ==="

          SOURCE_SHA="${{ needs.setup.outputs.source-sha }}"
          SHORT_SHA="${SOURCE_SHA}"
          SHORT_SHA="${SHORT_SHA:0:7}"
          TAG="benchmark-run-${{ github.run_id }}"
          DATE=$(date -u +"%Y-%m-%d")

          gh release create "$TAG" \
            --prerelease \
            --target "${SOURCE_SHA}" \
            --title "Benchmark Results ${DATE} (${SHORT_SHA})" \
            --notes "Comparative benchmark results from workflow run [${{ github.run_id }}](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}).

          **Commit:** ${SOURCE_SHA}
          **Date:** ${DATE}" \
            release-assets/*.json
