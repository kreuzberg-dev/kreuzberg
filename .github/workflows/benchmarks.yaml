        run: scripts/benchmarks/run-benchmark.sh

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: benchmarks-mineru-${{ matrix.output_format }}-${{ matrix.mode }}-${{ matrix.cohort }}-${{ github.run_id }}
          path: benchmark-results/
          retention-days: 30

  bench-liteparse:
    name: liteparse (${{ matrix.output_format }}, ${{ matrix.mode }}, ${{ matrix.cohort }})
    needs: [setup, bench-rust]
    if: ${{ needs.setup.result == 'success' && !cancelled() }}
    runs-on: runner-medium-arm64
    timeout-minutes: 360
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        mode: [single-file, batch]
        output_format: [markdown, plaintext]
        cohort: [native-pdf-fast-b8, ocr-pdf-fast-b4]
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.setup.outputs.source-sha }}

          submodules: recursive
          lfs: true
      - name: Free disk space
        uses: xberg-io/actions/free-disk-space-linux@v1

      - name: Download benchmark harness binary
        uses: actions/download-artifact@v8
        with:
          name: benchmark-harness-binary
          path: target/release

      - name: Restore benchmark binary permissions
        run: scripts/benchmarks/restore-binary-permissions.sh

      - name: Pull test_documents LFS objects
        run: git -C test_documents lfs pull

      - name: Download reference corpus cache
        uses: actions/download-artifact@v8
        with:
          name: benchmark-corpus-cache
          path: ${{ runner.temp }}/benchmark-corpus-cache

      - name: Unpack reference corpus cache
        run: tar -C test_documents -xf "${RUNNER_TEMP}/benchmark-corpus-cache/corpus-cache.tar"

      - name: Install system dependencies (libheif + native libs for harness binary)
        uses: ./.github/actions/install-system-deps

      - name: Setup ONNX Runtime
        uses: ./.github/actions/setup-onnx-runtime
        with:
          ort-version: ${{ env.ORT_VERSION }}

      - name: Setup Rust toolchain
        uses: xberg-io/actions/setup-rust@v1
        with:
          cache-key-prefix: benchmarks-liteparse
          use-sccache: "true"

      - name: Install system tesseract (liteparse default feature)
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-eng libtesseract-dev libleptonica-dev

      - name: Install liteparse CLI (lit)
        run: |
          cargo install liteparse --version 2.9.0 --locked
          lit --version

      - name: Run benchmark
        env:
          FRAMEWORK: liteparse
          MODE: ${{ matrix.mode }}
          OUTPUT_FORMAT: ${{ matrix.output_format }}
          ITERATIONS: ${{ env.ITERATIONS }}
          TIMEOUT: ${{ github.event.inputs.timeout }}
          COHORT: tools/benchmark-harness/cohorts/${{ matrix.cohort }}.json
          BATCH_SIZE: ${{ matrix.mode == 'batch' && (matrix.cohort == 'native-pdf-fast-b8' && 8 || 4) || '' }}
          OCR_ENABLED: ${{ matrix.cohort == 'ocr-pdf-fast-b4' }}
        run: scripts/benchmarks/run-benchmark.sh

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: benchmarks-liteparse-${{ matrix.output_format }}-${{ matrix.mode }}-${{ matrix.cohort }}-${{ github.run_id }}
          path: benchmark-results/
          retention-days: 30

  aggregate-and-publish:
    name: Aggregate & Release Results
    needs:
      [
        setup,
        bench-rust,
        bench-docling,
        bench-markitdown,
        bench-unstructured,
        bench-tika,
        bench-pymupdf4llm,
        bench-mineru,
        bench-liteparse,
      ]
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write
    if: ${{ always() && !cancelled() && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch') }}
    steps:
      - name: Create GitHub App token (if credentials available)
        id: app-token
        continue-on-error: true
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          owner: xberg-dev

      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.setup.outputs.source-sha || github.sha }}
          submodules: recursive
          lfs: true

      - name: Setup Rust
        if: needs.setup.result == 'success'
        uses: xberg-io/actions/setup-rust@v1
        with:
          cache-key-prefix: aggregate

      - name: Install system dependencies (libheif + native libs for harness binary)
        if: needs.setup.result == 'success'
        uses: ./.github/actions/install-system-deps

      - name: Install BLAKE3 verifier
        if: needs.setup.result == 'success'
        run: |
          sudo apt-get update
          sudo apt-get install -y b3sum

      - name: Setup ONNX Runtime
        if: needs.setup.result == 'success'
        uses: ./.github/actions/setup-onnx-runtime
        with:
          ort-version: ${{ env.ORT_VERSION }}

      - name: Build xberg-cli (release, all features) for disk measurement
        if: needs.setup.result == 'success'
        run: cargo build --locked --release -p xberg-cli --features all

      - name: Download native benchmark artifacts
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          pattern: "benchmarks-*-native-pdf-fast-b8-${{ github.run_id }}"
          path: benchmark-artifacts/native/
          merge-multiple: false

      - name: Download OCR benchmark artifacts
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          pattern: "benchmarks-*-ocr-pdf-fast-b4-${{ github.run_id }}"
          path: benchmark-artifacts/ocr/
          merge-multiple: false

      - name: Validate native benchmark artifacts
        id: validate-native
        if: always()
        run: >-
          python3 scripts/ci/benchmarks/validate-benchmark-artifacts.py
          --cohort native
          --artifacts-dir benchmark-artifacts/native
          --cohort-manifest tools/benchmark-harness/cohorts/native-pdf-fast-b8.json
          --fixtures-root tools/benchmark-harness/fixtures
          --source-sha '${{ needs.setup.outputs.source-sha }}'
          --run-id '${{ github.run_id }}'
          --iterations '${{ env.ITERATIONS }}'

      - name: Validate OCR benchmark artifacts
        id: validate-ocr
        if: always()
        run: >-
          python3 scripts/ci/benchmarks/validate-benchmark-artifacts.py
          --cohort ocr
          --artifacts-dir benchmark-artifacts/ocr
          --cohort-manifest tools/benchmark-harness/cohorts/ocr-pdf-fast-b4.json
          --fixtures-root tools/benchmark-harness/fixtures
          --source-sha '${{ needs.setup.outputs.source-sha }}'
          --run-id '${{ github.run_id }}'
          --iterations '${{ env.ITERATIONS }}'

      - name: Consolidate native and OCR results
        if: ${{ always() && steps.validate-native.outcome == 'success' && steps.validate-ocr.outcome == 'success' }}
        run: |
          set -euo pipefail
          NATIVE_INPUTS=$(find benchmark-artifacts/native -mindepth 1 -maxdepth 1 -type d | sort | paste -sd, -)
          OCR_INPUTS=$(find benchmark-artifacts/ocr -mindepth 1 -maxdepth 1 -type d | sort | paste -sd, -)
          cargo run --locked --release --package benchmark-harness --bin benchmark-harness -- consolidate \
            --inputs "$NATIVE_INPUTS" \
            --output consolidated-output/native/
          cargo run --locked --release --package benchmark-harness --bin benchmark-harness -- consolidate \
            --inputs "$OCR_INPUTS" \
            --output consolidated-output/ocr/

      - name: Validate native and OCR aggregates
        id: validate-aggregates
        if: ${{ always() && steps.validate-native.outcome == 'success' && steps.validate-ocr.outcome == 'success' }}
        run: |
          set -euo pipefail
          python3 scripts/ci/benchmarks/validate-benchmark-artifacts.py \
            --cohort native \
            --aggregated-file consolidated-output/native/aggregated.json
          python3 scripts/ci/benchmarks/validate-benchmark-artifacts.py \
            --cohort ocr \
            --aggregated-file consolidated-output/ocr/aggregated.json

      - name: Prepare cohort release assets
        id: prepare-release-assets
        if: ${{ always() && steps.validate-aggregates.outcome == 'success' }}
        run: |
          set -euo pipefail
          mkdir -p release-assets
          cp consolidated-output/native/aggregated.json release-assets/benchmarks-native-aggregated.json
          cp consolidated-output/ocr/aggregated.json release-assets/benchmarks-ocr-aggregated.json
          SOURCE_SHA="${{ needs.setup.outputs.source-sha }}"
          UPDATED_AT="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          jq -n \
            --arg cohort "native-pdf-fast-b8-v1" \
            --arg cohort_hash "c10d1f78d3f9d61070c0d91e7bfe90a904b69c9d3261536eb1dcff2081c73f6b" \
            --arg commit "$SOURCE_SHA" \
            --arg run_id "${{ github.run_id }}" \
            --arg run_url "$RUN_URL" \
            --arg updated_at "$UPDATED_AT" \
            '{cohort: $cohort, cohort_manifest_blake3: $cohort_hash, expected_matrix_keys: 22, commit: $commit, run_id: $run_id, run_url: $run_url, updated_at: $updated_at}' \
            > release-assets/benchmarks-native-metadata.json
          jq -n \
            --arg cohort "ocr-pdf-fast-b4-v1" \
            --arg cohort_hash "c740a9480fd0ad4311a4905206345c58d7ef7a987682cc96644e2f0ffe616a13" \
            --arg commit "$SOURCE_SHA" \
            --arg run_id "${{ github.run_id }}" \
            --arg run_url "$RUN_URL" \
            --arg updated_at "$UPDATED_AT" \
            '{cohort: $cohort, cohort_manifest_blake3: $cohort_hash, expected_matrix_keys: 18, commit: $commit, run_id: $run_id, run_url: $run_url, updated_at: $updated_at}' \
            > release-assets/benchmarks-ocr-metadata.json
          jq -n \
            --arg commit "$SOURCE_SHA" \
            --arg run_id "${{ github.run_id }}" \
            --arg run_url "$RUN_URL" \
            --arg updated_at "$UPDATED_AT" \
            '{
              schema_version: 1,
              commit: $commit,
              run_id: $run_id,
              run_url: $run_url,
              updated_at: $updated_at,
              cohorts: {
                native: {aggregated: "benchmarks-native-aggregated.json", metadata: "benchmarks-native-metadata.json"},
                ocr: {aggregated: "benchmarks-ocr-aggregated.json", metadata: "benchmarks-ocr-metadata.json"}
              }
            }' > release-assets/benchmarks-index.json

      - name: Create GitHub Release with benchmark results
        if: >-
          ${{
            always() &&
            steps.validate-native.outcome == 'success' &&
            steps.validate-ocr.outcome == 'success' &&
            steps.validate-aggregates.outcome == 'success' &&
            steps.prepare-release-assets.outcome == 'success' &&
            needs.setup.result == 'success' &&
            needs.bench-rust.result == 'success' &&
            needs.bench-docling.result == 'success' &&
            needs.bench-markitdown.result == 'success' &&
            needs.bench-unstructured.result == 'success' &&
            needs.bench-tika.result == 'success' &&
            needs.bench-pymupdf4llm.result == 'success' &&
            needs.bench-mineru.result == 'success' &&
            needs.bench-liteparse.result == 'success'
          }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          echo "=== Creating GitHub Release with benchmark results ==="

          SOURCE_SHA="${{ needs.setup.outputs.source-sha }}"
          SHORT_SHA="${SOURCE_SHA}"
          SHORT_SHA="${SHORT_SHA:0:7}"
          TAG="benchmark-run-${{ github.run_id }}"
          DATE=$(date -u +"%Y-%m-%d")

          gh release create "$TAG" \
            --prerelease \
            --target "${SOURCE_SHA}" \
            --title "Benchmark Results ${DATE} (${SHORT_SHA})" \
            --notes "Comparative benchmark results from workflow run [${{ github.run_id }}](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}).

          **Commit:** ${SOURCE_SHA}
          **Date:** ${DATE}" \
            release-assets/benchmarks-native-aggregated.json \
            release-assets/benchmarks-native-metadata.json \
            release-assets/benchmarks-ocr-aggregated.json \
            release-assets/benchmarks-ocr-metadata.json \
            release-assets/benchmarks-index.json
