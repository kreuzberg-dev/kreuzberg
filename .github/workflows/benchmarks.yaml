  prefetch-mineru-models:
    name: Prefetch MinerU model weights
    # Intentionally NOT `needs: setup`: prefetching MinerU weights only needs the
    # repo (scripts + fixtures), not the built harness, so it runs concurrently
    # with the FFI/harness build from the first stage instead of waiting for it.
    # Checks out the same ref setup resolves (its later source-sha pin is only
    # needed by jobs that must match the benchmarked binary's exact revision).
    if: ${{ !cancelled() }}
    runs-on: runner-medium-arm64
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.branch || github.sha }}
          submodules: recursive
          lfs: true

      - name: Free disk space
        uses: xberg-io/actions/free-disk-space-linux@v1

      - name: Pull test_documents LFS objects
        run: git -C test_documents lfs pull

      - name: Setup Python
        uses: xberg-io/actions/setup-python-env@v1
        with:
          python-version: "3.11"
          cache-prefix: benchmark-mineru
          install-command: "uv sync --frozen --no-install-project --no-install-workspace --group dev --group bench-mineru"

      - name: Install system dependencies (libgl1 + libglib2.0-0 for mineru)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglib2.0-0 tesseract-ocr tesseract-ocr-eng

      - name: Configure Hugging Face cache
        run: |
          mkdir -p "$HOME/.cache/huggingface/hub"
          {
            echo "HF_HOME=$HOME/.cache/huggingface"
            echo "HF_HUB_CACHE=$HOME/.cache/huggingface/hub"
            echo "MINERU_MODEL_SOURCE=huggingface"
          } >> "$GITHUB_ENV"

      - name: Restore MinerU model cache
        id: mineru-model-cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/huggingface/hub
            ~/mineru.json
          key: mineru-models-3.4.4-cfg-v5-kor-jpn-${{ runner.os }}-${{ runner.arch }}

      - name: Warm MinerU model weights (native + OCR pipelines)
        if: steps.mineru-model-cache.outputs.cache-hit != 'true'
        env:
          UV_NO_SYNC: "1"
        run: |
          set -euo pipefail
          txt_fixture="test_documents/pdf/fake_memo.pdf"
          ocr_fixture="test_documents/pdf/non_searchable.pdf"
          echo "Warming MinerU pipeline weights (txt path) on ${txt_fixture}..."
          uv run --no-sync python tools/benchmark-harness/scripts/mineru_extract.py \
            --no-ocr --format=markdown sync "$txt_fixture" > /dev/null
          echo "Warming MinerU OCR weights (ocr path) on ${ocr_fixture}..."
          uv run --no-sync python tools/benchmark-harness/scripts/mineru_extract.py \
            --ocr --format=markdown sync "$ocr_fixture" > /dev/null
          echo "Warming MinerU Korean + Japanese PaddleOCR weights..."
          # The image OCR cohort forwards non-English languages; PaddleOCR downloads the
          # per-language model on first use, so warm korean/japan here (content is
          # irrelevant to which model is fetched) to keep it out of the timed run.
          uv run --no-sync python tools/benchmark-harness/scripts/mineru_extract.py \
            --ocr --ocr-lang=eng+kor --format=markdown sync "$ocr_fixture" > /dev/null
          uv run --no-sync python tools/benchmark-harness/scripts/mineru_extract.py \
            --ocr --ocr-lang=jpn_vert --format=markdown sync "$ocr_fixture" > /dev/null
          echo "MinerU model cache populated at $HF_HUB_CACHE"
          du -sh "$HF_HUB_CACHE" || true

      - name: Ensure MinerU config (mineru.json) present
        env:
          UV_NO_SYNC: "1"
        run: |
          set -euo pipefail
          # MinerU's persist_downloaded_model_config fetches a config template from
          # gcore.jsdelivr.net (bare requests.get, no timeout) on the first model
          # resolution whenever ~/mineru.json is absent -- ungoverned by HF_HUB_OFFLINE,
          # so on the egress-restricted bench runner it hangs the full timeout. Packaging
          # a valid ~/mineru.json makes get_existing_configured_model_root short-circuit
          # the download entirely. The warm step above writes it as a side effect; on a
          # cache hit it is restored by actions/cache. Regenerate online if still missing.
          if [ ! -f "$HOME/mineru.json" ]; then
            echo "mineru.json missing after warm/cache-restore; generating online..."
            uv run --no-sync python tools/benchmark-harness/scripts/mineru_extract.py \
              --no-ocr --format=markdown sync test_documents/pdf/fake_memo.pdf > /dev/null
          fi
          uv run --no-sync python - <<'PY'
          import json, os
          cfg = os.path.expanduser("~/mineru.json")
          data = json.load(open(cfg))
          models_dir = data.get("models-dir") or {}
          assert models_dir.get("pipeline"), f"mineru.json missing models-dir.pipeline: {data}"
          print(f"mineru.json OK: config_version={data.get('config_version')} models-dir={models_dir}")
          PY

      - name: Package MinerU model cache
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mineru-model-cache"
          tar -C "$HOME" -cf "$RUNNER_TEMP/mineru-model-cache/mineru-models.tar" \
            .cache/huggingface/hub mineru.json
          ls -lh "$RUNNER_TEMP/mineru-model-cache/mineru-models.tar"

      - name: Upload MinerU model cache
        uses: actions/upload-artifact@v7
        with:
          name: mineru-model-cache-${{ github.run_id }}
          path: ${{ runner.temp }}/mineru-model-cache/mineru-models.tar
          retention-days: 1
          if-no-files-found: error

  bench-mineru:
    name: mineru (${{ matrix.output_format }}, ${{ matrix.mode }}, ${{ matrix.cohort }})
    needs: [setup, bench-rust, prefetch-mineru-models]
    if: ${{ needs.setup.result == 'success' && needs.prefetch-mineru-models.result == 'success' && !cancelled() }}
    runs-on: runner-medium-arm64
    timeout-minutes: 360
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        mode: [single-file]
        output_format: [markdown, plaintext]
        # MinerU handles PDF (native + OCR) and document images.
        cohort: [native-pdf-fast-b8, ocr-pdf-fast-b4, ocr-images-fast]
        exclude:
          - output_format: plaintext
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.setup.outputs.source-sha }}

          submodules: recursive
          lfs: true
      - name: Free disk space
        uses: xberg-io/actions/free-disk-space-linux@v1

      - name: Download benchmark harness binary
        uses: actions/download-artifact@v8
        with:
          name: benchmark-harness-binary
          path: target/release

      - name: Restore benchmark binary permissions
        run: scripts/benchmarks/restore-binary-permissions.sh

      - name: Pull test_documents LFS objects
        run: git -C test_documents lfs pull

      - name: Download reference corpus cache
        uses: actions/download-artifact@v8
        with:
          name: benchmark-corpus-cache
          path: ${{ runner.temp }}/benchmark-corpus-cache

      - name: Unpack reference corpus cache
        run: tar -C test_documents -xf "${RUNNER_TEMP}/benchmark-corpus-cache/corpus-cache.tar"

      - name: Install system dependencies (libheif + native libs for harness binary)
        uses: ./.github/actions/install-system-deps

      - name: Setup ONNX Runtime
        uses: ./.github/actions/setup-onnx-runtime
        with:
          ort-version: ${{ env.ORT_VERSION }}

      - name: Setup Python
        uses: xberg-io/actions/setup-python-env@v1
        with:
          python-version: "3.11"
          cache-prefix: benchmark-mineru
          install-command: "uv sync --frozen --no-install-project --no-install-workspace --group dev --group bench-mineru"

      - name: Install system dependencies (libgl1 + libglib2.0-0 for mineru)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglib2.0-0 tesseract-ocr tesseract-ocr-eng

      - name: Configure Hugging Face cache
        run: |
          mkdir -p "$HOME/.cache/huggingface/hub"
          {
            echo "HF_HOME=$HOME/.cache/huggingface"
            echo "HF_HUB_CACHE=$HOME/.cache/huggingface/hub"
            echo "MINERU_MODEL_SOURCE=huggingface"
            echo "HF_HUB_OFFLINE=1"
            echo "TRANSFORMERS_OFFLINE=1"
          } >> "$GITHUB_ENV"

      - name: Download MinerU model cache
        uses: actions/download-artifact@v8
        with:
          name: mineru-model-cache-${{ github.run_id }}
          path: ${{ runner.temp }}/mineru-model-cache

      - name: Unpack MinerU model cache
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.cache/huggingface"
          tar -C "$HOME" -xf "$RUNNER_TEMP/mineru-model-cache/mineru-models.tar"
          test -f "$HOME/mineru.json" || { echo "mineru.json not restored from cache artifact"; exit 1; }
          du -sh "$HOME/.cache/huggingface/hub" || true

      - name: Log MinerU offline env and restored cache state
        if: always()
        run: |
          set -uo pipefail
          echo "=== MinerU offline env ==="
          echo "HF_HOME=${HF_HOME:-<unset>}"
          echo "HF_HUB_CACHE=${HF_HUB_CACHE:-<unset>}"
          echo "HF_HUB_OFFLINE=${HF_HUB_OFFLINE:-<unset>}"
          echo "TRANSFORMERS_OFFLINE=${TRANSFORMERS_OFFLINE:-<unset>}"
          echo "MINERU_MODEL_SOURCE=${MINERU_MODEL_SOURCE:-<unset>}"
          echo "=== ~/mineru.json (drives the offline model short-circuit; absence => gcore fetch hang) ==="
          cat "$HOME/mineru.json" || echo "!! mineru.json absent"
          echo "=== HF hub cache contents ==="
          ls -1 "$HOME/.cache/huggingface/hub" 2>/dev/null || echo "!! hub dir absent"
          du -sh "$HOME/.cache/huggingface/hub" 2>/dev/null || true

      - name: Run benchmark
        env:
          FRAMEWORK: mineru
          MODE: ${{ matrix.mode }}
          OUTPUT_FORMAT: ${{ matrix.output_format }}
          ITERATIONS: ${{ env.ITERATIONS }}
          TIMEOUT: ${{ github.event.inputs.timeout }}
          COHORT: tools/benchmark-harness/cohorts/${{ matrix.cohort }}.json
          UV_NO_SYNC: "1"
          # Belt-and-suspenders: cap any stray unbounded network call (offline) so it
          # fails fast and loud instead of hanging the full timeout. Bench-only, so the
          # prefetch job's large online model downloads are unaffected.
          MINERU_NET_TIMEOUT: "60"
        run: scripts/benchmarks/run-benchmark.sh

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: benchmarks-mineru-${{ matrix.output_format }}-${{ matrix.mode }}-${{ matrix.cohort }}-${{ github.run_id }}
          path: benchmark-results/
          retention-days: 30

