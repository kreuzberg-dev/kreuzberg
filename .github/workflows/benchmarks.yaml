name: Benchmarks

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Optional branch or commit (defaults to the dispatched revision)"
        required: false
        default: ""
        type: string
      timeout:
        description: "Timeout per document in seconds"
        required: false
        default: "900"
        type: string

env:
  ITERATIONS: "3"
  TIKA_VERSION: "3.3.1"
  ORT_VERSION: "1.24.2"
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  RUST_BACKTRACE: short
  RUST_MIN_STACK: 16777216
  RUSTFLAGS: "-C strip=symbols"
  MEASURE_QUALITY: "true"
  OCR_ENABLED: "true"
  RUN_OCR_BENCHMARKS: "true"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  GROUND_TRUTH_DIR: "test_documents/ground_truth"

concurrency:
  group: benchmarks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  setup:
    name: Build harness + native libs
    runs-on: runner-medium-arm64
    timeout-minutes: 360
    permissions:
      contents: read
      id-token: write
    outputs:
      artifact-name: benchmarks-target
      source-sha: ${{ steps.source-revision.outputs.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.branch || github.sha }}

          submodules: recursive
          lfs: true
      - name: Pin benchmark source revision
        id: source-revision
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Free disk space
        uses: xberg-io/actions/free-disk-space-linux@v1

      - name: Ensure benchmark harness exists
        run: scripts/benchmarks/ensure-benchmark-harness-exists.sh

      - name: Install system dependencies
        uses: ./.github/actions/install-system-deps

      - name: Setup Rust
        uses: xberg-io/actions/setup-rust@v1
        with:
          cache-key-prefix: benchmarks-setup
          use-sccache: "false"
          disable-cache: "false"
          report-stats: "true"

      - name: Setup ONNX Runtime
        uses: ./.github/actions/setup-onnx-runtime
        with:
          ort-version: ${{ env.ORT_VERSION }}

      - name: Setup Layout Models
        uses: ./.github/actions/setup-layout-models

      - name: Install Task
        uses: xberg-io/actions/install-task@v1

      - name: Validate benchmark scripts
        run: task benchmark:validate:scripts

      - name: Cache benchmark harness
        uses: ./.github/actions/cache-benchmark-harness
        with:
          build-profile: release

      - name: Build xberg-cli (release, all features + Sceptre tract diagnostic)
        run: cargo build --locked --release -p xberg-cli --features all,xberg/sceptre-ocr-tract

      - name: Pull test_documents LFS objects
        run: git -C test_documents lfs pull

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_BENCHMARK_SA }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Install zstd (corpus cache decompression)
        run: sudo apt-get install -y zstd

      - name: Restore reference corpus cache
        env:
          GCP_BENCHMARK_BUCKET: ${{ secrets.GCP_BENCHMARK_BUCKET }}
        run: scripts/benchmarks/restore-corpus-cache.sh

      - name: Validate ground truth
        run: >-
          cargo run --locked --release -p benchmark-harness -- validate-gt
          --fixtures tools/benchmark-harness/fixtures --strict

      - name: Validate benchmark cohorts
        run: cargo test --locked --release -p benchmark-harness 'cohort::tests::'

      - name: Validate benchmark harness contracts
        run: >-
          cargo test --locked --release -p benchmark-harness
          --test validate_artifacts --test lossless_aggregation
          --test fixture_validation --test aggregate_schema

      - name: Validate workflow matrix against harness contracts
        run: scripts/ci/benchmarks/validate-workflow-matrix.py

      - name: Package reference corpus cache
        run: tar -C test_documents -cf corpus-cache.tar .corpus-cache/pdf .corpus-cache/ground_truth

      - name: Upload reference corpus cache
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-corpus-cache
          path: corpus-cache.tar
          retention-days: 7

      - name: Log disk space before artifact upload
        run: scripts/ci/validate/show-disk-space.sh "Disk space before artifact upload"

      - name: Upload build artifacts (harness binary + xberg-cli)
        uses: actions/upload-artifact@v7
        with:
          name: benchmarks-target
          path: |
            target/release/benchmark-harness
            target/release/xberg
          retention-days: 7
          if-no-files-found: warn

      - name: Upload benchmark harness binary (for third-party jobs)
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-harness-binary
          path: |
            target/release/benchmark-harness
          retention-days: 7

      - name: Log disk space after artifact upload
        run: scripts/ci/validate/show-disk-space.sh "Disk space after artifact upload"

  bench-rust:
    name: bench-rust (${{ matrix.pipeline }}, ${{ matrix.output_format }}, ${{ matrix.mode }}, ${{ matrix.cohort }})
    needs: setup
    runs-on: >-
      ${{ (matrix.pipeline == 'layout'
        || contains(matrix.pipeline, 'paddle')
        || contains(matrix.pipeline, 'sceptre'))
        && 'runner-large-arm64' || 'runner-medium-arm64' }}
    timeout-minutes: 360
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        pipeline:
          - baseline
          - layout
          - baseline-paddle
          - layout-paddle
          - sceptre-ort
          - sceptre-ort-layout
          - sceptre-ort-autorotate
        output_format: [markdown, plaintext]
        mode: [single-file, batch]
        cohort:
          - native-pdf-fast-b8
          - ocr-pdf-fast-b4
          - native-office-fast
          - native-markup-fast
          - native-ebook-fast
          - native-email-fast
          - native-data-fast
          - ocr-images-fast
        # The layout pipeline only benefits rendered-page formats (PDF, images); for the other
        # families a layout run would merely duplicate baseline, so drop those cells.
        # The PaddleOCR-engine variants (baseline-paddle, layout-paddle) force OCR, so they run ONLY
        # on the OCR cohorts (ocr-pdf-fast-b4, ocr-images-fast); drop them from every non-OCR cohort.
        # NOTE: keep this block a clean list of `- {...}` entries — the validate-workflow-matrix.py
        # exclude parser stops at the first non-entry line, so do not intersperse comments here.
        exclude:
          - { pipeline: layout, cohort: native-office-fast }
          - { pipeline: layout, cohort: native-markup-fast }
          - { pipeline: layout, cohort: native-ebook-fast }
          - { pipeline: layout, cohort: native-email-fast }
          - { pipeline: layout, cohort: native-data-fast }
          - { pipeline: baseline-paddle, cohort: native-pdf-fast-b8 }
          - { pipeline: baseline-paddle, cohort: native-office-fast }
          - { pipeline: baseline-paddle, cohort: native-markup-fast }
          - { pipeline: baseline-paddle, cohort: native-ebook-fast }
          - { pipeline: baseline-paddle, cohort: native-email-fast }
          - { pipeline: baseline-paddle, cohort: native-data-fast }
          - { pipeline: layout-paddle, cohort: native-pdf-fast-b8 }
          - { pipeline: layout-paddle, cohort: native-office-fast }
          - { pipeline: layout-paddle, cohort: native-markup-fast }
          - { pipeline: layout-paddle, cohort: native-ebook-fast }
          - { pipeline: layout-paddle, cohort: native-email-fast }
          - { pipeline: layout-paddle, cohort: native-data-fast }
          - { pipeline: sceptre-ort, cohort: native-pdf-fast-b8 }
          - { pipeline: sceptre-ort, cohort: native-office-fast }
          - { pipeline: sceptre-ort, cohort: native-markup-fast }
          - { pipeline: sceptre-ort, cohort: native-ebook-fast }
          - { pipeline: sceptre-ort, cohort: native-email-fast }
          - { pipeline: sceptre-ort, cohort: native-data-fast }
          - { pipeline: sceptre-ort-layout, cohort: native-pdf-fast-b8 }
          - { pipeline: sceptre-ort-layout, cohort: native-office-fast }
          - { pipeline: sceptre-ort-layout, cohort: native-markup-fast }
          - { pipeline: sceptre-ort-layout, cohort: native-ebook-fast }
          - { pipeline: sceptre-ort-layout, cohort: native-email-fast }
          - { pipeline: sceptre-ort-layout, cohort: native-data-fast }
          - { pipeline: sceptre-ort-autorotate, cohort: native-pdf-fast-b8 }
          - { pipeline: sceptre-ort-autorotate, cohort: native-office-fast }
          - { pipeline: sceptre-ort-autorotate, cohort: native-markup-fast }
          - { pipeline: sceptre-ort-autorotate, cohort: native-ebook-fast }
          - { pipeline: sceptre-ort-autorotate, cohort: native-email-fast }
          - { pipeline: sceptre-ort-autorotate, cohort: native-data-fast }
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.setup.outputs.source-sha }}

          submodules: recursive
          lfs: true
      - name: Free disk space
        uses: xberg-io/actions/free-disk-space-linux@v1

      - name: Install system dependencies
        uses: ./.github/actions/install-system-deps

      - name: Setup Rust toolchain
        uses: xberg-io/actions/setup-rust@v1
        with:
          cache-key-prefix: benchmarks-rust-${{ matrix.pipeline }}
          use-sccache: "true"
          report-stats: "true"

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.setup.outputs.artifact-name }}
          path: target/release

      - name: Restore benchmark binary permissions
        run: scripts/benchmarks/restore-binary-permissions.sh

      - name: Pull test_documents LFS objects
        run: git -C test_documents lfs pull

      - name: Download reference corpus cache
        uses: actions/download-artifact@v8
        with:
          name: benchmark-corpus-cache
          path: ${{ runner.temp }}/benchmark-corpus-cache

      - name: Unpack reference corpus cache
        run: tar -C test_documents -xf "${RUNNER_TEMP}/benchmark-corpus-cache/corpus-cache.tar"

      - name: Setup ONNX Runtime
        uses: ./.github/actions/setup-onnx-runtime
        with:
          ort-version: ${{ env.ORT_VERSION }}

      - name: Setup Layout Models
        if: contains(matrix.pipeline, 'layout')
        uses: ./.github/actions/setup-layout-models

      # The bench-rust runner ships only `python3` (no `python` alias, and its system
      # python3 is externally-managed without pip), so the PaddleOCR model action's
      # `python -m pip install huggingface_hub` fails with exit 127. Provision a managed
      # Python with pip (matching the competitor jobs) before the model download.
      - name: Setup Python (PaddleOCR model download)
        if: contains(matrix.pipeline, 'paddle')
        uses: xberg-io/actions/setup-python-env@v1
        with:
          python-version: "3.11"
          cache-prefix: benchmark-paddle-hf
          install-command: "python -m pip install --disable-pip-version-check 'huggingface_hub>=0.34,<2'"

      - name: Setup PaddleOCR Models
        if: contains(matrix.pipeline, 'paddle')
        uses: ./.github/actions/setup-paddle-ocr-models

      - name: Pre-warm Sceptre ORT models
        if: contains(matrix.pipeline, 'sceptre-ort')
        env:
          PIPELINE: ${{ matrix.pipeline }}
        run: |
          set -euo pipefail
          for language in eng deu jpn; do
            args=(
              extract test_documents/images/test_hello_world.png
              --ocr true
              --force-ocr true
              --ocr-backend sceptre
              --ocr-backend-options '{"model":{"backend":"ort"}}'
              --ocr-language "$language"
              --no-cache true
              --format json
            )
            if [[ "$PIPELINE" == "sceptre-ort-autorotate" ]]; then
              args+=(--ocr-auto-rotate true)
            fi
            ./target/release/xberg "${args[@]}" >/dev/null
          done

      - name: Run benchmark
        env:
          FRAMEWORK: xberg-${{ matrix.output_format }}-${{ matrix.pipeline }}
          MODE: ${{ matrix.mode }}
          OUTPUT_FORMAT: ${{ matrix.output_format }}
          ITERATIONS: ${{ env.ITERATIONS }}
          TIMEOUT: ${{ github.event.inputs.timeout }}
          COHORT: tools/benchmark-harness/cohorts/${{ matrix.cohort }}.json
        run: scripts/benchmarks/run-benchmark.sh

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: benchmarks-rust-${{ matrix.pipeline }}-${{ matrix.output_format }}-${{ matrix.mode }}-${{ matrix.cohort }}-${{ github.run_id }}
          path: benchmark-results/
          retention-days: 30

  sceptre-tract-diagnostic:
    name: sceptre-tract diagnostic (${{ matrix.mode }})
    needs: setup
    runs-on: runner-large-arm64
    timeout-minutes: 360
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        mode: [single-file, batch]
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.setup.outputs.source-sha }}
          submodules: recursive
          lfs: true

      - name: Free disk space
        uses: xberg-io/actions/free-disk-space-linux@v1

      - name: Install system dependencies
        uses: ./.github/actions/install-system-deps

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.setup.outputs.artifact-name }}
          path: target/release

      - name: Restore benchmark binary permissions
        run: scripts/benchmarks/restore-binary-permissions.sh

      - name: Pull test_documents LFS objects
        run: git -C test_documents lfs pull

      - name: Setup ONNX Runtime
        uses: ./.github/actions/setup-onnx-runtime
        with:
          ort-version: ${{ env.ORT_VERSION }}

      - name: Pre-warm Sceptre tract models
        run: >-
          ./target/release/xberg extract test_documents/images/test_hello_world.png
          --ocr true --force-ocr true --ocr-backend sceptre
          --ocr-backend-options '{"model":{"backend":"tract"}}'
          --ocr-language eng --no-cache true --format json >/dev/null

      - name: Run bounded diagnostic benchmark
        env:
          FRAMEWORK: xberg-markdown-sceptre-tract
          MODE: ${{ matrix.mode }}
          OUTPUT_FORMAT: markdown
          ITERATIONS: ${{ env.ITERATIONS }}
          TIMEOUT: ${{ github.event.inputs.timeout }}
          COHORT: tools/benchmark-harness/cohorts/ocr-images-structured.json
        run: scripts/benchmarks/run-benchmark.sh

      - name: Upload diagnostic artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: diagnostic-sceptre-tract-markdown-${{ matrix.mode }}-ocr-images-structured-${{ github.run_id }}
          path: benchmark-results/
          retention-days: 30

  bench-docling:
    name: docling (${{ matrix.output_format }}, ${{ matrix.mode }}, ${{ matrix.cohort }})
    needs: [setup, bench-rust]
    if: ${{ needs.setup.result == 'success' && !cancelled() }}
    runs-on: runner-medium-arm64
    timeout-minutes: 360
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        mode: [single-file, batch]
        output_format: [markdown, plaintext]
        # Docling supports the multi-format families it has native readers for (office,
        # markup, data) plus images; ebook/email are xberg-only. Cells for formats Docling
        # cannot read are best-effort in the release contract, so partial coverage is fine.
        cohort:
          - native-pdf-fast-b8
          - ocr-pdf-fast-b4
          - native-office-fast
          - native-markup-fast
          - native-data-fast
          - ocr-images-fast
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.setup.outputs.source-sha }}

          submodules: recursive
          lfs: true
      - name: Free disk space
        uses: xberg-io/actions/free-disk-space-linux@v1

      - name: Download benchmark harness binary
        uses: actions/download-artifact@v8
        with:
          name: benchmark-harness-binary
          path: target/release

      - name: Restore benchmark binary permissions
        run: scripts/benchmarks/restore-binary-permissions.sh

      - name: Pull test_documents LFS objects
        run: git -C test_documents lfs pull

      - name: Download reference corpus cache
        uses: actions/download-artifact@v8
        with:
          name: benchmark-corpus-cache
          path: ${{ runner.temp }}/benchmark-corpus-cache

      - name: Unpack reference corpus cache
        run: tar -C test_documents -xf "${RUNNER_TEMP}/benchmark-corpus-cache/corpus-cache.tar"

      - name: Install system dependencies (libheif + native libs for harness binary)
        uses: ./.github/actions/install-system-deps

      - name: Setup ONNX Runtime
        uses: ./.github/actions/setup-onnx-runtime
        with:
          ort-version: ${{ env.ORT_VERSION }}

      - name: Setup Python
        uses: xberg-io/actions/setup-python-env@v1
        with:
          python-version: "3.11"
          cache-prefix: benchmark-docling
          install-command: "uv sync --frozen --no-install-project --no-install-workspace --group dev --group bench-docling"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglib2.0-0 tesseract-ocr tesseract-ocr-eng

      - name: Restore EasyOCR model cache (docling OCR)
        id: easyocr-cache
        uses: actions/cache@v5
        with:
          path: ~/.EasyOCR
          key: docling-easyocr-en-ko-ja-v1-${{ runner.os }}-${{ runner.arch }}

      - name: Prefetch EasyOCR language models (en, ko, ja)
        if: steps.easyocr-cache.outputs.cache-hit != 'true'
        env:
          UV_NO_SYNC: "1"
        run: |
          set -euo pipefail
          # Docling's default OCR engine is EasyOCR; the image OCR cohort forwards
          # Korean/Japanese, so prefetch those recognition models (plus the shared
          # detection model) into ~/.EasyOCR to keep the download out of the timed run.
          uv run --no-sync python - <<'PY'
          import easyocr

          for langs in (["en", "ko"], ["ja", "en"]):
              easyocr.Reader(langs, gpu=False, verbose=False)
          PY

      - name: Run benchmark
        env:
          FRAMEWORK: docling
          MODE: ${{ matrix.mode }}
          OUTPUT_FORMAT: ${{ matrix.output_format }}
          ITERATIONS: ${{ env.ITERATIONS }}
          TIMEOUT: ${{ github.event.inputs.timeout }}
          COHORT: tools/benchmark-harness/cohorts/${{ matrix.cohort }}.json
          UV_NO_SYNC: "1"
        run: scripts/benchmarks/run-benchmark.sh

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: benchmarks-docling-${{ matrix.output_format }}-${{ matrix.mode }}-${{ matrix.cohort }}-${{ github.run_id }}
          path: benchmark-results/
          retention-days: 30

  bench-markitdown:
    name: markitdown (${{ matrix.output_format }}, ${{ matrix.mode }}, ${{ matrix.cohort }})
    needs: [setup, bench-rust]
    if: ${{ needs.setup.result == 'success' && !cancelled() }}
    runs-on: runner-medium-arm64
    timeout-minutes: 360
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        mode: [single-file]
        output_format: [markdown, plaintext]
        # MarkItDown emits markdown; run it over PDF plus the office/markup/data families it supports.
        cohort: [native-pdf-fast-b8, native-office-fast, native-markup-fast, native-data-fast]
        exclude:
          - output_format: plaintext
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.setup.outputs.source-sha }}

          submodules: recursive
          lfs: true
      - name: Free disk space
        uses: xberg-io/actions/free-disk-space-linux@v1

      - name: Download benchmark harness binary
        uses: actions/download-artifact@v8
        with:
          name: benchmark-harness-binary
          path: target/release

      - name: Restore benchmark binary permissions
        run: scripts/benchmarks/restore-binary-permissions.sh

      - name: Pull test_documents LFS objects
        run: git -C test_documents lfs pull

      - name: Download reference corpus cache
        uses: actions/download-artifact@v8
        with:
          name: benchmark-corpus-cache
          path: ${{ runner.temp }}/benchmark-corpus-cache

      - name: Unpack reference corpus cache
        run: tar -C test_documents -xf "${RUNNER_TEMP}/benchmark-corpus-cache/corpus-cache.tar"

      - name: Install system dependencies (libheif + native libs for harness binary)
        uses: ./.github/actions/install-system-deps

      - name: Setup ONNX Runtime
        uses: ./.github/actions/setup-onnx-runtime
        with:
          ort-version: ${{ env.ORT_VERSION }}

      - name: Setup Python
        uses: xberg-io/actions/setup-python-env@v1
        with:
          python-version: "3.11"
          cache-prefix: benchmark-markitdown
          install-command: "uv sync --frozen --no-install-project --no-install-workspace --group dev --group bench-markitdown --prerelease=allow"

      - name: Run benchmark
        env:
          FRAMEWORK: markitdown
          MODE: ${{ matrix.mode }}
          OUTPUT_FORMAT: ${{ matrix.output_format }}
          ITERATIONS: ${{ env.ITERATIONS }}
          TIMEOUT: ${{ github.event.inputs.timeout }}
          COHORT: tools/benchmark-harness/cohorts/${{ matrix.cohort }}.json
          UV_NO_SYNC: "1"
        run: scripts/benchmarks/run-benchmark.sh

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: benchmarks-markitdown-${{ matrix.output_format }}-${{ matrix.mode }}-${{ matrix.cohort }}-${{ github.run_id }}
          path: benchmark-results/
          retention-days: 30

  bench-unstructured:
    name: unstructured (${{ matrix.output_format }}, ${{ matrix.mode }}, ${{ matrix.cohort }})
    needs: [setup, bench-rust]
    if: ${{ needs.setup.result == 'success' && !cancelled() }}
    runs-on: runner-medium-arm64
    timeout-minutes: 360
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        mode: [single-file]
        output_format: [plaintext]
        # Unstructured emits plaintext; run it over PDF plus the office/markup/email/data families.
        cohort: [
          native-pdf-fast-b8,
          native-office-fast,
          native-markup-fast,
          native-email-fast,
          native-data-fast,
          ocr-pdf-fast-b4,
          ocr-images-fast,
        ]
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.setup.outputs.source-sha }}

          submodules: recursive
          lfs: true
      - name: Free disk space
        uses: xberg-io/actions/free-disk-space-linux@v1

      - name: Download benchmark harness binary
        uses: actions/download-artifact@v8
        with:
          name: benchmark-harness-binary
          path: target/release

      - name: Restore benchmark binary permissions
        run: scripts/benchmarks/restore-binary-permissions.sh

      - name: Pull test_documents LFS objects
        run: git -C test_documents lfs pull

      - name: Download reference corpus cache
        uses: actions/download-artifact@v8
        with:
          name: benchmark-corpus-cache
          path: ${{ runner.temp }}/benchmark-corpus-cache

      - name: Unpack reference corpus cache
        run: tar -C test_documents -xf "${RUNNER_TEMP}/benchmark-corpus-cache/corpus-cache.tar"

      - name: Install system dependencies (libheif + native libs for harness binary)
        uses: ./.github/actions/install-system-deps

      - name: Setup ONNX Runtime
        uses: ./.github/actions/setup-onnx-runtime
        with:
          ort-version: ${{ env.ORT_VERSION }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-eng libmagic-dev poppler-utils libreoffice pandoc

      - name: Setup Python
        uses: xberg-io/actions/setup-python-env@v1
        with:
          python-version: "3.11"
          cache-prefix: benchmark-unstructured
          install-command: "uv sync --frozen --no-install-project --no-install-workspace --group dev --group bench-unstructured"

      - name: Run benchmark
        env:
          FRAMEWORK: unstructured
          MODE: ${{ matrix.mode }}
          OUTPUT_FORMAT: ${{ matrix.output_format }}
          ITERATIONS: ${{ env.ITERATIONS }}
          TIMEOUT: ${{ github.event.inputs.timeout }}
          COHORT: tools/benchmark-harness/cohorts/${{ matrix.cohort }}.json
          UV_NO_SYNC: "1"
        run: scripts/benchmarks/run-benchmark.sh

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: benchmarks-unstructured-${{ matrix.output_format }}-${{ matrix.mode }}-${{ matrix.cohort }}-${{ github.run_id }}
          path: benchmark-results/
          retention-days: 30

  bench-tika:
    name: tika (${{ matrix.output_format }}, ${{ matrix.mode }}, ${{ matrix.cohort }})
    needs: [setup, bench-rust]
    if: ${{ needs.setup.result == 'success' && !cancelled() }}
    runs-on: runner-medium-arm64
    timeout-minutes: 360
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        mode: [single-file]
        output_format: [markdown, plaintext]
        # Tika is the broadest competitor: PDF plus office/markup/ebook/email/data families.
        cohort:
          - native-pdf-fast-b8
          - native-office-fast
          - native-markup-fast
          - native-ebook-fast
          - native-email-fast
          - native-data-fast
          - ocr-pdf-fast-b4
          - ocr-images-fast
        exclude:
          - output_format: markdown
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.setup.outputs.source-sha }}

          submodules: recursive
          lfs: true
      - name: Free disk space
        uses: xberg-io/actions/free-disk-space-linux@v1

      - name: Download benchmark harness binary
        uses: actions/download-artifact@v8
        with:
          name: benchmark-harness-binary
          path: target/release

      - name: Restore benchmark binary permissions
        run: scripts/benchmarks/restore-binary-permissions.sh

      - name: Pull test_documents LFS objects
        run: git -C test_documents lfs pull

      - name: Download reference corpus cache
        uses: actions/download-artifact@v8
        with:
          name: benchmark-corpus-cache
          path: ${{ runner.temp }}/benchmark-corpus-cache

      - name: Unpack reference corpus cache
        run: tar -C test_documents -xf "${RUNNER_TEMP}/benchmark-corpus-cache/corpus-cache.tar"

      - name: Install system dependencies (libheif + native libs for harness binary)
        uses: ./.github/actions/install-system-deps

      - name: Setup ONNX Runtime
        uses: ./.github/actions/setup-onnx-runtime
        with:
          ort-version: ${{ env.ORT_VERSION }}

      - name: Setup Java
        uses: actions/setup-java@v5
        id: setup-java
        with:
          distribution: "temurin"
          java-version: "25"

      - name: Download Apache Tika
        run: |
          mkdir -p tools/benchmark-harness/libs
          curl -fsSL --retry 5 --retry-delay 5 -o "tools/benchmark-harness/libs/tika-app-${{ env.TIKA_VERSION }}.jar" \
            "https://repo1.maven.org/maven2/org/apache/tika/tika-app/${{ env.TIKA_VERSION }}/tika-app-${{ env.TIKA_VERSION }}.jar"

      - name: Run benchmark
        env:
          FRAMEWORK: tika
          MODE: ${{ matrix.mode }}
          OUTPUT_FORMAT: ${{ matrix.output_format }}
          ITERATIONS: ${{ env.ITERATIONS }}
          TIMEOUT: ${{ github.event.inputs.timeout }}
          COHORT: tools/benchmark-harness/cohorts/${{ matrix.cohort }}.json
        run: scripts/benchmarks/run-benchmark.sh

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: benchmarks-tika-${{ matrix.output_format }}-${{ matrix.mode }}-${{ matrix.cohort }}-${{ github.run_id }}
          path: benchmark-results/
          retention-days: 30

