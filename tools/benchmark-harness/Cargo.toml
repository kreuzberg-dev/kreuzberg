[package]
name = "benchmark-harness"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage = "https://xberg.io"
default-run = "benchmark-harness"
publish = false

[lib]
name = "benchmark_harness"
path = "src/lib.rs"

[[bin]]
name = "benchmark-harness"
path = "src/main.rs"

[[bin]]
name = "xberg-batch-diagnostic"
path = "src/xberg_batch_diagnostic_main.rs"

[[bin]]
name = "xberg-runtime-responsiveness"
path = "src/xberg_runtime_responsiveness_main.rs"

[features]
default = []
profiling = ["inferno", "pprof"]
memory-profiling = ["tikv-jemallocator", "tikv-jemalloc-ctl"]
glm-ocr-bench = ["xberg/candle-glm-ocr"]
candle-deepseek-ocr-bench = ["xberg/candle-deepseek-ocr"]
candle-paddleocr-vl-15-bench = ["xberg/candle-paddleocr-vl"]
# Passthrough for in-process `xberg::extract` call sites in this crate (e.g. `comparison.rs`'s
# `build_extraction_config`) that build an `ExtractionConfig` with `PdfConfig::backend =
# PdfBackend::Pdfium` directly. NOT default-on: `pdf-pdfium` links `pdfium-render`, which
# dlopen()s a `libpdfium` runtime library that is not present on a plain dev machine, so a
# default-on feature would break `cargo build -p benchmark-harness` there. Selecting
# `PdfBackend::Pdfium` without this feature already fails loudly with an actionable `XbergError` (see
# `crates/xberg/src/extractors/pdf/mod.rs::extract_core_pdfium`) rather than panicking or
# silently falling back to `native` -- that enforcement lives in xberg's core crate, not here.
#
# The `xberg-{format}-{pipeline}[-pdfium]` frameworks driven by `run --pdf-backends pdfium`
# (see `adapters::xberg::create_xberg_adapter`) do NOT need this feature: they shell out to a
# separately built `xberg` CLI binary via `SubprocessAdapter`, so it is that binary's own
# `pdf-pdfium` feature and runtime `libpdfium` availability that matter, not this crate's.
pdfium-bench = ["xberg/pdf-pdfium"]

[dependencies]

ahash = { workspace = true }

async-trait = { workspace = true }
blake3 = { workspace = true }
chrono = { workspace = true }

clap = { workspace = true }
dirs = "7"
futures = { workspace = true }

inferno = { version = "0.12.8", default-features = false, features = ["nameattr"], optional = true }
jsonschema = "0.54"
libc = { workspace = true }
num_cpus = { workspace = true }
pprof = { version = "0.15", optional = true }
pulldown-cmark = "0.13"
rayon = { workspace = true }
regex = "1"
serde = { workspace = true }
serde_ignored = "0.1"
serde_json = { workspace = true }
shellexpand = "3"

sysinfo = "0.38"
tempfile = { workspace = true }
thiserror = { workspace = true }
tikv-jemalloc-ctl = { version = "0.7", features = ["stats"], optional = true }
tikv-jemallocator = { version = "0.7", optional = true }
tokio = { workspace = true, features = ["full"] }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
unicode-normalization = "0.1.25"
url = { workspace = true }
which = "8"
xberg = { path = "../../crates/xberg", features = ["full"] }

[dev-dependencies]
dotenvy = "0.15"
