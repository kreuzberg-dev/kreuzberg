features = ["macos-intel-target", "simd-utf8"]
default_features = false

# The swift-bridge backend injects the xberg-ffi dependency itself. Without these
# overrides it emits a single unconditional `[dependencies]` entry carrying
# `ffi_features` (`full-no-heic`), which pulls `sceptre-ocr` -> `sceptre-ocr-ort`.
# Cargo unifies features across every edge to the same resolved package, so that
# would activate the desktop/server-only ORT path even on targets where the core
# `xberg` dep above only asks for `android-target`, tripping the `compile_error!`
# guards in crates/xberg/src/lib.rs and breaking the iOS and Android builds.
# These entries make alef gate the default entry on `cfg(not(any(ios, android)))`
# and emit the reduced feature set for mobile -- replacing the post-regen hand
# patch that `alef all` used to revert every time (GH#370). ~keep
# NOTE: one combined `any(...)` entry, NOT one per OS. The core `xberg` dep above
# already emits its own `cfg(target_os = "ios")` and `cfg(target_os = "android")`
# blocks, so per-OS entries here would emit a second table with an identical cfg
# key and produce a duplicate-key TOML error in the generated manifest.
[[crates.swift.ffi_target_dep_overrides]]
cfg = 'any(target_os = "ios", target_os = "android")'
features = ["android-target"]
default_features = false

