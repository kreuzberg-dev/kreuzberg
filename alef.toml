  "unicorn/prefer-string-slice",
  "unicorn/prefer-top-level-await",
  "unicorn/prefer-type-error",
  "unicorn/require-module-specifiers",
]
# Alef-generated binding output — never hand-clean comments; regeneration owns them. ~keep
#
# The `quality` rules below are suppressed on these same paths for a second, distinct reason.
# poly's quality tier measures function length, parameter count, file length, nesting depth and
# cyclomatic complexity — metrics written for hand-maintained code. A generated FFI surface cannot
# satisfy them and must not try: a binding function's parameter list mirrors the core API it
# wraps one-for-one, and a single-file binding crate is one file by construction. poly deliberately
# still REPORTS on generated files (only `--fix-generated` gates rewriting, and a `DO NOT EDIT`
# banner holds nothing back), so without these entries the metrics fire on every regeneration and
# no edit here could ever silence them — regeneration would revert it. Measured at 471 of the
# repository's 3,048 findings. The `astgrep` and language-specific rules stay ACTIVE on these
# paths on purpose: those catch real generator defects, and did — 8 `blocking-call-in-async-fn`
# hits in the php trait bridge survive this suppression and are tracked as codegen bugs. ~keep
".cargo/config.toml" = ["comment", "doc-comment"]
"Package.swift" = ["comment", "doc-comment"]
"packages/**" = [
  "comment",
  "doc-comment",
  "cyclomatic-complexity",
  "file-too-long",
  "function-too-long",
  "nesting-too-deep",
  "too-many-parameters",
  "type-too-long",
]
"crates/xberg-node/**" = [
  "comment",
  "doc-comment",
  "cyclomatic-complexity",
  "file-too-long",
  "function-too-long",
  "nesting-too-deep",
  "too-many-parameters",
  "type-too-long",
]
# `blocking-call-in-async-fn` is a FALSE POSITIVE on this generated bridge. Every
# `WORKER_RUNTIME.block_on` sits in the `else` arm of
# `if let Ok(handle) = tokio::runtime::Handle::try_current()`, so it runs only when no
# runtime exists -- never nested inside a live one. The astgrep rule is lexical and cannot
# see the guard. Verified at all 8 sites. ~keep
"crates/xberg-php/**" = [
  "comment",
  "doc-comment",
  "blocking-call-in-async-fn",
  "cyclomatic-complexity",
  "file-too-long",
