# dev-only, never part of the published package's dependency graph. ~keep
[crates.wasm.extra_dev_dependencies]
wasm-bindgen-test = "0.3"

# The generated FFI lib.rs is written whole by alef and declares no modules of its
# own, so a hand-written sibling file in crates/xberg-ffi/src/ is unreachable from
# the crate root: never compiled, absent from the cdylib symbol table, and correctly
# absent from xberg.h. That silently killed 34 `extern "C"` functions when the
# hand-written lib.rs was replaced by a generated one -- cancellation.rs (4),
# config_builder.rs (19) and config/mod.rs (11) -- a link-time break for any C
# consumer, not a header cosmetic. These three wrap `CancellationToken` and the
# config builder, which are `alef(skip)`ed on purpose because they need a
# hand-authored opaque-handle surface alef cannot derive. Declaring them here is
# what makes them part of the crate again. `pub mod` alone is right: `no_mangle`
# symbols export regardless of module visibility, cbindgen parses the whole crate,
# and a glob re-export would risk colliding with generated crate-root items. ~keep
[crates.custom_modules]
# Emptied when the three hand-written modules it named were deleted. alef only
# *declares* a custom module in the generated lib.rs; it never generates the
# contents, so every name here must have a hand-written file behind it or
# generation aborts. `cancellation`, `config_builder` and `config` had rotted --
# 2073 lines and 34 `extern "C"` fns referencing `crate::helpers`,
# `crate::ffi_panic_guard` and `config/{html,parse}.rs`, none of which exist --
# and were never in the shipped ABI: not one appeared among the 2525
# declarations in `include/xberg.h`, because no `mod` statement ever compiled
# them. Re-add a name here only alongside a module that builds. ~keep
ffi = []

[crates.ffi]
prefix = "xberg"
header_name = "xberg.h"
lib_name = "xberg_ffi"
visitor_callbacks = false
# Declare `full-no-heic` as an opt-in passthrough (kept out of `default`) so the
# swift-bridge shim can depend on `xberg-ffi` with that feature — heic's
# `libheif-sys` build.rs cannot cross-compile. Not part of the auto-generated
# passthrough set, so it must be listed here.
#
# `pdf-pdfium` is here for the same reason and must stay out of `default`: the
# engine dlopen()s libpdfium at run time, so compiling it in by default would
# hand every FFI consumer a backend that fails with MissingDependency unless
# they install the library themselves. Declaring it here gives the go/csharp/
# zig/java/C consumers who build libxberg_ffi themselves a documented opt-in at
# zero cost to everyone else. `extra_features` exists only on `[crates.ffi]`
# and `[crates.wasm]`, so the other bindings have no declare-only key and
# cannot be given the same opt-in without an alef change.
#
# `ocr-wasm` appears in emitted `any(feature = "ocr", feature = "ocr-wasm")`
# gates. Alef declares every discovered gate and otherwise enables it by default,
# even though desktop FFI already satisfies those gates through `ocr`. Keep the
# WASM alternative declared for opt-in builds without pulling it into native
# artifacts.
#
# `candle-ocr` is discovered from cfg gates elsewhere in the shared OCR surface,
# but native FFI packages do not ship Candle model backends. Declare the feature
# without enabling it by default so those artifacts remain lean and portable. ~keep
extra_features = ["full-no-heic", "pdf-pdfium", "ocr-wasm", "candle-ocr"]
# Feature list for the desktop `cfg(not(any(android,ios,windows,macos-x86_64)))`
# core dep. Without this override the FFI crate inherits the global
# `[[crates]].features`, whose first entry is `full` — that pulls `heic`
# (`libheif-sys`, no pkg-config cross-compile support) and `candle-*` into the
# swift-bundle's cross-compiled desktop dep, which broke Swift publishing in
# v1.0.12. This is the v1.0.11 granular floor: `full` minus heic/candle.
#
# Go, Java, C#, and Zig consume this one native library. Their feature arrays
# below MUST remain byte-for-byte equivalent to this list: Alef filters each
# host surface using its own literal feature names and cannot reference a shared
# TOML array. Language-specific exclusions belong in exclude_types/functions,
# not in divergent feature lists. ~keep
