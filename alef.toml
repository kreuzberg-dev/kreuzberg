  "translate_result",
  "find_footnote_anchors",
  "find_inference_markers",
  "parse_citations",
  "parse_footnote_definitions",
  "detect_qr_codes",
  "download_model",
  "find_all",
  "scan_text",
  "token_count",
  "default_model_name",
  "fingerprint",
  "known_models",
  "register_builtin",
  "resolve",

  # Both take `TokenizerSource<'a>`, a borrowed enum whose four variants mean
  # different things (HF model ID, model+revision pair, local `tokenizer.json`
  # path, embedded bytes). Alef cannot represent it across FFI, so it sanitizes
  # the parameter to a bare `String` — collapsing all four into one untyped
  # argument the caller has no way to disambiguate. Neither function appears in
  # any of the 15 generated bindings today, so excluding them removes nothing
  # from the published surface; it only stops a lossy one being fabricated.
  # Excluded rather than suppressed via `suppress_validation_codes` so
  # `lossy_sanitized_surface` stays armed for every other item. ~keep
  "try_count_tokens",
  "preload_tokenizer",

]

