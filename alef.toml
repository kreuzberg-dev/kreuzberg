[crates.e2e.env]
CRAWLBERG_ALLOW_PRIVATE_NETWORK = "true"
# The extract future is large enough in a debug build that `test_config_security_limits`
# overflows the default 2 MiB test-thread stack -- measured: it fails at 2304 KiB and passes
# at 2560 KiB. Every CI workflow already exports RUST_MIN_STACK=16777216, so CI never saw
# it and only local `task e2e:lang E2E_LANG=rust` runs failed. Emitted with force = false,
# so an explicit shell value still wins. Verified that cargo's [env] table does reach the
# test binary by running the failing test with the shell variable unset. ~keep
RUST_MIN_STACK = "16777216"

[crates.e2e.format]
python = "uv run --no-sync ruff check --fix {dir} && uv run --no-sync ruff format {dir}"
go = "gofmt -w {dir}"
rust = "(cd {dir} && cargo fmt --all)"

[crates.e2e.extra_system_libs]
zig = ["heif"]

[crates.e2e.fields]
chunks_have_content = "chunks_have_content"

[crates.e2e.fields_c_types]
"extraction_result.metadata" = "Metadata"

[crates.e2e.registry]
output = "test_apps"
github_repo = "https://github.com/xberg-io/xberg"

[crates.scaffold]
description = "High-performance document intelligence library"
license = "MIT"
repository = "https://github.com/xberg-io/xberg"
homepage = "https://xberg.io"
authors = ["Na'aman Hirschfeld <naaman@xberg.io>"]
keywords = ["document", "extraction", "pdf", "ocr", "text"]

[crates.scaffold.cargo]

[crates.scaffold.cargo.env]
CFLAGS_x86_64_pc_windows_msvc = "/MD"
CXXFLAGS_x86_64_pc_windows_msvc = "/MD"
CFLAGS_i686_pc_windows_msvc = "/MD"
CXXFLAGS_i686_pc_windows_msvc = "/MD"

[crates.readme]
template_dir = "templates/readme"
snippets_dir = "docs-site/src/snippets"
output_pattern = "packages/{language}/README.md"
discord_url = "https://discord.gg/xt9WY3GnKR"
banner_url = "https://github.com/user-attachments/assets/419fc06c-8313-4324-b159-4b4d3cfce5c0"

[crates.readme.targets.root]
template = "root.md"
name = "Xberg"
output_path = "README.md"

[crates.readme.targets.cli]
template = "cli.md"
name = "xberg-cli"
output_path = "crates/xberg-cli/README.md"

[crates.readme.languages.rust]
template = "rust.md"
output_path = "crates/xberg/README.md"
name = "Rust"
package_name = "xberg"
badge_url = "https://img.shields.io/crates/v/xberg?label=Rust&color=007ec6"
docs_url = "https://xberg.io/"
description = "High-performance document intelligence library for Rust. Extract text, tables, metadata, and code intelligence from 107 file formats and 371 programming languages."
package_manager = ["cargo"]
features = { ocr = true, async = true, plugin_system = true, embeddings = true, code_intelligence = true }
ocr_backends = ["tesseract", "paddleocr", "sceptre"]
optional_sections = ["system_requirements", "ocr_backends"]
snippets = { basic_extraction = "getting-started/basic_usage.md", async_extraction = "api/extract.md", batch_processing = "getting-started/extract_with_ocr.md", ocr_configuration = "ocr/ocr_extraction.md", table_extraction = "metadata/tables.md" }

[crates.readme.languages.python]
template = "python.md"
name = "Python"
package_name = "xberg"
badge_url = "https://img.shields.io/pypi/v/xberg?label=Python&color=007ec6"
docs_url = "https://xberg.io/"
description = "Extract text, tables, images, metadata, and code intelligence from 107 file formats and 371 programming languages including PDF, Office documents, images, and audio/video transcripts where native transcription is available. Native Python bindings with async/await support, multiple OCR backends (Tesseract, PaddleOCR, Sceptre), and extensible plugin system."
package_manager = ["pip"]
features = { ocr = true, async = true, plugin_system = true, embeddings = true, code_intelligence = true }
ocr_backends = ["tesseract", "paddleocr", "sceptre"]
optional_sections = ["async_vs_sync_performance", "ocr_backends", "system_requirements"]
snippets = { basic_extraction = "getting-started/basic_usage.md", async_extraction = "api/extract.md", batch_processing = "getting-started/extract_with_ocr.md", ocr_configuration = "getting-started/hello_world.md", table_extraction = "getting-started/read_content.md" }

[crates.readme.languages.typescript]
