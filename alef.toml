[workspace.poly.per-file-ignores]
# Alef-generated config files. Both grow with the size of the surface alef manages and
# with the quality-debt baseline below; a line count on generated config is not a
# maintainability signal. ~keep
"poly.toml" = ["file-too-long"]
".alef-toml-merge-provenance.toml" = ["file-too-long"]
# --- quality-debt baseline (generated) ---
# 865 size/complexity findings across 422 files that predate these
# metrics. Listed per file rather than switching the rules off, so the metrics still
# fire on every file NOT listed here -- new code stays covered, and each path below is
# one discrete unit of work.
# TODO(xberg-io/xberg#1567): pay this down file by file and delete each entry as it goes green.
# Do not add new paths here without a very good reason. ~keep
".github/workflows/benchmarks.yaml" = ["file-too-long"]
".github/workflows/profiling.yaml" = ["file-too-long"]
".github/workflows/publish.yaml" = ["file-too-long"]
"CHANGELOG.md" = ["file-too-long"]
"alef.toml" = ["file-too-long"]
"crates/xberg-candle-ocr/src/models/deepseek_ocr/engine.rs" = ["function-too-long"]
"crates/xberg-candle-ocr/src/models/deepseek_ocr/model.rs" = [
  "file-too-long",
  "function-too-long",
