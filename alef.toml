[crates.wasm]
package_name = "@xberg-io/xberg-wasm"
# Publish only the `web` (ES module) target. Each wasm-pack target embeds a full
# copy of the ~40MB wasm binary; shipping all four exceeded jsdelivr's 150MB CDN
# limit and broke the docs live demo. The `web` build serves browsers, CDNs,
# bundlers, Deno (npm:), and Node 22+. ~keep
targets = ["web"]
features = [
  "wasm-target",
  "url-ingestion",
  # Unlike the entries below, this is a genuinely new dependency, not something
  # already compiled in transitively: `simd-utf8` is only pulled in by the
  # `default` feature set, and xberg-wasm's Cargo.toml depends on xberg with
  # `default-features = false`, so it has never been active here. Pure-Rust
  # `simdutf8` crate: an explicit `target_arch = "wasm32", target_feature =
  # "simd128"` path with a scalar fallback when simd128 is absent, no other
  # deps. Expect a small (not free) size increase -- watch the 50MB jsDelivr
  # cap when measuring the regen.
  "simd-utf8",
  # Deliberately NOT swapped for "url-ingestion-browser": that alias is
  # `url-ingestion + crawlberg/browser`, and in crawlberg's own Cargo.toml
  # `browser = ["browser-chromiumoxide"]` -> `dep:chromiumoxide, dep:dirs,
  # native-runtime`. chromiumoxide drives a real Chrome process over CDP; it
  # is an unconditional (non-target-gated) optional dependency in crawlberg,
  # not vetted for wasm32, and its own feature re-enables `native-runtime`
  # rather than replacing it -- so both runtimes would end up active at once,
  # which is worse than the status quo. Making the two mutually exclusive
  # needs an upstream crawlberg change; until then this stays "url-ingestion".
  # Listed literally because alef matches `#[cfg(feature = "...")]` against this
  # exact list rather than resolving Cargo's feature graph, so the `wasm-target`
  # alias alone satisfies no leaf gate and the generator drops the gated field
  # (#244). Both are already active transitively via wasm-target -> no-ort-target
  # -> keywords, so this adds no dependency and no wasm bytes. ~keep
  "keywords-yake",
  "keywords-rake",
  # Same reasoning as keywords-yake/keywords-rake above (#244): both are already
  # active transitively via wasm-target -> no-ort-target -> pdf / -> heuristics,
  # so listing them here adds no dependency and no wasm bytes -- it only makes
  # them visible to alef's literal cfg match.
  # "pdf": PdfConfig/HierarchyConfig are plain scalars + Option<Vec<String>> +
  # a crate-root-exported nested config -- no foreign types, no known blocker. ~keep
  "pdf",
  # "heuristics": fixes the extraction_confidence half of #244. The blocker was
  # never a missing feature flag -- ExtractionConfidence was never re-exported
  # at the crate root (see crates/xberg/src/lib.rs), so any codegen referencing
  # it would have failed regardless of this list. Re-export added; the type's
  # only field dependency (SchemaCompliance) is already crate-root exported
  # under this same feature. The ConversionOptions and WasmPageRange/PageRange
  # objections below do not apply to this field.
  "heuristics",
  # (#252) layout-types / transcription-types are `[]` in xberg's Cargo.toml --
  # zero-dependency, type-only leaves -- and "html" is already compiled into
  # xberg-wasm unconditionally (html-to-markdown-rs is a direct dependency in
  # crates/xberg-wasm/Cargo.toml), so adding it as a leaf here adds only the
  # small v_htmlescape crate. Listing all three makes their gated binding
  # fields survive generation without adding meaningful wasm bytes. ~keep
  "layout-types",
  "transcription-types",
  "html",
  # "hwpx": now enabled on `wasm-target` in crates/xberg/Cargo.toml (unhwp target-gates its
  # `zip` dep to a deflate-only, lzma-free variant for wasm32 — see the comment there). Listed
  # literally because alef matches leaf cfg strings, same reasoning as keywords-yake/rake above.
  "hwpx",
  # NOT listed yet, pending a one-at-a-time regen: "layout-types",
  # "transcription-types", "html".
  # - "layout-types" / "transcription-types": LayoutDetectionConfig, LayoutStrategy,
  #   TableModel, TranscriptionConfig, WhisperModel are all crate-root exported,
  #   plain scalar/enum fields. No known blocker; untried in isolation.
  # - "html": html_options: Option<html_to_markdown_rs::ConversionOptions> is a
  #   foreign type with no crate-root re-export and no TypeDef in the IR, so
  #   alef's first_unknown_named_type check should drop it via the ALEF-OMITTED
  #   marker rather than hard-failing -- but grep -c ALEF-OMITTED
  #   crates/xberg-wasm/src/lib.rs is 0 today, so that path is untested here.
  #   HtmlOutputConfig.css_file (PathBuf) maps through WasmMapper::path() -> String
  #   and should be fine. The prior "WasmPageRange/PageRange mismatch" concern
  #   does not appear anywhere in alef's wasm backend source -- treat it as
  #   unverified until an actual regen surfaces it. ~keep
]
# tract layout/orientation weights push the release .wasm past jsdelivr's 50MB
# per-file cap when wasm-pack's default wasm-opt is off. Run wasm-opt -Oz to
# claw the binary back under the cap. ~keep
wasm_opt = ["-Oz"]
# Hand-written modules (src/bridge/, src/engine.rs): the injectable OCR bridge
# and the stateful XbergEngine handle. alef declares them in the generated
# lib.rs but does not manage their contents. ~keep
custom_rust_modules = ["bridge", "engine"]
# Keep Sceptre out of the default browser artifact; consumers opt into the
# byte-fed engine when their deployment can host the models. ~keep
extra_features = ["sceptre-wasm"]
exclude_types = ["OcrFallbackDecision", "OcrProcessor", "OcrCacheStats", "TessdataManager", "PageLayoutResult"]
exclude_functions = [
  "embed_texts",
  "embed_text",
  "detect_layout",
