precondition = "command -v wasm-pack >/dev/null 2>&1"
before = "bash scripts/e2e/build-mock-server.sh && wasm-pack build crates/xberg-wasm --release --target nodejs --out-dir pkg/nodejs && node crates/xberg-wasm/scripts/fix-wasi-imports.mjs && cd e2e/wasm && pnpm install --ignore-workspace"
e2e = "cd e2e/wasm && pnpm test"

[crates.test.rust]
