[crates.readme.languages.ffi]
template = "language_package.md"
output_path = "crates/xberg-ffi/README.md"
name = "FFI (C/C++)"
package_name = "xberg-ffi"
badge_url = "https://img.shields.io/badge/C%2FC%2B%2B-xberg--ffi-007ec6"
docs_url = "https://xberg.io/"
description = "Extract text, tables, images, metadata, and code intelligence from 107 file formats and 371 programming languages including PDF, Office documents, images, and audio/video transcripts where native transcription is available. C/C++ FFI bindings providing a stable ABI for native integration, shared library distribution, and cross-language interop."
package_manager = ["cargo"]
# `async = false`: the C ABI is synchronous, so the template's async section ("full
# async/await support") would be untrue here, and there is deliberately no
# `async_extraction` snippet under `docs-site/src/snippets/c/`. With `async = true`
# the template still rendered the section, `snippets.async_extraction` resolved to
# nothing, and `include_snippet` tried to read the bare `snippets/c/` directory --
# failing the whole docs render. ~keep
features = { ocr = true, async = false, plugin_system = true, embeddings = true, code_intelligence = true }
# The FFI README's quick-start examples are C code, and `docs-site/src/snippets/`
# only maintains one such set under `c/` (shared with the e2e C consumer) rather
# than a duplicate `ffi/` directory. `snippet_language` (alef >=0.54.1) points
# the README's `include_snippet(language)` calls at that directory while leaving
# `language == "ffi"` intact for template branching (installation steps, etc.). ~keep
snippet_language = "c"
snippets = { basic_extraction = "getting-started/basic_usage.md", batch_processing = "getting-started/extract_with_ocr.md", ocr_configuration = "ocr/ocr_extraction.md", table_extraction = "metadata/tables.md" }

