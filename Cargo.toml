[workspace]
members = [
    "crates/ttf-parser-compat",
    "crates/xberg",
    "crates/xberg-candle-ocr",
    "crates/xberg-cli",
    "crates/xberg-ffi",
    "crates/xberg-gliner",
    "crates/xberg-jni",
    "crates/xberg-libheif",
    "crates/xberg-libwpd",
    "crates/xberg-node",
    "crates/xberg-paddle-ocr",
    "crates/xberg-php",
    "crates/xberg-py",
    "crates/xberg-tesseract",
    "crates/xberg-wasm",
    "packages/dart/rust",
    "packages/swift/rust",
    "tools/benchmark-harness",
]
exclude = ["e2e/rust", "packages/elixir/native/xberg_nif", "packages/ruby/ext/xberg_rb"]
default-members = ["crates/xberg", "crates/xberg-cli"]
resolver = "2"

[workspace.package]
version = "1.1.0"
edition = "2024"
rust-version = "1.91"
authors = ["Na'aman Hirschfeld <naaman@xberg.io>"]
license = "MIT"
repository = "https://github.com/xberg-io/xberg"
homepage = "https://xberg.io"

[workspace.lints.rust]
unsafe_code = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(alef)', 'cfg(feature, values("alef-meta"))'] }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
# Diagnostics belong in `tracing` (stderr), not raw stdout/stderr writes. The CLI's
# actual data output opts back in locally via `#[expect(clippy::print_stdout)]`;
# build-script `cargo:` directives are exempt natively. ~keep
print_stdout = "deny"
print_stderr = "deny"
dbg_macro = "deny"

[workspace.dependencies]
ahash = { version = "0.8.12", features = ["serde"] }
anyhow = "1.0"
async-trait = "0.1.92"
base64 = "0.23.1"
blake3 = "1"
bytes = { version = "1", features = ["serde"] }
candle-core = { version = "0.11", default-features = false }
candle-nn = { version = "0.11", default-features = false }
candle-transformers = { version = "0.11", default-features = false }
cc = "1.4"
cfb = "0.14"
chrono = "0.4"
clap = { version = "4.6", features = ["derive", "color", "suggestions"] }
comrak = { version = "0.54", default-features = false }
console_error_panic_hook = "0.1"
crawlberg = { version = "1.2.1", default-features = false }
criterion = { version = "0.8", features = ["html_reports"] }
dbase = "0.8"
flate2 = "1.1"
fs2 = "0.4.3"
futures = "0.3"
getrandom = { version = "0.4.3", features = ["wasm_js"] }
hex = "0.4.3"
html-to-markdown-rs = { version = "3.10", default-features = false }
image = { version = "0.25.10", default-features = false }
itertools = "0.15"
js-sys = "0.3"

lazy_static = "1.5.0"
libc = "0.2.189"
# Builds a bundled zlib from source (`static`) for the target, so the vendored
# librevenge RVNGZipStream.cpp can `#include <zlib.h>` and link zlib even under
# cross-compilation (zigbuild aarch64/musl) where no host libz is usable.
# Only consumed by crates/xberg-libwpd. ~keep
libz-sys = { version = "1.1", features = ["static"] }
liter-llm = { version = "1.16.0", default-features = false }
log = "0.4"
memmap2 = "0.9"
minijinja = "2"
nom-exif = { version = "3.6", default-features = false }
num_cpus = "1.17.0"
once_cell = "1.21.4"

ort = { version = "2.0.0-rc.13", default-features = false, features = ["std", "api-18"] }
parking_lot = "0.12.5"
pdf_oxide = { version = "0.3.77", default-features = false, features = ["rendering", "legacy-crypto"] }
rayon = "1.12.0"
reqwest = { version = "0.13.4", default-features = false }
# SVG rendering (resvg re-exports tiny_skia and usvg; default-features = false
# drops text, system-fonts, memmap-fonts, raster-images — all pure-Rust, WASM-safe).
resvg = { version = "0.48", default-features = false }
rusqlite = { version = "0.40", features = ["bundled"] }
sceptre = { version = "0.6.0", default-features = false }

serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151" }
serde_toon_format = "0.1"
sha2 = "0.11"
similar = "3"
sqlite-vec = "0.1"
tar = "0.4"
tempfile = "3.27.0"
thiserror = "2.0.20"
# `process`, `fs`, and `rt-multi-thread` are deliberately excluded from this baseline: tokio's
# own wasm32 gate (tokio-1.x src/lib.rs) hard-`compile_error!`s unless only
# sync/macros/io-util/rt/time are active (`process` additionally pulls mio's
# `net`/`os-poll`/`os-ext`, which fails to build on wasm32 regardless). These OS-dependent
# features are re-added only on consuming crates' `[target.'cfg(not(target_arch =
# "wasm32"))'.dependencies]` blocks (see crates/xberg/Cargo.toml and crates/xberg-cli/Cargo.toml).
tokio = { version = "1.53.1", features = [
    "rt",
    "macros",
    "sync",
    "time",
    "io-util",
] }
toml = "1.1.4"
tracing = "0.1"
# Pure-Rust ONNX inference engine (Sonos). Alternative InferenceBackend to `ort` on
# no-ORT targets (wasm32, x86_64-linux-android). The ONNX frontend crate is CPU-only
# and WASM-safe; the top-level `tract` facade instead defaults to CUDA and bundles
# GPU backends, so it is unusable here. See issue #1275.
tract-onnx = { version = "0.23.4", default-features = false }
tree-sitter-language-pack = { version = "1.14.3", default-features = false, features = ["serde"] }
url = "2.5.8"
# usvg (re-exported by resvg) with only the `writer` feature so `Tree::to_string`
# / `WriteOptions` are available for SVG sanitize re-serialization. `writer` pulls
# just xmlwriter + base64 — pure-Rust, WASM-safe, no fonts. resvg 0.48 forwards no
# `writer` feature of its own, so usvg is enabled directly; versions unify at 0.48.
usvg = { version = "0.48", default-features = false, features = ["writer"] }
wasm-bindgen = { version = "0.2", features = ["enable-interning"] }
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "Blob",
    "File",
    "FileReader",
    "console",
    "TextDecoder",
    "ImageData",
    "Window",
    "Response",
] }
xberg = { path = "./crates/xberg", version = "1.1.0", default-features = false }
xberg-gliner = { path = "./crates/xberg-gliner", version = "1.1.0", default-features = false }

[patch.crates-io]
xberg = { path = "crates/xberg" }
xberg-gliner = { path = "crates/xberg-gliner" }
xberg-tesseract = { path = "crates/xberg-tesseract" }
xberg-paddle-ocr = { path = "crates/xberg-paddle-ocr" }
xberg-candle-ocr = { path = "crates/xberg-candle-ocr" }
# Redirects the transitive ttf-parser used by pdf_oxide and fontdb onto
# xberg-ttf-parser, which carries the CFF dotsection fix and eight other fixes
# unreleased upstream. Cargo matches patch entries on package name alone, so the
# redirect goes through a name-compat shim; see crates/ttf-parser-compat.
#
# EXPOSURE: [patch] only rewrites resolution for builds going through this
# workspace root. Anyone who depends on published `xberg` (crates.io, currently
# 1.0.14) from their own Cargo.toml pulls pdf_oxide's and fontdb's real,
# unpatched ttf-parser instead, with none of these nine fixes. The dotsection
# one is user-visible: xberg's `pdf` feature silently drops the i, j, period,
# colon, semicolon, exclamation, and question-mark glyphs of any CFF font that
# uses the deprecated `dotsection` operator (e.g. distiller-produced Type 1C
# subsets) when rendering a page to an image. There is no workaround for those
# consumers short of this fix shipping from upstream ttf-parser itself.
#
# STATUS (checked 2026-08-06, re-verify before touching this entry):
# harfbuzz/ttf-parser#228 (dotsection) is merged to upstream `main`, but
# nothing is tagged or published — crates.io still serves 0.25.1, the same as
# GitHub's newest tag (v0.25.1). The backport-to-0.25.2 proposal (#229) was
# closed and folded into #228, so no 0.25.x patch release is in flight. The
# fix now only ships via the next `main` release, tracked as 0.26.0 in
# harfbuzz/ttf-parser#242 (also closed, blocked on crates.io publish access,
# no tag cut). Even once 0.26.0 publishes, it will NOT satisfy pdf_oxide's and
# fontdb's `ttf-parser = "^0.25"` requirement — 0.x caret ranges do not cross a
# minor version — so this patch stays load-bearing until pdf_oxide and fontdb
# themselves widen that requirement and re-publish. Do not drop this entry on
# the assumption that a release landed; confirm crates.io serves >=0.25.2 (or
# pdf_oxide/fontdb accept 0.26) first.
ttf-parser = { path = "crates/ttf-parser-compat" }

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
strip = true

# Archive crates crash with SIGBUS under opt-level=3 on macOS ARM64.
# Reduce optimization to prevent miscompilation of unsafe code.
# sevenz-rust2 requires opt-level=1 specifically (opt-level=2 still SIGBUS'd in go:e2e).
[profile.release.package.sevenz-rust2]
opt-level = 1

[profile.release.package.zip]
opt-level = 2

# WASM size optimization: reduce memory spikes during compilation
[profile.release.package.xberg-wasm]
opt-level = "z"

[profile.dev]
opt-level = 0
debug = true

[profile.profiling]
inherits = "release"
debug = true
strip = false
