version: "3"
internal: true

tasks:
  update:
    desc: "Update Node.js dependencies within major versions (pnpm up)"
    silent: false
    cmds:
      - cmd: |
          pnpm up
        ignore_error: false

  upgrade:
    desc: "Upgrade Node.js dependencies to latest including breaking changes (pnpm up --latest)"
    silent: false
    cmds:
      - cmd: |
          pnpm up --latest
        ignore_error: false
      # Generated e2e/wasm harness is a standalone pnpm project (installed with
      # --ignore-workspace); refresh its lock so `task upgrade` covers e2e. ~keep
      - cmd: |
          cd e2e/wasm && pnpm up --latest --ignore-workspace
        ignore_error: true
