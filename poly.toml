# diagnostic is wrong -- it is right, and it is the only signal we have for a real alef defect.
# The unused `result` binding comes from the fixture's own `docs.presentation.operations[].item`
# (see fixtures/batch/extract_batch_uri_basic.json): the Python emitter writes the binding from
# that recipe but not the iterate/assert that consumes it, so 39 generated tests across 8 files
# call the API and assert nothing. Auto-fixing `result =` to `_ =` would be reverted by the next
