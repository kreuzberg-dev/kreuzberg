[package]
name = "xberg-pdfium-render"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "High-level idiomatic Rust wrapper around Pdfium. Fork of pdfium-render with Xberg patches."
license = "MIT"
repository.workspace = true
homepage = "https://xberg.io"
documentation = "https://docs.rs/xberg-pdfium-render"
keywords = ["pdf", "pdfium", "rendering", "extraction"]
categories = ["api-bindings", "multimedia::images"]
readme = "README.md"
build = "build.rs"
exclude = ["include/**/rust-import-wrapper.h"]

[package.metadata.cargo-machete]
ignored = ["bindgen"]

[lib]
name = "pdfium_render"
crate-type = ["lib"]
doctest = false

[features]
default = ["image_latest", "thread_safe"]
bindings = ["dep:bindgen"]
thread_safe = []

# Image
image_latest = ["image_025"]
image_025 = ["dep:image_025"]

[dependencies]
bitflags = "2"
bytemuck = "1"
chrono = { workspace = true }
image_025 = { package = "image", version = "0.25", optional = true, default-features = false, features = ["jpeg"] }
itertools = { workspace = true }
log = { workspace = true }
maybe-owned = "0.3"
once_cell = { workspace = true }
utf16string = "0.2"
vecmath = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
libloading = "0.9"

[build-dependencies]
bindgen = { version = "0.73", optional = true }

[lints.rust.unexpected_cfgs]
level = "allow"
check-cfg = ['cfg(pdfium_use_static)']
