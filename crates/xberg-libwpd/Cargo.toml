[package]
name = "xberg-libwpd"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "WordPerfect (.wpd) text extraction for Xberg via libwpd + librevenge, built from vendored source (MPL-2.0 arm)"
license = "MIT"
repository.workspace = true
homepage = "https://xberg.io"
readme = "README.md"
keywords = ["wordperfect", "libwpd", "document", "extraction", "bindings"]
categories = ["external-ffi-bindings", "text-processing"]
build = "build.rs"
links = "xberg_libwpd"

# libz-sys is never `use`d by path — it is declared purely so its build script
# statically compiles zlib and exports `DEP_Z_INCLUDE`/links the symbols into
# this crate's build.rs (see the target block below), so cargo-machete cannot
# see a source reference. `cc`, `flate2`, `sha2`, and `tar` were previously
# listed here too, but all four are referenced by path in build.rs (cc::Build,
# flate2::read::GzDecoder, sha2::Sha256, tar::Archive), which cargo-machete's
# textual scan already covers. ~keep
[package.metadata.cargo-machete]
ignored = ["libz-sys"]

[lib]
name = "xberg_libwpd"
crate-type = ["lib"]

[dependencies]
thiserror = { workspace = true }
tracing = { workspace = true }

# zlib for the vendored librevenge RVNGZipStream (used by RVNGStreamImplementation
# to read structured/zip streams). libz-sys builds a static zlib from source for
# the target and exports `DEP_Z_INCLUDE` to this crate's build script, so the C++
# sources compile and link zlib without a host libz — on every desktop target,
# including Windows/MSVC (which previously relied on a vcpkg-installed zlib that
# CI did not reliably provide).
[target.'cfg(any(target_os = "linux", target_os = "macos", target_os = "windows"))'.dependencies]
libz-sys = { workspace = true }

# libwpd and librevenge are built from vendored C++ source archives under
# vendor/ (decompressed by build.rs at build time), so the native toolchain
# and the decompress/verify deps are only needed on the desktop targets that
# actually compile them. WordPerfect support is gated off wasm/android.
[target.'cfg(any(target_os = "linux", target_os = "macos", target_os = "windows"))'.build-dependencies]
cc = { workspace = true }
flate2 = { workspace = true }
sha2 = { workspace = true }
tar = { workspace = true }
