[package]
name = "xberg-tesseract"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Rust bindings for Tesseract OCR with cross-compilation, C++17, and caching improvements"
license = "MIT"
repository.workspace = true
homepage = "https://xberg.io"
documentation = "https://docs.xberg.io"
readme = "README.md"
keywords = ["tesseract", "ocr", "bindings", "vision", "recognition"]
categories = ["external-ffi-bindings", "computer-vision", "text-processing"]
build = "build.rs"
links = "xberg_tesseract"
exclude = ["tessdata/*", "third_party/*"]

[package.metadata.docs.rs]
features = ["docs-only"]
rustdoc-args = ["--cfg", "docsrs"]

[lib]
name = "xberg_tesseract"
crate-type = ["lib"]

[features]
default = ["static-linking"]
build-tesseract = ["cc", "cmake", "reqwest", "zip"]
build-tesseract-wasm = ["cmake", "reqwest", "zip"]
# Bundle eng.traineddata into the compiled crate so WASM builds can run OCR
# without runtime tessdata loading. Uses ~4 MB of binary size (tessdata_fast).
bundle-tessdata-eng = []
static-linking = ["build-tesseract"]
dynamic-linking = []
# Link the host's Tesseract and Leptonica instead of downloading and building vendored copies,
# for a build with no network access such as a conda-forge recipe or a distro package.
#
# `build-tesseract` is included because it gates the FFI declarations, not because anything is
# built: `main` in build.rs gives `dynamic-linking` precedence and skips the vendored path. The
# gating is why `dynamic-linking` cannot stand alone today -- without `build-tesseract` the
# extern blocks vanish and the crate fails to compile. Untangling that spans 38 sites across six
# cfg shapes, including inverted ones selecting stub implementations, so it is left as separate
# work rather than folded in here. ~keep
system-linking = ["build-tesseract", "dynamic-linking"]

[dependencies]
thiserror = { workspace = true }

[build-dependencies]
cc = { version = "^1.4.4", optional = true }
cmake = { version = "0.1.58", optional = true }
zip = { version = ">=7.0.0", optional = true, default-features = false, features = ["deflate-flate2-zlib-rs"] }

[target.'cfg(not(target_os = "windows"))'.build-dependencies]
reqwest = { workspace = true, default-features = false, features = ["blocking", "rustls"], optional = true }

# Use native-tls on Windows to avoid aws-lc-sys CMake build issues with MinGW
[target.'cfg(target_os = "windows")'.build-dependencies]
reqwest = { workspace = true, default-features = false, features = ["blocking", "native-tls"], optional = true }

[dev-dependencies]
image = { workspace = true, features = ["png"] }
